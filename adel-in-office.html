<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Adel in the office · Microsoft Indonesia</title>
<style>
:root{--ink:#f6efe4;--muted:#b8afc6;--adel:#a78bfa;--sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0c0b16;color:var(--ink);font-family:var(--sans);overflow:hidden}
.hero{position:relative;width:100vw;height:100vh;min-height:420px}
#stage{position:absolute;inset:0;cursor:grab;touch-action:none}
#stage:active{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#tag{position:absolute;left:0;top:0;max-width:min(380px,70vw);padding:6px 12px 7px;border-radius:12px;background:rgba(20,16,32,.88);border:1.5px solid var(--adel);
  box-shadow:0 0 18px rgba(167,139,250,.45),0 6px 14px rgba(0,0,0,.35);will-change:transform;backdrop-filter:blur(3px);margin-top:-10px}
#tag::after{content:"";position:absolute;left:calc(50% + var(--ax,0px));bottom:-7px;width:11px;height:11px;transform:translateX(-50%) rotate(45deg);background:rgba(20,16,32,.94);
  border-right:1.5px solid var(--adel);border-bottom:1.5px solid var(--adel)}
#tag .r1{display:flex;align-items:center;gap:7px;line-height:1.15;white-space:nowrap}
#tag .r1 i{width:9px;height:9px;border-radius:50%;background:var(--adel);box-shadow:0 0 8px var(--adel)}
#tag b{font-size:14px;font-weight:700;color:#fff}
#tag .role{font-size:11px;color:#d9ccff}
#tag .msg{display:block;margin-top:3px;font-size:12.5px;line-height:1.3;font-weight:600;color:#fff;min-height:1.3em}
#tag .msg::after{content:"";display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-2px;background:#d9ccff;animation:blink 1s steps(2) infinite}
#tag.moving .msg{color:#d9ccff;font-weight:500;font-style:italic}
#tag.moving .msg::after{display:none}
@keyframes blink{50%{opacity:0}}
.brand{position:absolute;left:22px;top:18px;display:flex;align-items:center;gap:12px;pointer-events:none}
.ms{display:grid;grid-template-columns:repeat(2,11px);gap:2px}
.ms span{width:11px;height:11px}
.brand b{display:block;font-size:17px;font-weight:700;letter-spacing:.2px}
.brand small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
#hint{position:absolute;right:20px;top:18px;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;font-size:12px;color:#efe6ff;
  background:rgba(20,16,32,.7);border:1px solid rgba(167,139,250,.5);pointer-events:none;transition:opacity .8s}
#hint.gone{opacity:0}
#hint svg{width:16px;height:16px}
.foot{position:absolute;left:0;right:0;bottom:0;padding:0 14px 2.2vh;display:flex;justify-content:center;pointer-events:none}
#steps{display:flex;align-items:stretch;justify-content:center;gap:0;max-width:calc(100vw - 28px);padding:10px 8px 11px;pointer-events:auto;
  border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(255,255,255,.06),0 18px 40px rgba(0,0,0,.38)}
.phase{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 10px}
.phase+.phase{border-left:1px solid rgba(255,255,255,.14)}
.phase>h2{--c:#00a4ef;margin:0;display:flex;align-items:center;gap:7px;padding:4px 12px 5px;border-radius:999px;font:600 10.5px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#fff;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.phase>h2::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.phase.prep>h2{--c:#00a4ef}.phase.act>h2{--c:#f25022}.phase.deb>h2{--c:#7fba00}
.acts{display:flex;justify-content:center;gap:6px}
#steps button{--p:0;position:relative;overflow:hidden;appearance:none;cursor:pointer;white-space:nowrap;color:rgba(255,255,255,.82);font:500 12.5px/1.2 var(--sans);
  padding:8px 14px 9px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 8px rgba(0,0,0,.18);
  transition:background .25s,border-color .25s,color .25s,box-shadow .25s,transform .15s}
#steps button::after{content:"";position:absolute;left:14px;right:14px;bottom:3px;height:2px;border-radius:2px;background:linear-gradient(90deg,#f25022,#7fba00,#00a4ef,#ffb900);
  transform-origin:0 50%;transform:scaleX(var(--p));opacity:.95}
#steps button:hover{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));border-color:rgba(255,255,255,.28)}
#steps button:active{transform:scale(.97)}
#steps button.on{color:#fff;font-weight:650;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.12));border-color:rgba(255,255,255,.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 0 1px rgba(167,139,250,.35),0 6px 18px rgba(167,139,250,.35)}
#steps button:focus-visible{outline:2px solid var(--adel);outline-offset:2px}
#fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:#d9ccff;font-size:18px}
@media (max-width:1100px){#steps button{font-size:11.5px;padding:7px 10px 8px}#steps button::after{left:10px;right:10px}.acts{gap:4px}.phase{padding:0 6px}}
@media (max-width:820px){#steps{flex-wrap:wrap;row-gap:10px}.acts{flex-wrap:wrap}.phase+.phase{border-left:0}#steps button{font-size:11px;padding:6px 9px 7px}}
@media (max-width:640px){#hint{display:none}.brand small{display:none}}
</style>
</head>
<body>
<main class="hero" aria-label="Adel in the office">
  <div id="stage" role="img" aria-label="Interactive 3D miniature of Adel's homey, Microsoft-themed office with a Jakarta skyline and Monas outside the window. Adel works through her day: Researcher agent industry research, role-specific prompts in Bahasa Indonesia and English, a Copilot in PowerPoint deck, a Cowork tutorial skill, a matcha break, a live promptathon in Teams, same-day follow-up, learning notes on the sofa with Miffy, and a three-month adoption check. Drag to rotate the room 360 degrees."></div>
  <div id="tags"><div id="tag"><div class="r1"><i></i><b>Adel</b><span class="role">Solution Engineer – Copilot &amp; Agents</span></div><span class="msg"></span></div></div>
  <div class="brand"><div class="ms" aria-hidden="true"><span style="background:#f25022"></span><span style="background:#7fba00"></span><span style="background:#00a4ef"></span><span style="background:#ffb900"></span></div><div><b>Adel in the office</b><small>Microsoft Indonesia · Jakarta</small></div></div>
  <div id="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12a9 9 0 0 1 15.5-6.2M21 12a9 9 0 0 1-15.5 6.2"/><path d="M18.5 2.5v3.3h-3.3M5.5 21.5v-3.3h3.3"/></svg>Drag to rotate · 360°</div>
  <div class="foot">
    <nav id="steps" aria-label="Adel's workflow">
      <section class="phase prep" aria-label="Preparation"><h2>Preparation</h2><div class="acts"><button type="button">Research</button><button type="button">Use cases &amp; prompts</button><button type="button">Draft deck</button><button type="button">Tutorial</button></div></section>
      <section class="phase act" aria-label="Action"><h2>Action</h2><div class="acts"><button type="button">Promptathon</button></div></section>
      <section class="phase deb" aria-label="Debrief"><h2>Debrief</h2><div class="acts"><button type="button">Follow-up</button><button type="button">Learning notes</button><button type="button">3-month check</button></div></section>
    </nav>
  </div>
  <div id="fallback">Adel in the office</div>
</main>
