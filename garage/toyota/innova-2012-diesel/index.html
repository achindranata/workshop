/* Design language: cinematic dusk-blue product stage, near-black panels, hairline rules,
   squared display type (Garis Display) for headings & numerals, Geist for reading text. */
:root{
  --black:#060708; --panel:#0e1013; --panel2:#14171b; --ink:#eef0f3; --ink2:#c3c8cf; --muted:#8a9099; --faint:#5d636c;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16); --accent:#8fb8ff; --led:#4be38d;
  --warn:#ff8a73; --amber:#e9bd5a; --ok:#69d99a;
  --display:'Garis Display','Geist',system-ui,sans-serif; --font:'Geist','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--black);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:13px;cursor:pointer;color:inherit}
::selection{background:rgba(143,184,255,.35)}
*{scrollbar-width:thin;scrollbar-color:#2a2f36 transparent}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;height:68px;padding:0 26px;background:var(--black);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:22px;min-width:0}
.mk{display:flex;flex-direction:column;line-height:1}
.maker{font-family:var(--display);font-weight:500;font-size:10px;letter-spacing:.52em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.crumbs{display:flex;align-items:center;gap:8px;letter-spacing:inherit}
.crumbs a{color:var(--muted);text-decoration:none;transition:color .15s}
.crumbs a:hover,.crumbs a:focus-visible{color:#fff}
.crumbs i{font-style:normal;color:var(--faint);letter-spacing:0}
.crumbi{color:var(--muted);flex:0 0 auto;margin-inline-end:-2px}
.word{font-family:var(--display);font-weight:300;font-size:23px;letter-spacing:.3em;color:#fff;white-space:nowrap}
.t2{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);letter-spacing:.02em;min-width:0}
.t2 span:first-child{color:var(--ink2)}
.t2 .sep{width:1px;height:14px;background:var(--line2)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;height:100%}
.tabs button{background:transparent;border:0;color:var(--muted);padding:0 14px;height:100%;font-family:var(--display);font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase;position:relative}
.tabs button:hover{color:#fff}
.tabs button.on{color:#fff}
.tabs button.on::after{content:"";position:absolute;inset-inline:14px;bottom:-1px;height:1px;background:#fff}

/* ---------- 3D stage ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 440px;height:calc(100% - 68px)}
.viewport{position:relative;overflow:hidden;background:
  radial-gradient(70% 55% at 50% 60%,rgba(120,160,205,.16) 0%,rgba(0,0,0,0) 70%),
  linear-gradient(180deg,#1f3b58 0%,#17304a 26%,#10213a 52%,#0a1420 76%,#06090d 100%);transition:background .5s}
.viewport.dark{background:radial-gradient(80% 70% at 50% 45%,#13253b 0%,#0b1626 55%,#05080d 100%)}
#c3d{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.toolbar{position:absolute;inset-block-start:16px;inset-inline-start:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:6}
.views{position:absolute;inset-block-start:16px;inset-inline-end:16px;display:flex;flex-direction:column;align-items:stretch;gap:0;z-index:6}
.toolbar button,.views button,.sysbar button{background:rgba(6,9,13,.42);border:1px solid var(--line2);color:#e3e7ec;padding:7px 12px;border-radius:0;font-family:var(--display);font-weight:500;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .15s,color .15s,border-color .15s}
.views button{padding:7px 12px;font-size:10px;margin-top:-1px;text-align:end}
.toolbar button:hover,.views button:hover,.sysbar button:hover{border-color:rgba(255,255,255,.55);color:#fff}
.toolbar button.on,.views button.on{background:#fff;color:#07090c;border-color:#fff}
.seg{display:inline-flex}
.seg button+button{margin-inline-start:-1px}
.sysbar{position:absolute;inset-block-end:38px;inset-inline:16px;display:flex;gap:6px;flex-wrap:wrap;z-index:6}
.sysbar button{display:inline-flex;align-items:center;gap:0;font-size:10px;padding:6px 10px;letter-spacing:.12em}
.sysbar button.on{background:#fff;color:#07090c;border-color:#fff}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-inline-end:8px;vertical-align:1px}
.hint{position:absolute;inset-block-end:12px;inset-inline-start:16px;font-size:11px;color:rgba(255,255,255,.42);letter-spacing:.04em;z-index:6}

/* leader-line callouts */
.leads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}
.leads line{stroke:rgba(255,255,255,.75);stroke-width:1}
#hovDot{fill:#fff}
#selDot{fill:#fff}
#selRing{fill:none;stroke:var(--sc,#fff);stroke-width:1.5}
.tip,.co{position:absolute;inset-block-start:0;inset-inline-start:0;pointer-events:none;z-index:5;white-space:nowrap}
.tip{display:none;padding:2px 0 0 10px;border-inline-start:1px solid rgba(255,255,255,.75);background:rgba(4,7,11,.38)}
.tip b,.co b{display:block;font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.04em;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.65)}
.tip .tsys,.co .csys{display:flex;align-items:center;font-size:10px;font-family:var(--display);font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.7);text-shadow:0 1px 8px rgba(0,0,0,.7);margin-top:3px}
.tip .tsys .dot,.co .csys .dot{width:6px;height:6px;margin-inline-end:7px}
.co{display:none;padding:4px 0 2px 12px;border-inline-start:2px solid var(--sc,#fff);background:linear-gradient(90deg,rgba(4,7,11,.62),rgba(4,7,11,.35) 70%,rgba(4,7,11,0))}
.co b{font-weight:300;font-size:18px}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--black);z-index:20}
.lmark{font-family:var(--display);font-weight:300;font-size:26px;letter-spacing:.42em;color:#fff;padding-inline-start:.42em}
.lbar{width:180px;height:1px;background:var(--line2);overflow:hidden}
.lbar i{display:block;width:40%;height:100%;background:#fff;animation:lb 1.2s ease-in-out infinite}
@keyframes lb{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.ltext{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}

/* ---------- side panel ---------- */
.panel{background:var(--panel);border-inline-start:1px solid var(--line);overflow:hidden;position:relative}
.tabpane{display:none;height:100%;overflow:auto;padding:26px 28px 36px}
.tabpane.on{display:block}
#tab-list{padding:0}
h2{font-family:var(--display);font-weight:300;font-size:30px;line-height:1.14;letter-spacing:.01em;margin:6px 0 10px;color:#fff}
h3{font-family:var(--display);font-weight:500;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px;padding-top:16px;border-top:1px solid var(--line)}
p{margin:8px 0 12px}
b{color:#fff;font-weight:600}
.eyebrow,.sysline{display:flex;align-items:center;font-family:var(--display);font-weight:500;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2)}
.dhead{position:relative;padding-inline-end:40px}
.local{font-size:13px;color:var(--muted)}
.local b{color:var(--ink);font-weight:500}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.badge{font-family:var(--display);font-weight:500;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;padding:5px 9px 4px;border:1px solid var(--line2);color:var(--ink2);border-radius:0}
.badge.ess{border-color:rgba(233,189,90,.55);color:var(--amber)}
.badge.who-diy{border-color:rgba(105,217,154,.5);color:var(--ok)}
.badge.who-shop{border-color:rgba(255,138,115,.5);color:var(--warn)}
.badge.who-both{border-color:rgba(143,184,255,.5);color:var(--accent)}
.xbtn{position:absolute;inset-block-start:0;inset-inline-end:0;border:1px solid var(--line2);background:transparent;width:30px;height:30px;border-radius:0;color:var(--ink2);font-size:12px}
.xbtn:hover{border-color:#fff;color:#fff}
.what{font-size:15px;line-height:1.6;color:var(--ink2);margin-top:18px}
ul{margin:4px 0 8px;padding:0;list-style:none}
li{margin:0;padding:6px 0 6px 18px;position:relative;color:var(--ink2)}
li::before{content:"";position:absolute;inset-inline-start:0;top:14px;width:6px;height:1px;background:var(--ink2)}
ul.facts li::before{background:var(--accent);width:8px}
ul.warn li::before{background:var(--warn);width:8px}
ul.how li::before{background:#fff}
table{border-collapse:collapse;width:100%}
.care th{width:32%;text-align:start;vertical-align:top;font-family:var(--display);font-weight:500;font-size:12.5px;letter-spacing:.02em;color:#fff;padding:11px 14px 11px 0;border-bottom:1px solid var(--line)}
.care td{padding:11px 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink2)}
.care tr:first-child th,.care tr:first-child td{border-top:1px solid var(--line)}
.intervals{display:grid;grid-template-columns:1fr;gap:0}
.iv{display:flex;flex-direction:column;gap:4px;padding:10px 0 10px 16px;border-inline-start:1px solid var(--line2);margin-bottom:8px}
.iv span{font-size:10px;font-family:var(--display);font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.2em}
.iv b{font-family:var(--display);font-weight:300;font-size:19px;line-height:1.25;color:#fff;letter-spacing:.01em}
.rel,.ess-grid{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:transparent;border:1px solid var(--line2);border-radius:0;padding:6px 11px;font-size:12.5px;text-align:start;display:inline-flex;align-items:center;color:var(--ink)}
.chip:hover{border-color:#fff;background:rgba(255,255,255,.05)}
.chip .dot{width:6px;height:6px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:22px 0 4px;border-top:1px solid var(--line)}
.stat{padding:14px 0 14px 16px;border-bottom:1px solid var(--line)}
.stat:nth-child(odd){padding-inline-start:0;border-inline-end:1px solid var(--line)}
.stat:nth-child(even){padding-inline-start:18px}
.stat span{display:block;font-family:var(--display);font-weight:500;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font-family:var(--display);font-weight:300;font-size:34px;line-height:1.1;margin-top:6px;color:#fff;letter-spacing:.01em}
.stat b small{font-size:15px;font-weight:500;margin-inline-start:4px;color:var(--ink2);letter-spacing:.06em}
.intro .lede{font-size:15px;color:var(--ink2)}
.specs th{text-align:start;width:30%;font-family:var(--display);font-weight:500;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.specs td{padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink)}
.note{font-size:12px;color:var(--faint);margin-top:18px;line-height:1.55}
.searchrow{position:sticky;top:0;background:var(--panel);padding:18px 22px;border-bottom:1px solid var(--line);z-index:2}
#search{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:0;font:inherit;background:transparent;color:#fff;outline:none}
#search::placeholder{color:var(--faint)}
#search:focus{border-color:rgba(255,255,255,.6)}
.lgroup{border-bottom:1px solid var(--line)}
.lhead{display:flex;align-items:center;padding:18px 22px 8px;font-family:var(--display);font-weight:500;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2)}
.lhead .cnt{margin-inline-start:auto;color:var(--faint);letter-spacing:.1em}
.litem{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:start;background:transparent;border:0;padding:9px 22px 9px 37px;position:relative}
.litem:hover{background:rgba(255,255,255,.035)}
.litem.on{background:rgba(255,255,255,.06)}
.litem.on::before{content:"";position:absolute;inset-inline-start:22px;top:12px;bottom:12px;width:2px;background:#fff}
.lname{font-size:14px;color:var(--ink)}
.lloc{font-size:12px;color:var(--muted)}
.star{color:var(--amber);font-style:normal;font-size:11px}
.empty{padding:22px;color:var(--muted)}
.lead{color:var(--ink2)}
.sched{font-size:13px}
.sched th{text-align:start;padding:10px 12px 10px 0;font-family:var(--display);font-weight:500;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line2)}
.sched td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink2)}
.sched td:first-child{width:30%}
.sched td:first-child b{font-family:var(--display);font-weight:500;font-size:13px;color:#fff;letter-spacing:.02em}
.src{display:block;font-size:11px;color:var(--faint);margin-top:4px}
.checks li{padding:7px 0 7px 18px}
.callout{margin-top:22px;border-inline-start:2px solid var(--warn);background:rgba(255,138,115,.07);padding:14px 16px;color:var(--ink2)}
.callout b{color:#fff}
@media (max-width: 980px){
  .top{flex-direction:column;align-items:flex-start;justify-content:center;height:auto;padding:14px 16px 0;gap:10px}
  .brand{flex-direction:column;align-items:flex-start;gap:8px}
  .word{font-size:20px}
  .t2{flex-wrap:wrap;gap:6px 10px}
  .tabs{height:auto;width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .tabs button{height:42px;white-space:nowrap}
  .layout{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}
  .panel{border-inline-start:0;border-top:1px solid var(--line)}
  .tabpane{height:auto;max-height:none;padding:22px 18px 30px}
  .toolbar,.views,.sysbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;inset-inline:10px;max-width:none;justify-content:flex-start}
  .toolbar::-webkit-scrollbar,.views::-webkit-scrollbar,.sysbar::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
  .toolbar button,.views button,.sysbar button{white-space:nowrap;flex:0 0 auto}
  .toolbar{inset-block-start:10px}
  .views{inset-block-start:50px;flex-direction:row}
  .views button{margin-top:0;margin-inline-start:-1px}
  .sysbar{inset-block-end:28px}
  .hint{font-size:10px;inset-block-end:8px;inset-inline-start:10px}
  h2{font-size:26px}
}

</main>

r (fuel filter)","Inspect at every service","Drain immediately when the fuel-filter warning light comes on and the buzzer sounds.","Toyota Astra"],["Fuel filter element","About every 20,000 km","This is dealer-technician guidance for Indonesian diesel. The interval in the scanned booklet is unreadable.","Dealer guidance"],["Air filter","Clean at every service. In dusty conditions, replace every 30,000 km.","Use your service booklet for normal-use replacement.","Toyota Astra"],["Cabin (AC) filter, behind glovebox","Clean at every service and replace when dirty","In dusty city use it clogs quickly.","General practice"],["Brake fluid & clutch fluid","Replace every 40,000 km or 24 months","DOT 3. The fluid absorbs moisture from the air.","Toyota Astra"],["Manual gearbox oil","Under severe use, replace every 40,000 km","Otherwise follow your service booklet.","Toyota Astra"],["Automatic transmission fluid","Under severe use, inspect at 40,000 km and replace at 80,000 km","ATF Type T-IV.","Toyota Astra"],["Rear differential oil","Under severe use (heavy loads or high speed), replace every 20,000 km","Otherwise follow your service booklet.","Toyota Astra"],["Coolant (Toyota Super Long Life Coolant)","First replacement at 160,000 km, then every 80,000 km","Comes pre-mixed. Do not top up with plain water.","Toyota Astra + Toyota SLLC standard"],["Drive (V-ribbed) belt","From 80,000 km or 48 months, inspect every 20,000 km or 12 months","Replace if cracked, glazed or noisy.","Toyota Astra (scan partly legible)"],["Timing belt","Replace every 150,000 km","Some dealers also advise about 5 years. Replace the tensioner and idler at the same time.","Toyota Astra + dealer guidance"],["Valve clearance","Inspect at the interval in your booklet","The 2KD has no hydraulic lifters, so the clearance must be checked and set.","Toyota Astra (interval unreadable)"],["AC service","About once a year","Clean the evaporator and condenser, check the refrigerant, and check both front and rear units.","General practice"]],sf=[["Every week or before a long trip",["Check the engine oil on the dipstick: engine cold and the car on level ground. Keep it between L and F.","Check that the coolant reservoir is between LOW and FULL. Only open the reservoir or radiator cap when the engine is cold.","Check that the brake fluid reservoir is near MAX. A falling level means the pads are worn or there is a leak.","Check tyre pressures with the tyres cold, using the label on the door pillar. Look for cuts and bulges.","Walk around the car with the lights on: headlamps, brake lights, turn signals, reverse lights.","Look under the car for drips: oil (brown or black), coolant (pink), brake fluid (yellowish), AC water (clear, normal)."]],["Every month",["Check the spare tyre pressure. It hangs under the rear floor and is lowered with the jack handle.","Check the battery terminals for white or green corrosion and make sure the clamps are tight.","Check the wiper blades for streaking and refill the washer fluid.","Test the AC on max: cold air from both the front and rear blowers, and no musty smell."]],["Every time you start or drive",["Turn the key to ON and wait until the glow-plug light goes out before cranking.","All warning lamps should go out after starting. Red means stop safely; amber means book a check.","If the fuel-filter or water warning light flashes and the buzzer sounds, drain the water sedimenter soon.","Let the engine idle for 30\u201360 seconds before switching off after hard or high-speed driving. This protects the turbo bearings.","Buy diesel from reputable stations. Lower-sulphur grades such as Dexlite or Pertamina Dex are kinder to common-rail injectors."]]],rf=[],be=n=>rf.push(n);be({id:"hood",sys:"body",name:"Bonnet (hood)",local:"Kap mesin",ext:!0,what:"The hinged steel panel covering the engine bay. It hinges at the windscreen end and is held open by a prop rod.",innova:["Pull the release lever by the driver's footwell. Then lift the bonnet while pushing the safety catch at the front."],care:[["Each wash","Wash and wax the bonnet. It takes the most sun, bird droppings and stone chips."],["Every 6 months","Clean and lightly grease the latch and safety catch so the bonnet opens and locks reliably."],["As needed","Touch up stone chips early to stop rust."]],signs:["The bonnet will not latch, or the dashboard shows a door or bonnet warning.","Paint bubbling along the front edge, which is a sign of rust."],who:"both",related:["front_bumper","grille","fenders"]});be({id:"front_bumper",sys:"body",name:"Front bumper & fascia",local:"Bumper depan",ext:!0,what:"Plastic bumper cover over an energy-absorbing beam. It holds the fog lamps, the lower air intake and the number plate.",care:[["Each wash","Rinse mud and insects out of the lower grille so air reaches the AC condenser and radiator."],["As needed","Check that the clips and screws under the bumper are present. A sagging bumper can catch on speed bumps."]],signs:["Cracks or loose clips after a knock. Get the hidden mounts and fog lamps checked."],who:"both",related:["grille","fog_lamps","ac_condenser","radiator"]});be({id:"grille",sys:"body",name:"Radiator grille",local:"Gril depan",ext:!0,what:"The chrome-trimmed opening between the headlamps. It lets cooling air through to the AC condenser and radiator and protects them from debris.",care:[["Each wash","Brush or rinse out leaves and plastic bags. A blocked grille raises engine temperature and weakens the AC."]],signs:["The AC cools poorly in traffic, or the temperature gauge rises. Check for debris behind the grille."],who:"diy",related:["ac_condenser","radiator","front_bumper"]});be({id:"fenders",sys:"body",name:"Front fenders & wheel-arch liners",local:"Spakbor depan",ext:!0,what:"The body panels around the front wheels. Plastic liners inside the arches stop water and grit from reaching the engine bay.",care:[["Monthly","Hose mud out of the wheel arches, especially after flooded roads. Trapped mud holds water and rusts the arch lip."],["As needed","Refit any loose liner clips so the liner does not rub on the tyre."]],signs:["Bubbling paint on the arch lip.","A rubbing noise on full steering lock, which usually means a loose liner."],who:"diy",related:["wheels_tyres","front_suspension"]});be({id:"front_doors",sys:"body",name:"Front doors (hinges, locks, power windows)",local:"Pintu depan",ext:!0,what:"The doors contain the window regulator and motor, the central-locking actuator, speakers and a side-impact beam. The black window frame and seals keep water out.",care:[["Every 6 months","Spray the hinges, the check strap and the lock latch with a light lubricant."],["Monthly","Wipe the rubber seals and treat them with silicone protectant so they do not stick or crack."],["As needed","Clear the drain holes along the bottom edge of the door."]],signs:["A slow or noisy power window.","Water on the floor mat.","The door needs slamming to close."],who:"both",related:["side_windows","mirrors","rear_doors"]});be({id:"rear_doors",sys:"body",name:"Rear doors",local:"Pintu tengah",ext:!0,what:"The second-row doors. They work like the front doors, with child-safety locks on the edge of the door.",care:[["Every 6 months","Lubricate the hinges and latch, and check the child lock works."],["As needed","Clean the door drain holes and the rubber seals."]],signs:["Wind noise or water leaks.","The child lock or central lock does not engage."],who:"both",related:["front_doors","side_windows"]});be({id:"quarter_panels",sys:"body",name:"Rear quarter panels & fuel lid",local:"Panel samping belakang & tutup tangki",ext:!0,what:"The fixed side panels over the rear wheels, beside the third row. They hold the fuel-filler lid and the large rear quarter windows.",innova:["The rear cooler unit sits behind the right-rear quarter trim. Its drain exits behind the right-rear wheel."],care:[["Monthly","Wash the arch area and check the rear-AC drain outlet is not blocked by mud."],["As needed","Keep the fuel-lid hinge clean. Close the filler cap until it clicks."]],signs:["Water dripping inside behind the third row usually means a blocked rear-AC drain."],who:"diy",related:["fuel_tank","ac_rear_unit"]});be({id:"back_door",sys:"body",name:"Back door (tailgate) & spoiler",local:"Pintu belakang / bagasi",ext:!0,what:"The top-hinged tailgate. It is lifted by gas struts and carries the rear window, rear wiper, high-mount stop lamp and number plate.",care:[["Monthly","Check the tailgate stays up on its own. Weak gas struts can let it drop on your head."],["Every 6 months","Lubricate the latch and hinges."],["As needed","Keep the seal clean so exhaust fumes and dust cannot enter."]],signs:["The tailgate drifts down.","Dust or exhaust smell in the cargo area."],who:"both",related:["back_glass","tail_lamps","rear_bumper"]});be({id:"rear_bumper",sys:"body",name:"Rear bumper",local:"Bumper belakang",ext:!0,what:"Plastic bumper cover over the rear beam, with a step pad for loading.",care:[["Each wash","Rinse mud from the lower edge and around the exhaust tip."]],signs:["Cracks after a bump. Check that the tail lamps and tailgate still close properly."],who:"diy",related:["back_door","exhaust","spare_tyre"]});be({id:"roof",sys:"body",name:"Roof & roof rails",local:"Atap & roof rail",ext:!0,what:"The roof panel, drip channels and decorative roof rails. Inside, the headliner carries the rear AC ceiling duct.",care:[["Each wash","Wash the roof too. Indonesian sun quickly oxidises unwaxed paint on horizontal panels."],["As needed","Do not exceed the roof-rail load. Fasten loads to the rail feet, not the middle of the rail."]],signs:["Faded, chalky paint.","Water stains on the headliner."],who:"diy",related:["ac_rear_unit","body_shell"]});be({id:"windshield",sys:"body",name:"Windscreen",local:"Kaca depan",ext:!0,what:"Laminated safety glass bonded to the body. It is a structural part of the cabin and supports the passenger airbag when it deploys.",care:[["Weekly","Clean inside and out. Haze on the inside reduces night visibility."],["As needed","Get small stone chips resin-repaired before they spread into cracks."],["As needed","Replace the wiper blades when they streak, so grit is not dragged across the glass."]],signs:["Chips in the driver's line of sight.","Cracks spreading from the edge.","Leaks at the top corners."],who:"shop",related:["wipers","body_shell"]});be({id:"side_windows",sys:"body",name:"Side windows & rear quarter glass",local:"Kaca samping",ext:!0,what:"Tempered glass in the front and rear doors, which go up and down, plus the fixed rear quarter glass beside the third row.",care:[["Monthly","Clean the window channels and rubber. Dirt makes power-window motors work harder."],["As needed","Use window film that meets the legal limit, and do not scratch the glass when installing it."]],signs:["A window that stalls or tilts.","Whistling at speed."],who:"both",related:["front_doors","rear_doors"]});be({id:"back_glass",sys:"body",name:"Rear window & defogger",local:"Kaca belakang & defogger",ext:!0,what:"Tempered glass in the tailgate. It has printed heater lines that clear mist (the defogger) and its own wiper.",care:[["As needed","Clean the inside along the heater lines with a soft cloth. Do not scrape, or the lines break."]],signs:["Part of the glass will not demist, which means a broken heater line."],who:"diy",related:["back_door","wipers"]});be({id:"mirrors",sys:"body",name:"Door mirrors",local:"Spion",ext:!0,what:"Electrically adjustable side mirrors. Upper variants add electric folding and turn-signal repeaters.",care:[["As needed","Fold them in tight parking spots. Clean the glass with a soft cloth."],["As needed","If a mirror is knocked, check that the repeater lamp still works."]],signs:["A mirror that vibrates or will not adjust.","A repeater lamp that is out."],who:"diy",related:["front_doors"]});be({id:"body_shell",sys:"body",name:"Body shell: pillars, sills & floor",local:"Bodi, pilar, sill & lantai",ext:!0,what:"The steel cabin sits on a separate ladder frame. Its pillars (A to D), side sills and floor pan form the passenger safety cell. The underside is coated against corrosion.",care:[["Every 6 months","Rinse the underbody, especially after floods or the coast. Check the sills and floor for rust or damaged coating."],["As needed","Keep carpets dry. Wet carpets rust the floor from the inside."]],signs:["Rust on the sills or floor seams.","Doors that no longer line up, which can mean body or frame damage."],who:"both",related:["frame","roof"]});be({id:"engine_block",sys:"engine",name:"2KD-FTV engine (block, pistons, crankshaft)",local:"Blok mesin 2KD",bay:!0,what:"A 2.5-litre, 4-cylinder diesel. Diesel burns by compression, not a spark: air is squeezed until it is hot enough to ignite the injected fuel. Inside the cast-iron block, pistons drive the crankshaft.",innova:["102 PS. Torque is 200 Nm on the manual and 260 Nm on the automatic.","Turbocharged with no intercooler. Euro 2 emissions."],care:[["Every service","Clean oil and the right grade on time is what makes a 2KD last."],["Daily","Do not rev hard until the temperature gauge is near the middle."],["As needed","Fix oil leaks early, especially around the rear of the engine and the oil pan."]],signs:["Excess black smoke, a knocking sound or loss of power.","Oil consumption that keeps rising.","White smoke with a sweet smell, which means coolant is being burned."],who:"shop",related:["cylinder_head","oil_system","timing_belt","turbo"]});be({id:"cylinder_head",sys:"engine",name:"Cylinder head, valves & cam cover",local:"Kepala silinder & tutup klep",bay:!0,what:"The aluminium head carries 16 valves (DOHC), the camshafts and the injectors. The cam (valve) cover on top seals in the oil.",innova:["The 2KD has no hydraulic lifters, so valve clearance must be checked and set by a technician."],care:[["Booklet interval","Have the valve clearance inspected and adjusted."],["As needed","Replace the cam-cover gasket if oil seeps down the side of the engine."]],signs:["A ticking noise at idle.","Unstable idle speed, which often improves after a valve adjustment.","Oil wetness around the top cover."],who:"shop",related:["engine_block","injectors","glow_plugs"]});be({id:"timing_belt",sys:"engine",name:"Timing belt (behind front cover)",local:"Timing belt",ess:!0,bay:!0,what:"A toothed rubber belt behind the black front cover. It keeps the crankshaft, camshafts and fuel pump in exact step.",innova:["The 2KD uses a belt, not a chain, so it must be replaced on schedule."],care:[["At 150,000 km","Replace the belt together with the tensioner and idler pulley."],["Records","If you bought the car used without proof of a belt change, budget for one now."]],interval:[["Replace","Every 150,000 km (some dealers also advise about 5 years)"]],signs:["There is usually no warning before it snaps. If it fails, the engine stops and internal damage is likely.","Squealing from the front cover, or oil-soaked belt cover."],who:"shop",related:["drive_belt","engine_block","cylinder_head"]});be({id:"drive_belt",sys:"engine",name:"Drive belt (V-ribbed fan belt) & pulleys",local:"Fan belt / V-belt",ess:!0,bay:!0,what:"The ribbed belt at the front of the engine. The crankshaft uses it to drive the alternator, AC compressor and water-pump/fan pulley.",care:[["Monthly","With the engine off, look for cracks, glazing or missing ribs."],["From 80,000 km","Have it inspected every 20,000 km or 12 months and replace it if worn."]],interval:[["Inspect","Every 20,000 km / 12 months, starting from 80,000 km / 48 months"]],signs:["A squeal on start-up or when the AC switches on.","The battery-charge light comes on.","The AC suddenly blows warm."],who:"both",related:["alternator","ac_compressor","power_steering","timing_belt"]});be({id:"oil_system",sys:"engine",name:"Engine oil: filler cap & dipstick",local:"Oli mesin, tutup oli & stik oli",ess:!0,bay:!0,what:"Oil lubricates, cools and cleans the engine. Diesel oil turns black quickly because it carries soot. Top it up through the yellow filler cap and check it with the yellow-handled dipstick.",innova:["Capacity is about 6.9 L including the filter (dealer-technician figure). The L to F marks on the dipstick are about 1.6 L apart.","Use a diesel-rated oil (API CF-4 or better) in the viscosity listed in your service booklet."],care:[["Weekly","With the engine cold and the car level: pull the dipstick, wipe it, push it fully in, then read. Keep the level between L and F and top up a little at a time."],["Every 10,000 km / 6 months","Change the oil and filter. In heavy stop-go traffic, dusty conditions or with full loads, change it sooner."]],interval:[["Replace","Every 10,000 km or 6 months, whichever comes first"]],signs:["The red oil-can warning light: stop the engine immediately.","The level drops fast, or there is blue smoke.","Milky or creamy oil, which means coolant is getting in."],who:"both",related:["oil_filter","oil_pan","turbo"]});be({id:"oil_filter",sys:"engine",name:"Oil filter",local:"Filter oli",bay:!0,what:"A spin-on canister that traps metal particles and soot from the oil before it reaches the bearings and turbo.",care:[["Every oil change","Replace it with a genuine or equivalent-quality filter and lightly oil the new seal before fitting."]],interval:[["Replace","With every oil change (10,000 km / 6 months)"]],signs:["An oil leak at the filter seal right after a service."],who:"shop",related:["oil_system","oil_pan"]});be({id:"oil_pan",sys:"engine",name:"Oil pan (sump) & drain plug",local:"Carter / bak oli",bay:!0,what:"The oil reservoir under the engine. Old oil is drained through the plug at the bottom.",care:[["Every oil change","Ask for a new drain-plug washer and make sure the plug is tightened correctly."],["As needed","Take speed bumps and rocky roads slowly. A hit can dent or crack the sump."]],signs:["Fresh oil spots under the front of the car.","The oil warning light after the underside hits something."],who:"shop",related:["oil_system","engine_block"]});be({id:"turbo",sys:"engine",name:"Turbocharger",local:"Turbo",bay:!0,what:"An exhaust-driven fan that pumps extra air into the engine for more power and torque. It spins very fast and depends entirely on clean oil.",innova:["Fixed-geometry turbo with no intercooler. Compressed air goes straight to the intake manifold."],care:[["Every drive","Let the engine idle for 30\u201360 seconds before switching off after hard or high-speed driving."],["Every service","Change the oil on time and keep the air filter clean. Dust destroys turbo blades."]],signs:["A whistling or siren noise.","Blue or black smoke.","Sudden loss of power.","Oil inside the intake hose."],who:"shop",related:["air_filter","intake","exhaust","oil_system"]});be({id:"glow_plugs",sys:"engine",name:"Glow plugs",local:"Busi pijar (glow plug)",bay:!0,what:"Small electric heaters, one in each cylinder, that warm the combustion chamber for easier cold starts. The coil-shaped dashboard light shows when they are working.",care:[["Every start","Turn the key to ON and wait for the glow-plug light to go out, then crank."],["As needed","If cold starts get hard or the engine runs rough at first, have the glow plugs tested."]],signs:["Long cranking in the morning.","White smoke and rough running for the first minute."],who:"shop",related:["battery","cylinder_head"]});be({id:"injectors",sys:"fuel",name:"Common-rail fuel system (supply pump, rail, injectors)",local:"Pompa injeksi, common rail & injektor",bay:!0,what:'The "D-4D" system. A high-pressure supply pump fills the common rail. The ECU then opens each injector precisely to spray atomised diesel into the cylinders.',care:[["Every fill-up","Use clean, good-quality diesel. Lower-sulphur grades help injectors last."],["On time","Changing the fuel filter and draining water are the best protection for the injectors."],["As needed","Have the injectors tested and cleaned by a diesel specialist if smoke or idle gets worse."]],signs:["Rough idle or knocking.","Heavy black smoke.","Hard starting.","The check-engine light."],who:"shop",related:["fuel_filter","fuel_tank","ecu"]});be({id:"fuel_filter",sys:"fuel",name:"Fuel filter & water sedimenter",local:"Filter solar & water sedimenter",ess:!0,bay:!0,what:"This filter cleans the diesel and separates out water before it reaches the high-pressure pump. Water in diesel ruins common-rail injectors. It has a hand priming pump on top and a drain plug at the bottom.",innova:["When enough water collects, a warning light flashes and a buzzer sounds. Drain it soon.","To drain, open the drain plug 2 to 2.5 turns, operate the priming pump until clean diesel comes out, then retighten (Toyota Astra quick guide)."],care:[["Every service","Have the water sedimenter inspected and drained."],["About 20,000 km","Replace the filter element (dealer-technician guidance). Bleed air with the priming pump afterwards."]],interval:[["Drain water","At each service, or straight away when the warning light comes on"],["Replace element","About every 20,000 km (dealer guidance)"]],signs:["The fuel-filter or water warning light with a buzzer.","Loss of power, surging or hard starting."],who:"both",related:["injectors","fuel_tank"]});be({id:"fuel_tank",sys:"fuel",name:"Fuel tank, filler & lines",local:"Tangki solar",what:"A 55-litre tank under the floor, filled through the lid on the rear quarter panel. Fuel lines run along the frame to the engine bay.",care:[["Every fill-up","Close the cap until it clicks. Do not overfill past the first auto-stop."],["As needed","Try not to run the tank nearly empty. That draws sediment and air into the system."],["Never","Do not fill with petrol. If it happens, do not start the engine; have the tank drained."]],signs:["A diesel smell around the car.","Wet patches along the fuel lines."],who:"both",related:["fuel_filter","quarter_panels"]});be({id:"air_filter",sys:"fuel",name:"Air cleaner box & air filter",local:"Filter udara",ess:!0,bay:!0,what:"A paper filter in the black box at the front of the engine bay. It cleans the air the engine and turbo breathe.",care:[["Every service","Remove the element and blow it out from the inside with low-pressure air."],["Dusty use","Replace it every 30,000 km (Toyota severe-use schedule), or sooner if it is dark and clogged."],["Never","Do not wash a paper element, and do not drive without one."]],interval:[["Clean","Every 10,000 km service"],["Replace","Per your service booklet. Every 30,000 km in dusty conditions."]],signs:["Sluggish acceleration.","Black smoke.","Higher fuel use."],who:"diy",related:["turbo","intake"]});be({id:"intake",sys:"fuel",name:"Intake ducts, intake manifold & EGR valve",local:"Intake manifold & EGR",bay:!0,what:"Pipes carry air from the air filter to the turbo and then into the intake manifold. The EGR valve recirculates a little exhaust gas to lower emissions. Over time it mixes with oil mist and forms carbon.",care:[["Every service","Check the hose clamps. A loose boost hose causes a big loss of power."],["High mileage","If idle or response gets worse, a workshop can clean the EGR valve and manifold of carbon."]],signs:["A hissing sound under acceleration.","Black smoke.","Weak pull."],who:"shop",related:["turbo","air_filter","exhaust"]});be({id:"exhaust",sys:"fuel",name:"Exhaust: manifold, catalyst & muffler",local:"Knalpot",what:"Hot gas leaves the engine, spins the turbo, passes through a catalytic converter and muffler, and exits at the rear.",care:[["Every 6 months","Look for rust holes and broken hangers. Listen for new rattles or a louder note."],["As needed","Do not park over dry grass. The exhaust is hot enough to ignite it."]],signs:["A louder exhaust or a ticking leak.","Exhaust smell inside the cabin, which is dangerous. Check it at once."],who:"shop",related:["turbo","intake"]});be({id:"radiator",sys:"cooling",name:"Radiator & radiator cap",local:"Radiator & tutup radiator",bay:!0,what:"The radiator sheds engine heat into the air passing through the grille. Its pressurised cap raises the boiling point of the coolant.",innova:["Filled with Toyota Super Long Life Coolant (pink), which comes pre-mixed."],care:[["Monthly","Keep the fins clean. The AC condenser sits in front, so clean both together."],["Safety","Never open the radiator cap while the engine is hot."]],interval:[["Coolant","First replacement at 160,000 km, then every 80,000 km"]],signs:["The temperature gauge above the middle.","Pink crust on the fins or hoses.","A sweet smell."],who:"both",related:["coolant_tank","cooling_fan","hoses","ac_condenser"]});be({id:"coolant_tank",sys:"cooling",name:"Coolant reservoir (expansion tank)",local:"Tabung reservoir air radiator",ess:!0,bay:!0,what:"This translucent tank lets you see the coolant level. It catches coolant as it expands when hot and returns it to the radiator as it cools.",care:[["Weekly","With the engine cold, the level should be between LOW and FULL."],["Top up","Use Toyota Super Long Life Coolant (pre-mixed). Plain water dilutes the protection against rust and boiling."]],interval:[["Replace coolant","First at 160,000 km, then every 80,000 km"]],signs:["The level keeps dropping, which means a leak.","The gauge rising in traffic. Stop and let the engine cool before checking."],who:"diy",related:["radiator","hoses"]});be({id:"cooling_fan",sys:"cooling",name:"Cooling fan & shroud",local:"Kipas radiator & shroud",bay:!0,what:"The fan pulls air through the radiator when the car is slow or stopped, and the shroud channels the airflow. On this engine the fan is driven from the engine's front pulley.",care:[["Every service","Check the blades for cracks and the shroud for breaks."],["As needed","Keep hands and clothing away from the fan when the engine is running."]],signs:["Overheating only in traffic.","A roaring fan noise that never changes."],who:"shop",related:["radiator","drive_belt"]});be({id:"hoses",sys:"cooling",name:"Radiator hoses & thermostat",local:"Selang radiator & thermostat",bay:!0,what:"Rubber hoses carry coolant between the engine and radiator. The thermostat holds coolant in the engine until it reaches operating temperature.",care:[["Every service","Squeeze the hoses when cold. They should feel firm, not soft, swollen or cracked."],["As needed","Replace swollen hoses before they burst."]],signs:["Coolant drips.","The temperature takes too long to rise, which suggests the thermostat is stuck open.","Overheating, which suggests it is stuck shut."],who:"shop",related:["radiator","coolant_tank"]});be({id:"clutch",sys:"drivetrain",name:"Clutch & clutch hydraulics (manual)",local:"Kopling",bay:!0,what:"The clutch disc connects and disconnects the engine from the gearbox. The pedal works it through a small hydraulic master cylinder that has its own fluid reservoir.",care:[["Driving","Do not rest your foot on the pedal or hold the car on a slope with the clutch. Use the handbrake."],["Every 40,000 km / 24 months","Replace the clutch fluid (DOT 3) together with the brake fluid."]],interval:[["Clutch fluid","Replace every 40,000 km or 24 months"]],signs:["Engine revs rise but speed does not (slipping).","The clutch only bites high in the pedal travel.","A burning smell.","A pedal that feels soft."],who:"shop",related:["gearbox","brake_master"]});be({id:"gearbox",sys:"drivetrain",name:"Transmission (5-speed manual / 4-speed automatic)",local:"Transmisi / girboks",what:"The gearbox multiplies engine torque through its gears. It sits behind the engine, under the floor tunnel.",innova:["The automatic uses ATF Type T-IV."],care:[["Severe use","Manual: replace the gear oil every 40,000 km. Automatic: inspect the fluid at 40,000 km and replace it at 80,000 km."],["Driving (AT)","Come to a full stop before shifting between D and R."]],interval:[["Manual gear oil","Every 40,000 km under severe use; otherwise per your booklet"],["ATF","Inspect at 40,000 km, replace at 80,000 km (severe use)"]],signs:["Grinding or difficult gear changes.","Slipping or harsh automatic shifts.","Red fluid spots (automatic)."],who:"shop",related:["clutch","propshaft","gear_lever"]});be({id:"propshaft",sys:"drivetrain",name:"Propeller shaft & universal joints",local:"As kopel / propeller shaft",what:"A steel tube that carries drive from the gearbox to the rear axle. Universal joints let it flex as the suspension moves.",care:[["Every service","Have the universal joints checked for play, plus the centre support bearing if your shaft has one. Grease the joints if they have grease nipples."]],signs:["A clunk when pulling away.","Vibration that rises with speed.","Squeaks from under the middle of the car."],who:"shop",related:["gearbox","differential"]});be({id:"differential",sys:"drivetrain",name:"Rear differential & live axle",local:"Gardan / differential",what:"The differential turns the drive 90\xB0 to the rear wheels and lets them rotate at different speeds in corners. Both rear wheels share one rigid axle housing.",care:[["Severe use","Replace the hypoid gear oil (SAE 90 GL-5) every 20,000 km with heavy loads or long high-speed trips. Otherwise follow your booklet."],["Every service","Check the axle seals for leaks."]],interval:[["Diff oil","Every 20,000 km under severe use; otherwise per your booklet"]],signs:["A whine that changes on and off the accelerator.","Oil on the inside of the rear wheels."],who:"shop",related:["propshaft","rear_suspension","brakes_rear"]});be({id:"frame",sys:"chassis",name:"Ladder-frame chassis",local:"Sasis / rangka",what:"Two steel rails joined by cross-members, like a ladder. The body, engine and suspension bolt onto it. This is the IMV platform shared with Hilux and Fortuner, which makes the Innova tough on bad roads.",care:[["Every 6 months","Rinse the frame underneath, especially after floods. Check for rust and cracks around the suspension mounts."]],signs:["Heavy rust scale.","A crooked stance or uneven gaps between the body and frame after an accident."],who:"shop",related:["body_shell","front_suspension","rear_suspension"]});be({id:"front_suspension",sys:"chassis",name:"Front suspension (double wishbone, springs, stabiliser)",local:"Kaki-kaki depan (arm, ball joint, per)",what:"Upper and lower wishbone arms hold each front wheel, with a coil spring and a stabiliser bar to limit body roll. Ball joints and rubber bushings let everything pivot.",care:[["Every service","Have the ball joints, bushings and stabiliser links checked for play and torn rubber boots."],["After impacts","After a big pothole, check the wheel alignment."]],signs:["Knocking over bumps.","Wandering steering.","Uneven tyre wear on the inner or outer edge."],who:"shop",related:["shocks","steering","wheels_tyres"]});be({id:"rear_suspension",sys:"chassis",name:"Rear suspension (4-link, coil springs, lateral rod)",local:"Kaki-kaki belakang (link & per)",what:"Four control links locate the rear axle front-to-back, and a lateral rod stops it moving sideways. Coil springs carry the load, which makes the ride softer than a leaf-spring pickup.",care:[["Every service","Check the link bushings and the lateral-rod mounts."],["Loading","Keep within the rated load. Constant overloading sags the springs."]],signs:["The rear sits low.","A clunk from the rear over bumps.","The rear steps sideways on rough corners."],who:"shop",related:["shocks","differential"]});be({id:"shocks",sys:"chassis",name:"Shock absorbers (x4)",local:"Shockbreaker",what:"Oil-filled dampers that stop the springs bouncing. They keep the tyres pressed onto the road.",care:[["Every service","Check for oil leaking down the body of the shock."],["Typical","Expect to replace them at roughly 60,000\u2013100,000 km, depending on road conditions. This is general practice."]],signs:["Floaty, bouncy ride.","The nose dives under braking.","Cupped tyre wear.","An oily shock body."],who:"shop",related:["front_suspension","rear_suspension"]});be({id:"steering",sys:"chassis",name:"Steering rack, tie rods & column",local:"Steering rack, tie rod & kolom setir",what:"Rack-and-pinion steering. Turning the wheel rotates the column and pinion, which slides the rack. Tie rods then turn the front wheels.",care:[["Every service","Check the tie-rod ends for play and the rack boots for tears."],["After alignment","Make sure the steering wheel sits straight when driving straight."]],signs:["Play or a clunk in the steering.","The car pulls to one side.","A torn rubber boot on the rack."],who:"shop",related:["power_steering","front_suspension","steering_wheel"]});be({id:"power_steering",sys:"chassis",name:"Power-steering pump & fluid reservoir",local:"Pompa & tabung oli power steering",bay:!0,what:"A belt-driven hydraulic pump helps you turn the wheel. Its reservoir has a dipstick or level marks.",care:[["Monthly","Check the fluid level. This model uses Dexron-type ATF; confirm the type in your booklet."],["Driving","Do not hold the steering at full lock for long. It overheats the pump."]],signs:["A whine when turning.","Heavy steering.","Foamy fluid or leaks."],who:"both",related:["steering","drive_belt"]});be({id:"brakes_front",sys:"chassis",name:"Front disc brakes (pads, rotors, calipers)",local:"Rem depan: kampas & piringan cakram",ess:!0,what:"Ventilated discs squeezed by pads in a hydraulic caliper. They do most of the braking work.",care:[["Every service","Measure pad thickness. Workshops usually replace pads below about 2\u20133 mm."],["As needed","Resurface or replace discs that are scored or warped."],["Driving","On long downhill roads, use a lower gear so the brakes do not overheat."]],signs:["A squeal from the wear indicator.","Grinding.","The steering wheel shakes when braking.","The car pulls to one side."],who:"shop",related:["brake_master","brakes_rear","wheels_tyres"]});be({id:"brakes_rear",sys:"chassis",name:"Rear drum brakes & parking brake",local:"Rem tromol belakang & rem tangan",what:"Shoes press outward inside a drum. The parking brake works the rear shoes through cables.",care:[["Every service","Have the drums cleaned and adjusted, and the shoes and wheel cylinders checked."],["Monthly","Check the handbrake holds the car on a slope within a few clicks."]],signs:["The handbrake lever travels too far.","A rubbing noise or brake-fluid wetness inside the rear wheels."],who:"shop",related:["brakes_front","differential","gear_lever"]});be({id:"brake_master",sys:"chassis",name:"Brake master cylinder, booster & fluid",local:"Master rem, booster & minyak rem",ess:!0,bay:!0,what:"Your foot pushes the master cylinder, helped by the large vacuum booster, which sends fluid pressure to all four brakes. The translucent reservoir shows the level.",innova:["Brake fluid is DOT 3. The clutch shares the same type through its own reservoir."],care:[["Weekly","Check the level is between MIN and MAX. Do not overfill."],["Every 40,000 km / 24 months","Replace the fluid. It absorbs water over time, which lowers its boiling point and corrodes parts."]],interval:[["Replace","Every 40,000 km or 24 months"]],signs:["A soft or sinking pedal.","The red BRAKE warning light.","Dark fluid."],who:"both",related:["brakes_front","brakes_rear","clutch"]});be({id:"wheels_tyres",sys:"chassis",name:"Tyres & alloy wheels",local:"Ban & velg",ess:!0,ext:!0,what:"The only contact with the road. E, G and V variants use 205/65 R15 tyres on alloy wheels.",innova:["Wheel-nut torque is 105 N\xB7m (Toyota Astra quick guide).","Use the pressures on your door-pillar label. For reference, Toyota India lists 33 psi front and rear for 205/65 R15 (36 psi rear when fully loaded)."],care:[["Monthly","Check pressures cold and look for cuts, bulges and nails."],["Every 10,000 km","Rotate the tyres and balance them if you feel vibration."],["Replace","At the wear bar (1.6 mm), or after about 5\u20136 years because the rubber ages."]],signs:["Vibration at speed.","Uneven wear on one edge, which points to alignment.","A tyre that keeps losing pressure."],who:"both",related:["spare_tyre","front_suspension","brakes_front"]});be({id:"spare_tyre",sys:"chassis",name:"Spare tyre, jack & tools",local:"Ban serep & dongkrak",what:"A full-size spare carried under the rear of the car. You lower it on a chain winch by turning it with the jack handle.",care:[["Monthly","Check the spare's pressure. It is often forgotten until you need it."],["Every 6 months","Lower and raise the spare once so the winch does not seize. Lubricate it lightly."]],signs:["A seized winch.","A flat or cracked spare."],who:"diy",related:["wheels_tyres","rear_bumper"]});be({id:"ac_compressor",sys:"ac",name:"AC compressor & magnetic clutch",local:"Kompresor AC",bay:!0,what:"The heart of the AC. The drive belt turns it to pump refrigerant (R134a type) around the system. A magnetic clutch engages it when you press A/C.",care:[["Weekly","Run the AC regularly. The oil carried in the refrigerant keeps the seals lubricated."],["Every service","Check the belt and listen for clutch noise."]],signs:["A loud click-clack or grinding when the AC is on.","The engine bogs badly with AC on.","Warm air."],who:"shop",related:["drive_belt","ac_condenser","ac_lines"]});be({id:"ac_condenser",sys:"ac",name:"AC condenser",local:"Kondensor AC",bay:!0,what:"A thin radiator in front of the engine radiator. It releases the heat taken out of the cabin, turning hot refrigerant gas back into liquid.",care:[["Monthly","Rinse insects and dust from the fins with gentle water pressure, not a high-pressure jet that bends them."],["Yearly","Have it deep-cleaned during the AC service."]],signs:["The AC is cold on the move but weak in traffic.","Oily spots on the fins, which mean a refrigerant leak."],who:"both",related:["radiator","grille","ac_drier"]});be({id:"ac_drier",sys:"ac",name:"Receiver/drier & pressure switch",local:"Dryer AC",bay:!0,what:"A small canister beside the condenser that stores refrigerant and absorbs moisture. Moisture inside an AC system creates acid and ice.",care:[["When opened","Replace the drier whenever the AC system is opened for repair or after a major leak."]],signs:["The AC cools then warms in cycles.","Frost on the lines."],who:"shop",related:["ac_condenser","ac_lines"]});be({id:"ac_front_unit",sys:"ac",name:"Front evaporator & blower",local:"Evaporator depan & blower",what:"The front evaporator is a cold mini-radiator behind the dashboard. The blower fan pushes cabin air through it and out of the vents. Moisture condenses on it and drains outside under the car.",care:[["Yearly","Have the evaporator cleaned. This is a common Indonesian service that removes mould and odours."],["Daily habit","Switch the AC off a minute before arriving but keep the fan on. This dries the evaporator and reduces smell."]],signs:["A musty smell.","Weak airflow.","Water dripping into the footwell, which means a blocked drain."],who:"shop",related:["cabin_filter","ac_controls","ac_lines"]});be({id:"cabin_filter",sys:"ac",name:"Cabin (AC) filter",local:"Filter kabin / filter AC",ess:!0,what:"A pleated filter behind the glovebox. It cleans the air entering the front AC.",innova:["The rear cooler unit has no cabin filter."],care:[["Every service","Remove the glovebox, slide the filter out and tap or blow it clean."],["When dirty","Replace it. In dusty city use it clogs quickly."]],interval:[["Clean","Every 10,000 km service"],["Replace","When dark or clogged"]],signs:["Weak front airflow.","Dusty smell.","Windows fog up easily."],who:"diy",related:["ac_front_unit"]});be({id:"ac_rear_unit",sys:"ac",name:'Rear cooler ("double blower") & ceiling ducts',local:"AC belakang / double blower",what:"A second evaporator and blower cool the second and third rows through vents in the ceiling duct. They have their own fan switch.",innova:["Fitted as standard on all 2012 variants.","The rear unit sits behind the right-rear quarter trim at the third row. Its drain exits behind the right-rear wheel (owner-forum sources)."],care:[["Yearly","Include the rear unit in the AC cleaning. It is often skipped."],["Monthly","Check the drain outlet behind the right-rear wheel is not blocked by mud."]],signs:["Water dripping from the ceiling vents or behind the third row.","Musty smell in the back.","Rear vents blowing warm."],who:"shop",related:["ac_lines","roof","quarter_panels"]});be({id:"ac_lines",sys:"ac",name:"Refrigerant lines & service ports",local:"Pipa freon",what:"Aluminium pipes and rubber hoses link the compressor, condenser, drier and both evaporators. The long lines to the rear unit run under the floor.",care:[["Yearly","Have the pressures checked during the AC service. Refrigerant should not need regular top-ups."],["As needed","If a top-up is needed, ask for a leak test first. Check the under-bonnet label for the correct refrigerant amount."]],signs:["Oily dirt at pipe joints, which means a leak.","Hissing.","The AC slowly gets warmer over weeks."],who:"shop",related:["ac_compressor","ac_rear_unit","ac_front_unit"]});be({id:"ac_controls",sys:"ac",name:"AC control panel & vents",local:"Panel AC & kisi-kisi",what:"The front panel controls fan speed, temperature, airflow direction and fresh or recirculated air. The V variant has a digital automatic AC.",care:[["Daily habit","Use recirculation in traffic and smoke for faster cooling and cleaner air. Switch to fresh air sometimes to stop windows fogging."],["As needed","Dust the vents with a soft brush."]],signs:["Fan works only on top speed, which suggests a blower-resistor fault.","Air comes out of the wrong vents."],who:"diy",related:["ac_front_unit","ac_rear_unit"]});be({id:"battery",sys:"electrical",name:"Battery (12 V)",local:"Aki",ess:!0,bay:!0,what:"Powers the starter motor and glow plugs, and runs the electrics when the engine is off. The alternator recharges it.",innova:["Size 80D26L (about 70 Ah, 12 V)."],care:[["Monthly","Check the terminals are tight and free of white or green powder. Clean with warm water and baking soda."],["Every service","Have it load-tested. In tropical heat batteries often last only 2\u20133 years (general practice)."],["Wet batteries","Keep the electrolyte between the marks with distilled water only."]],signs:["Slow cranking.","A clicking sound when starting.","The battery light on the dashboard.","A swollen case."],who:"both",related:["alternator","starter","fuse_boxes","glow_plugs"]});be({id:"alternator",sys:"electrical",name:"Alternator",local:"Alternator / dinamo ampere",bay:!0,what:"A belt-driven generator that recharges the battery and powers everything while the engine runs.",care:[["Every service","Check the belt tension. A slipping belt means undercharging."],["As needed","Have the charging voltage tested if the lights dim or the battery keeps going flat."]],signs:["The battery warning light while driving.","Lights that dim at idle.","A whining noise."],who:"shop",related:["battery","drive_belt"]});be({id:"starter",sys:"electrical",name:"Starter motor",local:"Dinamo starter",bay:!0,what:"A powerful electric motor that cranks the engine. Diesels need a lot of cranking force because of their high compression.",care:[["Driving","Crank for no more than about 10 seconds at a time, then wait before trying again."]],signs:["A single click with no crank.","A grinding noise when starting.","Slow cranking with a good battery."],who:"shop",related:["battery","glow_plugs"]});be({id:"fuse_boxes",sys:"electrical",name:"Fuse & relay boxes",local:"Kotak sekring & relay",bay:!0,what:"There is one box in the engine bay and another under the dashboard. Fuses protect each circuit from overload.",care:[["Keep in car","Keep a few spare fuses. The lid shows a diagram of each circuit."],["As needed","Replace a blown fuse only with the same rating. If it blows again, find the fault."]],signs:["A single item suddenly dead, such as the lighter socket, radio or one light."],who:"diy",related:["battery","harness"]});be({id:"ecu",sys:"electrical",name:"Engine ECU & sensors",local:"ECU (komputer mesin)",what:"The engine computer reads sensors (air flow, temperature, rail pressure, pedal position,
