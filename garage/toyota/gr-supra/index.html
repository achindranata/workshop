/* Design language: cinematic dusk-blue product stage, near-black panels, hairline rules,
   squared display type (Garis Display) for headings & numerals, Geist for reading text. */
:root{
  --black:#060708; --panel:#0e1013; --panel2:#14171b; --ink:#eef0f3; --ink2:#c3c8cf; --muted:#8a9099; --faint:#5d636c;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16); --accent:#8fb8ff; --led:#4be38d;
  --warn:#ff8a73; --amber:#e9bd5a; --ok:#69d99a;
  --display:'Garis Display','Geist',system-ui,sans-serif; --font:'Geist','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--black);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:13px;cursor:pointer;color:inherit}
::selection{background:rgba(143,184,255,.35)}
*{scrollbar-width:thin;scrollbar-color:#2a2f36 transparent}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;height:68px;padding:0 26px;background:var(--black);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:22px;min-width:0}
.mk{display:flex;flex-direction:column;line-height:1}
.maker{font-family:var(--display);font-weight:500;font-size:10px;letter-spacing:.52em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.crumbs{display:flex;align-items:center;gap:8px;letter-spacing:inherit}
.crumbs a{color:var(--muted);text-decoration:none;transition:color .15s}
.crumbs a:hover,.crumbs a:focus-visible{color:#fff}
.crumbs i{font-style:normal;color:var(--faint);letter-spacing:0}
.crumbi{color:var(--muted);flex:0 0 auto;margin-inline-end:-2px}
.word{font-family:var(--display);font-weight:300;font-size:23px;letter-spacing:.3em;color:#fff;white-space:nowrap}
.t2{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);letter-spacing:.02em;min-width:0}
.t2 span:first-child{color:var(--ink2)}
.t2 .sep{width:1px;height:14px;background:var(--line2)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;height:100%}
.tabs button{background:transparent;border:0;color:var(--muted);padding:0 14px;height:100%;font-family:var(--display);font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase;position:relative}
.tabs button:hover{color:#fff}
.tabs button.on{color:#fff}
.tabs button.on::after{content:"";position:absolute;inset-inline:14px;bottom:-1px;height:1px;background:#fff}

/* ---------- 3D stage ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 440px;height:calc(100% - 68px)}
.viewport{position:relative;overflow:hidden;background:
  radial-gradient(70% 55% at 50% 60%,rgba(120,160,205,.16) 0%,rgba(0,0,0,0) 70%),
  linear-gradient(180deg,#1f3b58 0%,#17304a 26%,#10213a 52%,#0a1420 76%,#06090d 100%);transition:background .5s}
.viewport.dark{background:radial-gradient(80% 70% at 50% 45%,#13253b 0%,#0b1626 55%,#05080d 100%)}
#c3d{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.toolbar{position:absolute;inset-block-start:16px;inset-inline-start:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:6}
.views{position:absolute;inset-block-start:16px;inset-inline-end:16px;display:flex;flex-direction:column;align-items:stretch;gap:0;z-index:6}
.toolbar button,.views button,.sysbar button{background:rgba(6,9,13,.42);border:1px solid var(--line2);color:#e3e7ec;padding:7px 12px;border-radius:0;font-family:var(--display);font-weight:500;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .15s,color .15s,border-color .15s}
.views button{padding:7px 12px;font-size:10px;margin-top:-1px;text-align:end}
.toolbar button:hover,.views button:hover,.sysbar button:hover{border-color:rgba(255,255,255,.55);color:#fff}
.toolbar button.on,.views button.on{background:#fff;color:#07090c;border-color:#fff}
.seg{display:inline-flex}
.seg button+button{margin-inline-start:-1px}
.sysbar{position:absolute;inset-block-end:38px;inset-inline:16px;display:flex;gap:6px;flex-wrap:wrap;z-index:6}
.sysbar button{display:inline-flex;align-items:center;gap:0;font-size:10px;padding:6px 10px;letter-spacing:.12em}
.sysbar button.on{background:#fff;color:#07090c;border-color:#fff}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-inline-end:8px;vertical-align:1px}
.hint{position:absolute;inset-block-end:12px;inset-inline-start:16px;font-size:11px;color:rgba(255,255,255,.42);letter-spacing:.04em;z-index:6}

/* leader-line callouts */
.leads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}
.leads line{stroke:rgba(255,255,255,.75);stroke-width:1}
#hovDot{fill:#fff}
#selDot{fill:#fff}
#selRing{fill:none;stroke:var(--sc,#fff);stroke-width:1.5}
.tip,.co{position:absolute;inset-block-start:0;inset-inline-start:0;pointer-events:none;z-index:5;white-space:nowrap}
.tip{display:none;padding:2px 0 0 10px;border-inline-start:1px solid rgba(255,255,255,.75);background:rgba(4,7,11,.38)}
.tip b,.co b{display:block;font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.04em;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.65)}
.tip .tsys,.co .csys{display:flex;align-items:center;font-size:10px;font-family:var(--display);font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.7);text-shadow:0 1px 8px rgba(0,0,0,.7);margin-top:3px}
.tip .tsys .dot,.co .csys .dot{width:6px;height:6px;margin-inline-end:7px}
.co{display:none;padding:4px 0 2px 12px;border-inline-start:2px solid var(--sc,#fff);background:linear-gradient(90deg,rgba(4,7,11,.62),rgba(4,7,11,.35) 70%,rgba(4,7,11,0))}
.co b{font-weight:300;font-size:18px}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--black);z-index:20}
.lmark{font-family:var(--display);font-weight:300;font-size:26px;letter-spacing:.42em;color:#fff;padding-inline-start:.42em}
.lbar{width:180px;height:1px;background:var(--line2);overflow:hidden}
.lbar i{display:block;width:40%;height:100%;background:#fff;animation:lb 1.2s ease-in-out infinite}
@keyframes lb{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.ltext{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}

/* ---------- side panel ---------- */
.panel{background:var(--panel);border-inline-start:1px solid var(--line);overflow:hidden;position:relative}
.tabpane{display:none;height:100%;overflow:auto;padding:26px 28px 36px}
.tabpane.on{display:block}
#tab-list{padding:0}
h2{font-family:var(--display);font-weight:300;font-size:30px;line-height:1.14;letter-spacing:.01em;margin:6px 0 10px;color:#fff}
h3{font-family:var(--display);font-weight:500;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px;padding-top:16px;border-top:1px solid var(--line)}
p{margin:8px 0 12px}
b{color:#fff;font-weight:600}
.eyebrow,.sysline{display:flex;align-items:center;font-family:var(--display);font-weight:500;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2)}
.dhead{position:relative;padding-inline-end:40px}
.local{font-size:13px;color:var(--muted)}
.local b{color:var(--ink);font-weight:500}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.badge{font-family:var(--display);font-weight:500;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;padding:5px 9px 4px;border:1px solid var(--line2);color:var(--ink2);border-radius:0}
.badge.ess{border-color:rgba(233,189,90,.55);color:var(--amber)}
.badge.who-diy{border-color:rgba(105,217,154,.5);color:var(--ok)}
.badge.who-shop{border-color:rgba(255,138,115,.5);color:var(--warn)}
.badge.who-both{border-color:rgba(143,184,255,.5);color:var(--accent)}
.xbtn{position:absolute;inset-block-start:0;inset-inline-end:0;border:1px solid var(--line2);background:transparent;width:30px;height:30px;border-radius:0;color:var(--ink2);font-size:12px}
.xbtn:hover{border-color:#fff;color:#fff}
.what{font-size:15px;line-height:1.6;color:var(--ink2);margin-top:18px}
ul{margin:4px 0 8px;padding:0;list-style:none}
li{margin:0;padding:6px 0 6px 18px;position:relative;color:var(--ink2)}
li::before{content:"";position:absolute;inset-inline-start:0;top:14px;width:6px;height:1px;background:var(--ink2)}
ul.facts li::before{background:var(--accent);width:8px}
ul.warn li::before{background:var(--warn);width:8px}
ul.how li::before{background:#fff}
table{border-collapse:collapse;width:100%}
.care th{width:32%;text-align:start;vertical-align:top;font-family:var(--display);font-weight:500;font-size:12.5px;letter-spacing:.02em;color:#fff;padding:11px 14px 11px 0;border-bottom:1px solid var(--line)}
.care td{padding:11px 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink2)}
.care tr:first-child th,.care tr:first-child td{border-top:1px solid var(--line)}
.intervals{display:grid;grid-template-columns:1fr;gap:0}
.iv{display:flex;flex-direction:column;gap:4px;padding:10px 0 10px 16px;border-inline-start:1px solid var(--line2);margin-bottom:8px}
.iv span{font-size:10px;font-family:var(--display);font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.2em}
.iv b{font-family:var(--display);font-weight:300;font-size:19px;line-height:1.25;color:#fff;letter-spacing:.01em}
.rel,.ess-grid{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:transparent;border:1px solid var(--line2);border-radius:0;padding:6px 11px;font-size:12.5px;text-align:start;display:inline-flex;align-items:center;color:var(--ink)}
.chip:hover{border-color:#fff;background:rgba(255,255,255,.05)}
.chip .dot{width:6px;height:6px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:22px 0 4px;border-top:1px solid var(--line)}
.stat{padding:14px 0 14px 16px;border-bottom:1px solid var(--line)}
.stat:nth-child(odd){padding-inline-start:0;border-inline-end:1px solid var(--line)}
.stat:nth-child(even){padding-inline-start:18px}
.stat span{display:block;font-family:var(--display);font-weight:500;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font-family:var(--display);font-weight:300;font-size:34px;line-height:1.1;margin-top:6px;color:#fff;letter-spacing:.01em}
.stat b small{font-size:15px;font-weight:500;margin-inline-start:4px;color:var(--ink2);letter-spacing:.06em}
.intro .lede{font-size:15px;color:var(--ink2)}
.specs th{text-align:start;width:30%;font-family:var(--display);font-weight:500;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.specs td{padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink)}
.note{font-size:12px;color:var(--faint);margin-top:18px;line-height:1.55}
.searchrow{position:sticky;top:0;background:var(--panel);padding:18px 22px;border-bottom:1px solid var(--line);z-index:2}
#search{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:0;font:inherit;background:transparent;color:#fff;outline:none}
#search::placeholder{color:var(--faint)}
#search:focus{border-color:rgba(255,255,255,.6)}
.lgroup{border-bottom:1px solid var(--line)}
.lhead{display:flex;align-items:center;padding:18px 22px 8px;font-family:var(--display);font-weight:500;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2)}
.lhead .cnt{margin-inline-start:auto;color:var(--faint);letter-spacing:.1em}
.litem{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:start;background:transparent;border:0;padding:9px 22px 9px 37px;position:relative}
.litem:hover{background:rgba(255,255,255,.035)}
.litem.on{background:rgba(255,255,255,.06)}
.litem.on::before{content:"";position:absolute;inset-inline-start:22px;top:12px;bottom:12px;width:2px;background:#fff}
.lname{font-size:14px;color:var(--ink)}
.lloc{font-size:12px;color:var(--muted)}
.star{color:var(--amber);font-style:normal;font-size:11px}
.empty{padding:22px;color:var(--muted)}
.lead{color:var(--ink2)}
.sched{font-size:13px}
.sched th{text-align:start;padding:10px 12px 10px 0;font-family:var(--display);font-weight:500;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line2)}
.sched td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink2)}
.sched td:first-child{width:30%}
.sched td:first-child b{font-family:var(--display);font-weight:500;font-size:13px;color:#fff;letter-spacing:.02em}
.src{display:block;font-size:11px;color:var(--faint);margin-top:4px}
.checks li{padding:7px 0 7px 18px}
.callout{margin-top:22px;border-inline-start:2px solid var(--warn);background:rgba(255,138,115,.07);padding:14px 16px;color:var(--ink2)}
.callout b{color:#fff}
@media (max-width: 980px){
  .top{flex-direction:column;align-items:flex-start;justify-content:center;height:auto;padding:14px 16px 0;gap:10px}
  .brand{flex-direction:column;align-items:flex-start;gap:8px}
  .word{font-size:20px}
  .t2{flex-wrap:wrap;gap:6px 10px}
  .tabs{height:auto;width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .tabs button{height:42px;white-space:nowrap}
  .layout{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}
  .panel{border-inline-start:0;border-top:1px solid var(--line)}
  .tabpane{height:auto;max-height:none;padding:22px 18px 30px}
  .toolbar,.views,.sysbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;inset-inline:10px;max-width:none;justify-content:flex-start}
  .toolbar::-webkit-scrollbar,.views::-webkit-scrollbar,.sysbar::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
  .toolbar button,.views button,.sysbar button{white-space:nowrap;flex:0 0 auto}
  .toolbar{inset-block-start:10px}
  .views{inset-block-start:50px;flex-direction:row}
  .views button{margin-top:0;margin-inline-start:-1px}
  .sysbar{inset-block-end:28px}
  .hint{font-size:10px;inset-block-end:8px;inset-inline-start:10px}
  h2{font-size:26px}
}

,.32,.003),i.trim).position.set(.24,.907,-.36);for(let h of[1,-1])n("airbags",re(.02,.1,.34,.01),i.trim).position.set(-.005,.56,h*.36);return{root:t,hoodPivot:l,edges:d,wheels:g,hoodAngle:1}}var wn={body:{name:"Body & exterior",color:"#6b7c93"},engine:{name:"Engine",color:"#e5533d"},fuel:{name:"Fuel, air & exhaust",color:"#f08c1a"},cooling:{name:"Cooling",color:"#21b0b8"},drivetrain:{name:"Transmission & drivetrain",color:"#8e6bd8"},chassis:{name:"Suspension, steering & brakes",color:"#4fa365"},ac:{name:"Air-conditioning",color:"#3aa0f2"},electrical:{name:"Electrical & lighting",color:"#f2cc1d"},interior:{name:"Interior & safety",color:"#d0619d"}},vf=[["Model",'Toyota New GR Supra 3.0 (A90, 2022 update). Launched in Indonesia by Toyota Astra Motor on 7 Dec 2022; listed as "GR Supra (Spot Order)"'],["Engine","B58 3.0-litre inline-six petrol, 2,998 cc, 82.0 \xD7 94.6 mm, 24-valve DOHC, chain-driven cams with variable valve timing (intake and exhaust), compression 10.2:1"],["Induction & fuel","Single twin-scroll turbocharger, water-to-air intercooler built into the intake manifold, direct injection"],["Power","387 PS (285 kW) @ 5,800\u20136,500 rpm"],["Torque","500 Nm @ 1,800\u20135,000 rpm"],["Transmission","8-speed Sports Automatic (ZF 8HP51), final drive 3.150 (Toyota UK). No manual gearbox in Indonesia"],["Layout","Front-mid engine, rear-wheel drive, two seats; 50:50 weight distribution (Toyota Ireland)"],["Body","Aluminium-and-steel composite monocoque; two doors and a lift-up hatch"],["Size","4,380 \xD7 1,855 \xD7 1,299 mm; wheelbase 2,470 mm; track 1,594 mm front / 1,589 mm rear"],["Suspension","Double-joint MacPherson strut (front), 5-link (rear); Adaptive Variable Suspension (AVS) standard"],["Brakes","Ventilated discs all round: front 348 \xD7 36 mm with 4-piston fixed calipers (Brembo per Toyota Ireland), rear 345 \xD7 24 mm with 1-piston floating calipers (sizes per Toyota UK)"],["Tyres","255/35 R19 front, 275/35 R19 rear, 19-inch forged wheels"],["Fuel tank","52 litres (Toyota UK)"],["Kerb weight","Not published for Indonesia. UK 3.0 automatic: 1,495 kg without driver"],["Price at launch","Rp 2,188,400,000 on the road, Jakarta (detik.com, Dec 2022)"]],bf=["oil_system","coolant_tank","battery","jump_post","wheels_tyres","tyre_repair_kit","brakes_front","brake_master","air_filter","cabin_filter","ignition","wipers","instrument_cluster","headlamps"],Sf=[["Service reminder (condition-based)","Whenever the instrument cluster or Control Display says a service is due","The car tracks items such as engine oil, brake fluid and vehicle checks, and tells you when each is due. Check the service menu on the Control Display every month or so.","US owner's manual"],["Periodic check (Indonesia)","Every 6 months","This is Toyota Indonesia's general periodic-service rhythm; it is not specific to the Supra. Book it with a Toyota Astra dealer that services GR Supra.","Auto2000"],["Warranty","3 years / 100,000 km; can be extended to 4 years / 120,000 km after the first service","These are Toyota Indonesia's general terms. Confirm the terms for your Supra with the dealer, and keep every service record.","Auto2000"],["Engine oil + filter","US schedule: every 10,000 miles (about 16,000 km) or 12 months, or at the service reminder, whichever comes first","Use SAE 0W-20 that meets BMW Longlife-17 FE+, or Toyota Genuine 0W-20 C5. Capacity is about 6.5 L with the filter (approximate). In Jakarta heat and stop-go traffic, changing it at the 6-monthly check is the safer choice (general practice).","US maintenance guide (secondary)"],["Inspection service","US schedule: every 10,000 miles (about 16,000 km) or 12 months","Covers brakes, tyres, suspension, leaks, lights, belts and fluid levels.","US maintenance guide (secondary)"],["Brake fluid","First change at 36 months, then every 24 months","European workshop data lists DOT 4 LV fluid. Brake fluid absorbs moisture, and Jakarta humidity makes changing it on time important.","US maintenance guide (secondary) + European workshop data"],["Automatic transmission fluid (ZF 8HP51)","No fixed interval found; ask your dealer","European workshop data lists ATF-3+ fluid, about 9.1 L for a dry fill. The level is checked hot with a scan tool, so this is not a DIY job.","European workshop data"],["Rear differential oil","Follow your dealer's schedule","European workshop data gives about 0.8 L, or 1.0 L for the limited-slip (active) differential.","European workshop data"],["Spark plugs","At the service reminder or your dealer's schedule","No interval was verified for Indonesia. Turbo engines are hard on spark plugs: a misfire or a flashing check-engine light means check them early.","General practice"],["Engine air filter","Inspect at every service; replace on the dealer's schedule or when dirty","Jakarta dust and roadworks can clog it sooner.","General practice"],["Cabin microfilter","Inspect at every service; replace when dirty","A clogged filter weakens the AC airflow and causes smells.","General practice"],["Coolant (engine circuit and intercooler circuit)","Check the level monthly; replace on the dealer's schedule","Use only the coolant type in your manual. Never top up with generic coolant or plain water.","General practice"],["Tyres","Check pressures monthly; replace at the wear bars or when the rubber is old","Front and rear sizes are different, so the tyres cannot be swapped front to rear. Use the pressures on the door-pillar placard.","General practice"],["12 V AGM battery","Have it tested at every service","The battery sits in the boot. Replace it only with an AGM battery, and ask whether the new one must be registered to the car.","General practice"],["Wiper blades","Every 6\u201312 months","Tropical sun hardens the rubber quickly.","General practice"],["AC service","About once a year","This includes cleaning the evaporator and condenser and checking the system's performance.","General practice"]],Mf=[["Every week or before a long trip",['Check the engine oil on the Control Display under "Vehicle status". There is no dipstick. Add oil only if the car asks for it, and only the amount it shows.',"With the engine cold, check that the coolant expansion tank is at the correct level. Never open it while the engine is warm.","Check that the brake fluid reservoir is between MIN and MAX. A falling level means worn pads or a leak.","Check tyre pressures cold, using the door-pillar placard. Look for sidewall bulges, which low-profile 19-inch tyres get easily from potholes.","Walk around the car with the lights on: headlamps, daytime running lights, brake lights, turn signals and reverse lights.","Look under the car for drips: oil (brown or black), coolant (coloured), brake fluid (yellowish) and AC water (clear, normal)."]],["Every month",["Look at the service menu on the Control Display so that you can book upcoming items in time.","Check that the tyre repair kit is in the boot and its sealant is within its use-by date.","If the car sits for weeks, drive it or keep the boot-mounted AGM battery on a suitable maintainer.","Check the wiper blades for streaking and top up the washer bottle.","Run the AC on maximum. The air should be cold, with no musty smell."]],["Every time you drive",["All warning lights should go out after starting. Red means stop safely; amber means book a check.","Let the engine warm up before using full power. The oil warms more slowly than the coolant (general practice).","After hard driving, drive gently for the last minute or two so the turbo can cool down (general practice).","Use high-octane petrol. Toyota Astra publishes no minimum octane that we could find, but European workshop data says at least RON 95, so Pertamax Turbo (RON 98) is the safe choice. Check the label inside the fuel flap and your manual.","The nose is low. Take ramps, kerbs and speed bumps slowly and at an angle."]]],wf=[],fe=i=>wf.push(i);fe({id:"hood",sys:"body",name:"Bonnet (hood)",local:"Kap mesin",ext:!0,what:"The long, low bonnet covers the engine bay. It is hinged at the windscreen end, and the engine sits far back underneath it, behind the front axle.",facts:["Setting the engine back helps the 50:50 front-to-rear weight distribution that Toyota quotes (Toyota Ireland).","Your owner's manual shows the release lever and the safety catch. Lower the bonnet gently and press it shut near the front edge, not in the middle of the panel."],care:[["Each wash","Wash and wax it. A long, flat bonnet takes the most sun, bird droppings and stone chips."],["Every 6 months","Have the latch and safety catch cleaned and lightly greased at the service."],["As needed","Touch up stone chips early. Clear paint-protection film on the front edge is popular on low sports cars (general practice)."]],signs:["A bonnet-open warning, or the bonnet will not latch.","Stone-chip damage or bubbling paint along the front edge."],who:"both",related:["front_bumper","fenders","strut_brace"]});fe({id:"front_bumper",sys:"body",name:"Front bumper, nose & air intakes",local:"Bumper depan & lubang udara",ext:!0,what:"The low, pointed nose. A large central opening feeds the radiators, and two outer intakes feed the auxiliary radiators. It also carries the number plate and the front parking sensors.",facts:["The nose sits very low. Take steep ramps, kerbs and speed bumps slowly and at an angle so the lower lip does not scrape.","Behind the openings are the AC condenser, the main radiator, a separate radiator for the intercooler circuit, and left and right auxiliary radiators (global technical information)."],care:[["Each wash","Rinse insects, leaves and plastic bags out of all three intakes so air reaches the radiators."],["After a scrape","Check the clips and the under-tray beneath the nose. A loose under-tray can catch on the road."]],signs:["A cracked lower lip or a hanging under-tray after a speed bump.","Rising engine temperature or a weaker AC in traffic. Check the intakes for blockage."],who:"both",related:["ac_condenser","radiator","aux_radiators","ic_radiator","parking_sensors"]});fe({id:"fenders",sys:"body",name:"Front fenders, side vents & wheel-arch liners",local:"Spakbor depan & liner",ext:!0,what:"The strongly bulging panels over the front wheels. Behind each front wheel is a vent-shaped insert. Plastic liners inside the arches keep water and grit out of the engine bay.",care:[["Monthly","Hose the mud out of the wheel arches, especially after driving through flooded roads."],["As needed","Refit any loose liner clips so the liner does not rub on the wide tyres."]],signs:["A rubbing noise on full steering lock or over bumps, which usually means a loose liner.","Chipped paint on the arch edge from stones thrown up by the tyres."],who:"diy",related:["wheels_tyres","front_suspension","hood"]});fe({id:"doors",sys:"body",name:"Doors (hinges, locks & windows)",local:"Pintu",ext:!0,what:"Two long doors. Each contains the window glass and its electric motor, the lock, a speaker and a side-impact beam.",facts:["The doors are long, as on most two-seat coup\xE9s. Open them carefully in tight Jakarta parking spaces."],care:[["Every 6 months","Lubricate the hinges, the check strap and the latch."],["Monthly","Wipe the rubber seals and treat them with a protectant so they do not stick or crack in the heat."],["As needed","Keep the drain holes along the bottom of each door clear."]],signs:["Wind noise, or water on the floor mat.","A slow or noisy window.","A door that has to be slammed to close."],who:"both",related:["side_windows","mirrors","body_structure"]});fe({id:"quarter_panels",sys:"body",name:"Rear haunches (quarter panels) & fuel lid",local:"Panel samping belakang & tutup tangki",ext:!0,what:"The wide, muscular panels over the rear wheels, which are the widest part of the car. One of them carries the fuel-filler lid.",facts:["The car is 1,855 mm wide (Toyota Astra). Watch the wide rear haunches in narrow lanes and on car-park ramps."],care:[["Each wash","Clean the arch lips and the shelf below the side and rear windows, where dirt collects."],["Every fill-up","Close the fuel cap until it clicks, and shut the lid fully."]],signs:["Stone chips just ahead of the rear wheels.","A fuel lid that will not open or close."],who:"diy",related:["fuel_tank","wheels_tyres","tailgate"]});fe({id:"tailgate",sys:"body",name:"Hatch (tailgate) with ducktail spoiler",local:"Pintu bagasi (hatch)",ext:!0,what:"The rear opening is a lift-up hatch. The rear glass and the built-in ducktail spoiler lift with it, held up by gas struts. Underneath is the boot, where the battery and the tyre repair kit are kept.",facts:["The hatch is heavy because it includes the rear glass. Parts suppliers note that worn struts let it drift down."],care:[["Monthly","Check that the hatch stays up on its own. Weak struts can let it drop on your head."],["Every 6 months","Lubricate the latch and keep the rubber seal clean."]],signs:["The hatch drifts down or needs help to stay open.","Water or dust in the boot."],who:"both",related:["back_glass","tail_lamps","battery","tyre_repair_kit"]});fe({id:"rear_bumper",sys:"body",name:"Rear bumper & diffuser",local:"Bumper belakang & diffuser",ext:!0,what:"The rear bumper carries the number plate and rear parking sensors. At the bottom is a black diffuser with the twin exhaust tips and a small lamp in the middle.",care:[["Each wash","Clean around the exhaust tips. Soot builds up on the diffuser."],["After a scrape","Check the diffuser fixings after hitting a kerb or a steep ramp."]],signs:["Cracks after a knock. Also have the parking and blind-spot sensors checked."],who:"diy",related:["exhaust","parking_sensors","tail_lamps"]});fe({id:"roof",sys:"body",name:"Double-bubble roof",local:"Atap (double bubble)",ext:!0,what:'The short roof has two raised "bubbles" with a shallow channel between them. This classic sports-car styling cue was originally used to give room for helmets.',care:[["Each wash","Wash and wax the roof too. The Indonesian sun fades horizontal paint fastest."],["Parking","Use shade or a breathable car cover when the car is parked outdoors for long periods."]],signs:["Faded or chalky paint.","Water marks on the headliner."],who:"diy",related:["windshield","back_glass","body_structure"]});fe({id:"windshield",sys:"body",name:"Windscreen",local:"Kaca depan",ext:!0,what:"Laminated safety glass bonded to the body. It is part of the cabin structure and supports the passenger airbag when it deploys.",care:[["Weekly","Clean it inside and out. Haze on the inside reduces night visibility."],["As needed","Have stone chips resin-repaired before they spread into cracks."],["As needed","Replace the wiper blades when they streak, so they do not drag grit across the glass."]],signs:["Chips in the driver's line of sight.","Cracks spreading from the edge."],who:"shop",related:["wipers","airbags","body_structure"]});fe({id:"side_windows",sys:"body",name:"Door windows",local:"Kaca pintu",ext:!0,what:"Electric door windows. The window line kicks up at the back into a point.",care:[["Monthly","Clean the top edge of the glass and the rubber channels. Dirt makes the window motor work harder."],["As needed","Use window film within the legal limit, and make sure the installer does not scratch the glass."]],signs:["A window that stalls or tilts.","Whistling at speed."],who:"both",related:["doors","mirrors"]});fe({id:"back_glass",sys:"body",name:"Rear glass & defogger (part of the hatch)",local:"Kaca belakang & defogger",ext:!0,what:"The long, sloping rear window is built into the hatch and lifts with it. Printed heater lines clear mist from the glass.",facts:["Like most rear windows, it is tempered glass. It cannot be chip-repaired, only replaced."],care:[["As needed","Clean along the heater lines with a soft cloth. Do not scrape the inside, or the lines will break."]],signs:["Part of the glass will not demist, which means a broken heater line."],who:"diy",related:["tailgate","roof"]});fe({id:"mirrors",sys:"body",name:"Door mirrors",local:"Spion",ext:!0,what:"Electrically adjustable door mirrors, mounted on short stalks from the tops of the doors.",care:[["As needed","Clean the glass with a soft cloth. Adjust the mirrors to cover the blind spots beside the wide rear haunches."]],signs:["A mirror that vibrates or will not adjust."],who:"diy",related:["doors","side_windows"]});fe({id:"body_structure",sys:"body",name:"Body structure: monocoque, pillars, sills, floor & bulkhead",local:"Rangka bodi monokok, pilar, sill & lantai",ext:!0,what:"The GR Supra has no separate chassis frame. The body is an aluminium-and-steel composite monocoque: the floor, sills, pillars, strut towers and engine-bay bulkhead form one stiff shell, and the engine and suspension bolt onto it.",facts:["Aluminium-and-steel composite body construction (Toyota).","Lift the car only at the jacking points shown in the owner's manual. Jacking anywhere else on the floor or sills can dent them (general practice)."],care:[["Every 6 months","Rinse the underbody, especially after floods, and check the sills and floor for scrape damage."],["After an impact","Have a qualified body shop check the alignment. Repairs to mixed aluminium and steel need the right equipment."]],signs:["Scrapes or dents under the sills.","Doors or the hatch no longer line up."],who:"shop",related:["subframes","strut_brace","roof"]});fe({id:"engine_block",sys:"engine",name:"B58 3.0 inline-six (block, pistons, crankshaft)",local:"Blok mesin B58 (6 silinder segaris)",bay:!0,what:"A 3.0-litre straight-six petrol engine, mounted lengthways and set far back behind the front axle. Pistons in six cylinders turn the crankshaft, and a turbocharger pushes in extra air.",facts:["B58: 2,998 cc, bore \xD7 stroke 82.0 \xD7 94.6 mm, compression 10.2:1, 24-valve DOHC (Toyota Astra).","387 PS (285 kW) at 5,800\u20136,500 rpm and 500 Nm at 1,800\u20135,000 rpm (Toyota Astra spec page). The December 2022 launch release quoted 350 PS.","Direct injection and a single twin-scroll turbocharger."],care:[["Every service","Oil of the right specification, changed on time, does more for engine life than anything else."],["Daily","Let the engine warm up before using full power (general practice)."],["Fuel","Use high-octane petrol. European workshop data gives RON 95 as the minimum. Pertamax Turbo (RON 98) is the safe choice; check the fuel-flap label and your manual."]],signs:["A check-engine light, especially a flashing one (misfire). Slow down and have it checked.","Knocking, loss of power or rising oil use.","Oil or coolant leaks under the front of the car."],who:"shop",related:["cylinder_head","oil_system","turbo","timing_chain"]});fe({id:"cylinder_head",sys:"engine",name:"Cylinder head, valves & cam cover",local:"Kepala silinder & tutup klep",bay:!0,what:"Sits on top of the block. It holds 24 valves, two camshafts, the fuel injectors and the spark plugs. The cam cover on top seals the oil in.",facts:["DOHC with variable valve timing on both the intake and exhaust camshafts (Toyota Astra)."],care:[["As needed","Have any oil seeping from the cam-cover gasket fixed early. Oil dripping onto a hot exhaust smells, and can be a fire risk."]],signs:["A burning-oil smell after driving.","Oily patches around the top of the engine.","A rough idle together with a check-engine light."],who:"shop",related:["engine_block","ignition","injectors","engine_cover"]});fe({id:"engine_cover",sys:"engine",name:"Engine cover",local:"Cover mesin",bay:!0,what:"A plastic cover over the top of the engine. It hides the ignition coils and fuel injectors and reduces noise.",care:[["When cleaning","Wipe it with a damp cloth when the engine is cold. Do not pressure-wash the engine bay."],["After a service","Make sure it is clipped back in place."]],signs:["A rattle from under the bonnet, which can mean a loose cover."],who:"diy",related:["ignition","cylinder_head","oil_system"]});fe({id:"oil_system",sys:"engine",name:"Engine oil: filler cap & electronic level (no dipstick)",local:"Oli mesin, tutup oli & sensor level oli",ess:!0,bay:!0,what:"Oil lubricates, cools and cleans the engine and turbo. You top it up through the filler cap on top of the engine. There is no dipstick: a sensor in the oil pan measures the level, and you read it on the Control Display.",facts:[`Check the oil level on the Control Display under "Vehicle status" (Toyota US owner's manual).`,"Oil: SAE 0W-20 that meets BMW Longlife-17 FE+, or Toyota Genuine 0W-20 C5. About 6.5 L with the filter (US maintenance guide via a secondary source; approximate, so confirm with your dealer)."],care:[["Weekly","Read the oil level on the Control Display. Add oil only if the car asks for it, and only the amount it shows."],["At the reminder","Change the oil and filter when the service reminder appears or at your dealer's interval, whichever comes first."],["Jakarta traffic","Heat and stop-go traffic are hard on oil. Changing it at the 6-monthly dealer check is the safer choice (general practice)."]],interval:[["US schedule","Every 10,000 miles (about 16,000 km) or 12 months, or at the reminder, whichever comes first"],["Indonesia","Follow the car's service reminder and your Toyota Astra dealer"]],signs:["The red oil-pressure warning: stop safely and switch off the engine.","A low-oil message on the display.","Blue smoke, or the level dropping quickly."],who:"both",related:["oil_filter","oil_pan","oil_cooler","turbo"]});fe({id:"oil_filter",sys:"engine",name:"Oil filter",local:"Filter oli",bay:!0,what:"A paper filter cartridge in a housing on the engine. It traps particles before the oil reaches the bearings and the turbo.",care:[["Every oil change","Replace the cartridge and its seals with the correct genuine-quality parts."]],interval:[["Replace","With every oil change"]],signs:["Oil seeping around the filter housing after a service."],who:"shop",related:["oil_system","oil_pan"]});fe({id:"oil_pan",sys:"engine",name:"Oil pan (sump), drain plug & level sensor",local:"Carter / bak oli",what:"The oil reservoir at the bottom of the engine. Old oil drains out through the plug, and the oil-level sensor sits here too.",care:[["Every oil change","Ask for a new drain-plug washer, and make sure the plug is tightened correctly."],["Driving","The car sits low. Take speed bumps and rough roads slowly."]],signs:["Fresh oil spots under the front of the car.","An oil warning after something hits the underside."],who:"shop",related:["oil_system","engine_block","subframes"]});fe({id:"turbo",sys:"engine",name:"Twin-scroll turbocharger",local:"Turbo (twin-scroll)",bay:!0,what:'A single turbocharger on the exhaust side of the engine. Exhaust gas spins a turbine, which drives a compressor that pushes extra air into the engine. "Twin-scroll" means the exhaust from two groups of three cylinders is kept separate, so the turbo spins up quickly.',facts:["A single twin-scroll turbocharger (Toyota Astra; Toyota UK)."],care:[["Every drive","After hard driving, drive gently for the last minute or two, or let the engine idle briefly, so the turbo can cool (general practice)."],["Every service","Clean oil changed on time and a clean air filter protect the turbo's bearings and blades."]],signs:["A whistling or siren-like noise.","Blue smoke.","A sudden loss of power with a warning message."],who:"shop",related:["intake","intercooler","catalysts","oil_system"]});fe({id:"timing_chain",sys:"engine",name:"Timing chain (rear of engine)",local:"Rantai keteng (timing chain)",bay:!0,what:"A steel chain that keeps the crankshaft and camshafts in step. On the B58 it sits at the back of the engine, at the end nearest the windscreen.",facts:["Chain-driven camshafts (Toyota Astra). Engine teardowns show the chain at the rear of the engine.","Chains are designed for a long life, and we found no scheduled replacement. Good oil keeps the chain and its tensioner healthy (general practice)."],care:[["Every service","Keep the oil changes on time."]],signs:["A rattle for a few seconds after a cold start, or a check-engine light about cam timing. Have it checked."],who:"shop",related:["engine_block","cylinder_head","oil_system"]});fe({id:"ignition",sys:"engine",name:"Spark plugs & ignition coils",local:"Busi & koil",ess:!0,bay:!0,what:"Six ignition coils under the engine cover, one per cylinder, make the high voltage for six spark plugs. The plugs ignite the fuel and air in each cylinder.",facts:["No replacement interval was verified for Indonesia, so follow the service reminder and your dealer. Turbo engines are hard on spark plugs (general practice)."],care:[["Dealer schedule","Replace the plugs with the specified type. Poor fuel and hard use shorten their life."],["As needed","If a misfire is reported, the plugs and coils are the first things a workshop checks."]],signs:["A flashing check-engine light, or juddering when accelerating (misfire).","Hard starting or a rough idle."],who:"shop",related:["cylinder_head","engine_cover","ecu"]});fe({id:"drive_belt",sys:"engine",name:"Accessory drive belt & pulleys",local:"Fan belt / V-belt",bay:!0,what:"A ribbed belt at the front of the engine. The crankshaft pulley uses it to drive accessories such as the alternator and the AC compressor.",care:[["Every service","Have it checked for cracks, glazing and missing ribs."]],signs:["A squeal at start-up or when the AC switches on.","A battery-charge warning.","The AC suddenly blows warm."],who:"shop",related:["alternator","ac_compressor","engine_block"]});fe({id:"air_filter",sys:"fuel",name:"Air filter box & element",local:"Filter udara",ess:!0,bay:!0,what:"A paper element inside the black box at the front of the engine bay. It cleans the air before it reaches the turbo.",care:[["Every service","Have it inspected. Replace it on the dealer's schedule, or sooner if it is dark and clogged."],["Dusty use","Jakarta dust and roadworks clog the filter faster (general practice)."],["Never","Do not wash a paper element, and never drive without one."]],interval:[["Inspect","At every service"],["Replace","On the dealer's schedule or at the service reminder (no verified interval)"]],signs:["Sluggish acceleration.","Higher fuel consumption."],who:"both",related:["intake","turbo"]});fe({id:"intake",sys:"fuel",name:"Intake ducts, throttle body & intake manifold",local:"Saluran intake, throttle body & intake manifold",bay:!0,what:"Ducts carry clean air from the filter to the turbo. A charge pipe then carries the compressed air to the electronic throttle and into the plastic intake manifold on the side of the engine.",care:[["Every service","Have the hose clamps and couplings checked. A loose boost pipe causes a big loss of power."],["Modifications","Ask your dealer about the warranty before fitting an aftermarket intake."]],signs:["A hissing sound when accelerating.","A loss of power with a warning message."],who:"shop",related:["air_filter","turbo","intercooler","injectors"]});fe({id:"intercooler",sys:"fuel",name:"Water-to-air intercooler (inside the intake manifold)",local:"Intercooler (water-to-air)",bay:!0,what:"Air leaving the turbo is hot. Instead of a large air-to-air cooler at the front, the B58 cools it with a liquid-cooled core built into the intake manifold. That coolant runs in its own low-temperature circuit, with its own radiator at the front of the car.",facts:["An indirect (water-to-air) intercooler built into the plastic intake manifold, with a separate low-temperature coolant circuit (B58 engine teardowns)."],care:[["Every service","Have the level and hoses of the low-temperature circuit checked along with the engine coolant."]],signs:["Power fades on hot days or after repeated hard acceleration. Have the intercooler circuit checked."],who:"shop",related:["ic_radiator","intake","turbo"]});fe({id:"injectors",sys:"fuel",name:"Direct fuel injection (high-pressure pump, rail & injectors)",local:"Injektor & pompa bensin tekanan tinggi",bay:!0,what:"A high-pressure pump driven by the engine feeds a fuel rail. Six injectors spray fuel directly into the cylinders, timed by the engine computer.",facts:["Direct injection (Toyota Astra specification)."],care:[["Every fill-up","Buy high-octane petrol from busy, reputable stations."],["As needed","Do not use fuel-system additives unless your dealer recommends them."]],signs:["Rough running or a misfire.","A fuel smell in the engine bay. Stop and have it checked, because this is a fire risk.","A check-engine light."],who:"shop",related:["fuel_tank","ecu","intake"]});fe({id:"fuel_tank",sys:"fuel",name:"Fuel tank (52 L), filler & fuel lines",local:"Tangki bensin",what:"Holds 52 litres of petrol. In the model it sits low, ahead of the rear axle; the exact location and shape differ on the real car. A fuel line runs forward to the engine, and a filler neck runs to the lid on the rear quarter panel.",facts:["52 L capacity (Toyota UK).","Toyota Astra does not publish a minimum octane that we could find. European workshop data says at least RON 95, so a high-octane fuel such as Pertamax Turbo (RON 98) is the safe choice. Check the label inside the fuel flap and your manual."],care:[["Every fill-up","Close the cap until it clicks, and stop at the first automatic click-off."],["As needed","Try not to run the tank nearly empty."],["Never","Never fill with diesel or low-octane fuel. If it happens, do not start the engine."]],signs:["A petrol smell around the car.","A check-engine light after refuelling, often because the cap was not closed properly."],who:"both",related:["injectors","quarter_panels"]});fe({id:"catalysts",sys:"fuel",name:"Exhaust manifold, downpipe & catalytic converter",local:"Exhaust manifold & katalis",bay:!0,what:"Exhaust gas leaves the six cylinders, spins the turbo, then passes through a catalytic converter, which turns harmful gases into less harmful ones.",care:[["Fuel","Use the right fuel and fix misfires quickly. Unburnt fuel can overheat and damage the converter."],["Parking","Do not park over dry grass. The converter gets extremely hot."]],signs:["A rotten-egg smell.","A rattle from under the car.","A check-engine light about emissions."],who:"shop",related:["turbo","exhaust","ignition"]});fe({id:"exhaust",sys:"fuel",name:"Exhaust pipes, rear silencer & twin tips",local:"Knalpot (pipa, muffler & ujung knalpot)",what:"Pipes run back under the car to a silencer behind the rear axle. The exhaust leaves through twin tips, one on each side of the rear diffuser.",care:[["Every 6 months","Look for scrapes, loose hangers and rust."],["Driving","Take ramps and speed bumps slowly, because the exhaust runs low."]],signs:["A louder exhaust, or rattles.","An exhaust smell inside the cabin. This is dangerous; have it checked at once."],who:"shop",related:["catalysts","rear_bumper"]});fe({id:"radiator",sys:"cooling",name:"Main radiator",local:"Radiator utama",bay:!0,what:"The radiator sheds engine heat into the air flowing in through the nose. It sits behind the AC condenser.",facts:["The system is filled and checked at the expansion tank. Use only the coolant type in your manual, and never top up with generic coolant."],care:[["Monthly","Keep the front openings clear of debris."],["Every service","Have the hoses and the coolant level checked."],["Safety","Never open the cooling system when it is hot."]],interval:[["Coolant","On the dealer's schedule (no verified interval)"]],signs:["A temperature warning on the display.","A sweet coolant smell, or crusty deposits on the fins."],who:"shop",related:["cooling_fan","coolant_tank","hoses","aux_radiators"]});fe({id:"cooling_fan",sys:"cooling",name:"Electric cooling fan & shroud",local:"Kipas radiator elektrik",bay:!0,what:"A single electric fan behind the radiator pulls air through when the car is slow or parked. It is electronically controlled and can keep running, or start by itself, after you switch the engine off.",facts:["One electric fan (parts-supplier data)."],care:[["Safety","Keep hands, ties and hair away from the fan at all times, even when the engine is off."],["Every service","Have the fan checked for noise and correct operation."]],signs:["The temperature rises only in traffic.","The fan never runs, or roars all the time."],who:"shop",related:["radiator","battery"]});fe({id:"aux_radiators",sys:"cooling",name:"Left & right auxiliary radiators",local:"Radiator tambahan kiri & kanan",what:"Two small extra radiators behind the outer bumper intakes. They add cooling capacity for the engine coolant.",facts:["Left and right auxiliary radiators in the front bumper (parts-supplier data)."],care:[["Monthly","Rinse the outer intakes gently. Debris collects in front of these small radiators."],["After a knock","A bumper hit can damage them, so have them checked for leaks."]],signs:["Coolant drips at the front corners.","The coolant level keeps dropping."],who:"both",related:["radiator","front_bumper","coolant_tank"]});fe({id:"ic_radiator",sys:"cooling",name:"Low-temperature (intercooler) radiator & circuit",local:"Radiator intercooler (sirkuit suhu rendah)",what:"A separate radiator low in the nose cools the liquid for the water-to-air intercooler. Pipes carry this coolant to and from the intake manifold.",facts:["A separate low-temperature circuit with its own heat exchanger at the front (B58 teardowns; parts-supplier data). The model shows it low, behind the central intake."],care:[["Every service","Have the level and hoses of this circuit checked too. It is easy to forget."],["Monthly","Keep the central lower intake clear."]],signs:["Power fades on hot days or during repeated hard runs.","Coolant drips under the nose."],who:"shop",related:["intercooler","radiator","front_bumper"]});fe({id:"coolant_tank",sys:"cooling",name:"Coolant expansion tank",local:"Tabung ekspansi air radiator",ess:!0,bay:!0,what:"The expansion tank gives coolant room to expand when it is hot. It is also where the system is checked and topped up.",facts:["Use only the coolant type in your owner's manual. Do not top up with generic coolant or plain water. European workshop data lists a BMW-type long-life coolant."],care:[["Monthly","With the engine cold, check the level against the marks or as described in the manual."],["Safety","Never open the cap on a warm engine, because hot coolant can spray out."]],interval:[["Replace coolant","On the dealer's schedule (no verified interval)"]],signs:["A low-coolant message.","The level keeps dropping.","A sweet smell around the car."],who:"both",related:["radiator","hoses","aux_radiators"]});fe({id:"hoses",sys:"cooling",name:"Coolant hoses & thermostat housing",local:"Selang radiator & thermostat",bay:!0,what:"Rubber hoses carry coolant between the engine and the radiators. The thermostat controls the engine's operating temperature.",care:[["Every service","Have the hoses checked for swelling, cracks and leaks."]],signs:["Coolant drips.","A temperature warning.","The engine takes a very long time to warm up."],who:"shop",related:["radiator","coolant_tank","oil_cooler"]});fe({id:"oil_cooler",sys:"cooling",name:"Engine oil cooler (oil-to-coolant)",local:"Pendingin oli mesin (oil cooler)",bay:!0,what:"A plate-type heat exchanger on the engine block. Engine oil flows past the coolant, which keeps the oil temperature in check on hot days and during hard driving.",facts:["An oil-to-coolant cooler mounted on the block (EngineLabs, B58 technical article)."],care:[["Every service","Have the area checked for oil or coolant seeping out."]],signs:["Brown sludge in the coolant tank, or milky oil. Stop driving and have it checked."],who:"shop",related:["oil_system","hoses","engine_block"]});fe({id:"trans_cooler",sys:"cooling",name:"Transmission oil cooler",local:"Pendingin oli transmisi",what:"A small cooler at the front of the car keeps the automatic transmission fluid at the right temperature. Lines run back to the gearbox.",facts:["Global parts information shows a transmission oil cooler at the front of the car. Its position in the model is approximate."],care:[["Every service","Have the lines and fittings checked for leaks."]],signs:["Reddish-brown oil drips at the front.","A transmission warning, or harsh shifts on hot days."],who:"shop",related:["transmission","radiator"]});fe({id:"transmission",sys:"drivetrain",name:"8-speed automatic (ZF 8HP51)",local:"Transmisi otomatis 8-percepatan",what:"An 8-speed torque-converter automatic bolted behind the engine, under the centre tunnel. You change gear with the selector or the paddles.",facts:["8-speed Sports Automatic, ZF 8HP51, with a 3.150 final drive (Toyota UK). Indonesian cars are automatic only.","European workshop data lists ATF-3+ fluid, about 9.1 L for a dry fill. No fixed change interval was found, so ask your dealer."],care:[["Driving","Come to a complete stop before selecting R or P."],["Every service","Have it checked for leaks. The fluid level is checked hot with a scan tool, not a dipstick (general practice for this gearbox type)."]],interval:[["Fluid","No verified interval; follow your dealer"]],signs:["Harsh, slipping or delayed gear changes.","A transmission warning message.","Red fluid drips under the middle of the car."],who:"shop",related:["propshaft","gear_selector","trans_cooler"]});fe({id:"propshaft",sys:"drivetrain",name:"Propeller shaft",local:"As kopel / propeller shaft",what:"Carries drive from the gearbox back to the rear differential, with flexible joints at the ends.",care:[["Every service","Have the joints and mountings checked for play."]],signs:["A clunk when pulling away.","Vibration that increases with speed."],who:"shop",related:["transmission","differential"]});fe({id:"differential",sys:"drivetrain",name:"Rear differential (active differential on global-spec cars)",local:"Gardan / differential belakang",what:"Turns the drive towards the rear wheels and lets them rotate at different speeds in corners.",facts:["Global-spec cars have an electronically controlled active differential (Toyota Ireland; Toyota US owner's manual). Toyota Astra does not state this, so ask your dealer whether your car has it.","European workshop data gives about 0.8 L of oil, or 1.0 L for the limited-slip (active) differential."],care:[["Dealer schedule","Ask at each service whether an oil change is due."],["Every service","Have it checked for leaks."]],signs:["A whine that changes as you press or lift off the accelerator.","Clunks in tight turns.","Oil on the inside of the rear wheels."],who:"shop",related:["propshaft","driveshafts","rear_suspension"]});fe({id:"driveshafts",sys:"drivetrain",name:"Rear drive shafts & CV joints",local:"As roda / drive shaft belakang",what:"Two shafts run from the differential to the rear wheels. Their constant-velocity (CV) joints are protected by rubber boots.",care:[["Every service","Have the rubber boots checked for tears. A torn boot lets the grease out and dirt in."]],signs:["Clicking in tight turns.","Grease spattered inside the rear wheels."],who:"shop",related:["differential","rear_suspension"]});fe({id:"front_suspension",sys:"chassis",name:"Front suspension (double-joint MacPherson struts)",local:"Kaki-kaki depan (MacPherson double-joint)",what:'Each front wheel is held by a strut with a coil spring and two separate lower links (the "double joint"). The control arms and swivel bearings are aluminium to save weight.',facts:["Double-joint MacPherson strut front suspension (Toyota Astra; Toyota UK), with aluminium control arms and swivel bearings (Toyota)."],care:[["Every service","Have the ball joints, bushings and rubber boots checked."],["After an impact","Have the alignment checked after a big pothole or kerb strike. Wide, low-profile tyres wear quickly when the alignment is out."]],signs:["Knocking over bumps.","The steering pulls or wanders.","Uneven wear on the tyre edges."],who:"shop",related:["avs_dampers","stabilisers","steering","subframes"]});fe({id:"rear_suspension",sys:"chassis",name:"Rear suspension (5-link)",local:"Kaki-kaki belakang (multi-link 5 link)",what:"Five links on each side hold each rear wheel precisely in place, and coil springs carry the load.",facts:["Multi-link (5-link) rear suspension (Toyota Astra; Toyota UK)."],care:[["Every service","Have the bushings and links checked."],["After an impact","Have the alignment checked."]],signs:["Clunks from the rear.","The rear tyres wearing on their inner edges.","The car feels nervous in bumpy corners."],who:"shop",related:["avs_dampers","driveshafts","subframes"]});fe({id:"avs_dampers",sys:"chassis",name:"Adaptive Variable Suspension (AVS) dampers",local:"Shockbreaker adaptif AVS",what:"Electronically controlled shock absorbers. The car adjusts the damping continuously, and the drive-mode switch lets you choose a softer or firmer setting.",facts:["AVS is standard on the Indonesian GR Supra (Toyota Astra).","The 2022 update retuned the AVS dampers and revised the AVS, electric power steering and stability-control (VSC) tuning (Toyota global)."],care:[["Every service","Have the dampers checked for leaks, and the system checked for stored fault messages."],["Replacement","Fit the correct adaptive dampers. Ordinary dampers will trigger warnings (general practice)."]],signs:["A suspension warning on the display.","A bouncy or crashing ride.","Oil on a damper body."],who:"shop",related:["front_suspension","rear_suspension","ecu"]});fe({id:"stabilisers",sys:"chassis",name:"Anti-roll bars (stabilisers) & bushings",local:"Stabilizer depan & belakang",what:"Torsion bars linking the left and right suspension, front and rear. They reduce body roll in corners.",facts:["The 2022 update introduced new stabiliser bushings (Toyota global)."],care:[["Every service","Have the drop links and bushings checked for play."]],signs:["Knocking over uneven roads, which often means worn links or bushings."],who:"shop",related:["front_suspension","rear_suspension"]});fe({id:"subframes",sys:"chassis",name:"Front & rear subframes (axle carriers)",local:"Subframe depan & belakang",what:"Strong frames bolted under the body. They carry the suspension, the steering rack and the differential.",care:[["Every 6 months","Rinse the underside, especially after floods."],["After an impact","Have them inspected after hitting a kerb or debris."]],signs:["Clunks, or the wheels out of alignment, after an impact."],who:"shop",related:["front_suspension","rear_suspension","body_structure"]});fe({id:"strut_brace",sys:"chassis",name:"Strut-tower brace",local:"Strut bar (penguat menara suspensi)",bay:!0,what:"A bar across the engine bay that links the tops of the front suspension towers and stiffens the front of the car.",care:[["After a service","If it was removed for access, make sure it is refitted and the bolts are tightened."]],signs:["Creaks from the front over bumps, which can mean loose bolts."],who:"shop",related:["front_suspension","body_structure"]});fe({id:"steering",sys:"chassis",name:"Electric power steering (rack & column)",local:"Power steering elektrik (EPS)",what:"An electric motor assists the steering rack. There is no power-steering fluid to check.",facts:["Electric power steering. Its tuning was revised in the 2022 update (Toyota global)."],care:[["Every service","Have the tie-rod ends and rack boots checked."],["Parking","Avoid holding the steering on full lock for a long time. The system may reduce its assistance to protect itself (general practice)."]],signs:["A steering warning, or the steering suddenly feels heavy.","Knocks or play in the steering.","The steering wheel is off-centre when you drive straight."],who:"shop",related:["front_suspension","steering_wheel"]});fe({id:"brakes_front",sys:"chassis",name:"Front brakes (4-piston fixed calipers, 348 mm discs)",local:"Rem depan (kaliper 4 piston & cakram)",ess:!0,what:"Large ventilated discs, gripped by four-piston fixed calipers, do most of the braking.",facts:["Front ventilated discs, 348 \xD7 36 mm (Toyota UK), with 4-piston fixed Brembo calipers (Toyota Ireland)."],care:[["Every service","Have the pad thickness and the disc condition measured."],["Driving","After hard driving, do not sit with your foot pressed hard on the brake for long. Hot pads can leave marks on the discs (general practice)."],["Cleaning","Brake dust on the wheels is normal. Clean it off with a pH-neutral wheel cleaner."]],signs:["A pad-wear warning on the display.","Squealing or grinding.","Vibration when braking."],who:"shop",related:["brake_master","brakes_rear","wheels_tyres","abs_unit"]});fe({id:"brakes_rear",sys:"chassis",name:"Rear brakes & parking brake",local:"Rem belakang & rem parkir",what:"Ventilated rear discs with single-piston floating calipers. On global-spec cars the parking brake is electric and is operated with a switch on the centre console; check how yours works in the manual.",facts:["Rear ventilated discs, 345 \xD7 24 mm (Toyota UK), with 1-piston floating calipers."],care:[["Every service","Have the pads and discs measured."],["Parking","Use the parking brake every time you park, especially on slopes."]],signs:["A parking-brake warning message.","Grinding from the rear."],who:"shop",related:["brakes_front","brake_master","gear_selector"]});fe({id:"brake_master",sys:"chassis",name:"Brake booster, master cylinder & fluid reservoir",local:"Master rem, booster & minyak rem",ess:!0,bay:!0,what:"Your foot pushes the master cylinder, helped by the booster, which sends fluid pressure to all four calipers. The translucent reservoir shows the fluid level.",facts:["Brake fluid: DOT 4 LV type (European workshop data). First change at 36 months, then every 24 months (US maintenance guide, secondary source)."],care:[["Monthly","Check that the level is between MIN and MAX. Do not open the cap unless you need to, because the fluid absorbs moisture."],["On schedule","Have the fluid replaced on time. Jakarta humidity makes this important."]],interval:[["Replace","First at 36 months, then every 24 months (US schedule)"]],signs:["The red brake warning.","A soft or sinking pedal.","A falling fluid level."],who:"both",related:["brakes_front","brakes_rear","abs_unit"]});fe({id:"abs_unit",sys:"chassis",name:"ABS / stability-control (VSC) hydraulic unit",local:"Modul ABS / VSC",bay:!0,what:"A block of pumps and valves with its own computer. It stops the wheels locking under braking and, as part of the stability control (VSC), brakes individual wheels to keep the car stable.",facts:["The stability-control tuning was revised in the 2022 update (Toyota global). Its position in the model is approximate."],care:[["Every service","If any warning has appeared, have the stored faults read with a scan tool."],["Brake fluid","Changing the fluid on schedule protects the valves inside."]],signs:["An ABS or VSC warning light that stays on.","A pulsing pedal in normal stops. It should only pulse in emergency stops."],who:"shop",related:["brake_master","brakes_front","ecu"]});fe({id:"wheels_tyres",sys:"chassis",name:"Tyres & 19-inch forged wheels",local:"Ban & velg forged 19 inci",ess:!0,ext:!0,what:"Staggered tyres: 255/35 R19 at the front and wider 275/35 R19 at the rear, on 19-inch forged wheels held on with wheel bolts.",facts:["255/35 R19 front and 275/35 R19 rear (Toyota Astra). Michelin Pilot Super Sport is the usual original tyre on global cars; check which tyres yours has.","Because the front and rear sizes differ, the tyres cannot be swapped front to rear (general practice).","Wheel bolts are tightened to 140 N\xB7m (Toyota document via toyotaspace.com).","Use the tyre pressures on the door-pillar placard. Indonesian retailers list a tyre-pressure monitoring system; confirm that your car has one.","The 2022 update brought new forged wheels that Toyota says are 1.2 kg lighter."],care:[["Monthly","Check pressures cold and look for sidewall bulges. Low-profile tyres are easily damaged by potholes."],["Every service","Check the tread depth on the inner edges too, which wear first when the alignment is out."],["Replace","At the wear bars (1.6 mm) or when the rubber is old. Replace tyres in pairs on the same axle, with the same model."]],signs:["A tyre-pressure warning.","Vibration at speed.","A bulge on a sidewall. Replace the tyre before driving fast."],who:"both",related:["tyre_repair_kit","brakes_front","front_suspension"]});fe({id:"tyre_repair_kit",sys:"chassis",name:"Tyre repair kit (global cars have no spare)",local:"Kit tambal ban",ess:!0,what:"Global-spec cars carry a sealant-and-compressor kit in the boot instead of a spare wheel. It can temporarily fix a small puncture in the tread.",facts:["Global data (Toyota France) lists a repair kit instead of a spare. Whether Indonesian cars have a spare, a kit or run-flat tyres was not verified, so check your boot."],care:[["Every 6 months","Check that the kit is there and the sealant is within its use-by date."],["After use","Drive gently to a tyre shop and tell them sealant was used."]],signs:["The sealant bottle is past its use-by date.","The kit is missing, which is common after buying a used car."],who:"diy",related:["wheels_tyres","tailgate"]});fe({id:"ac_compressor",sys:"ac",name:"AC compressor",local:"Kompresor AC",bay:!0,what:"Driven by the accessory belt, the compressor pumps refrigerant around the AC system.",care:[["Weekly","Run the AC regularly. The oil carried in the refrigerant keeps the seals lubricated."],["Every service","Have it checked for noise and leaks."]],signs:["A noise when the AC is on.","Warm air from the vents."],who:"shop",related:["drive_belt","ac_condenser","ac_lines"]});fe({id:"ac_condenser",sys:"ac",name:"AC condenser",local:"Kondensor AC",bay:!0,what:"A thin radiator at the very front of the car, ahead of the engine radiator. It releases the heat taken out of the cabin.",care:[["Monthly","Rinse it gently through the central intake. Do not use a high-pressure jet, which bends the fins."],["Yearly","Have it cleaned during the AC service."]],signs:["The AC is weak in traffic but fine on the move.","Oily spots on the fins, which mean a refrigerant leak."],who:"both",related:["radiator","front_bumper","ac_lines"]});fe({id:"hvac_unit",sys:"ac",name:"Climate unit: evaporator, heater & blower",local:"Evaporator & blower",what:"Sits behind the dashboard. The blower pushes air through the cold evaporator and the heater core to the vents. Condensed water drains out under the car.",care:[["Yearly","Have the evaporator cleaned. This common Indonesian service removes mould and smells."],["Daily habit","Switch the AC off a minute before you arrive but keep the fan running. This dries the evaporator."]],signs:["A musty smell.","Weak airflow.","Water in the footwell."],who:"shop",related:["cabin_filter","climate_controls","ac_lines"]});fe({id:"cabin_filter",sys:"ac",name:"Cabin microfilter",local:"Filter kabin / filter AC",ess:!0,what:"A pleated filter that cleans the air coming into the cabin.",facts:["The car has a cabin microfilter (Toyota US owner's manual). Its location was not verified. The model shows it next to the blower; ask your dealer or check the manual."],care:[["Every service","Have it inspected, and replace it when it is dirty."]],interval:[["Replace","When dirty, or on the dealer's schedule (no verified interval)"]],signs:["Weak airflow.","A dusty smell.","Windows that fog up easily."],who:"shop",related:["hvac_unit","climate_controls"]});fe({id:"ac_lines",sys:"ac",name:"Refrigerant lines & service ports",local:"Pipa AC (freon)",what:"Aluminium pipes and hoses that link the compressor, the condenser and the evaporator.",facts:["The refrigerant type and amount are on a label in the car. They were not verified here, so make sure the workshop uses the matching type and amount."],care:[["Yearly","Have the pressures checked during the AC service."],["As needed","If the system needs a top-up, ask for a leak test first."]],signs:["Oily dirt at the pipe joints, which means a leak.","The AC gets slowly warmer over several weeks."],who:"shop",related:["ac_compressor","ac_condenser","hvac_unit"]});fe({id:"climate_controls",sys:"ac",name:"Automatic climate control panel & vents",local:"Panel AC otomatis & kisi-kisi",what:"Automatic climate control. You set a temperature, and the system adjusts the fan speed and air direction to hold it.",facts:["Automatic climate control (Toyota Astra)."],care:[["Daily habit","Use recirculation in heavy traffic. Switch to fresh air now and then to stop the windows fogging."],["As needed","Dust the vents with a soft brush."]],signs:["Air comes out of the wrong vents.","The system cannot hold the set temperature."],who:"diy",related:["hvac_unit","cabin_filter"]});fe({id:"battery",sys:"electrical",name:"12 V AGM battery (in the boot)",local:"Aki AGM (di bagasi)",ess:!0,what:"The 12-volt battery sits in the boot under the cargo floor, not under the bonnet. It is an AGM (absorbent glass mat) battery, which is sealed and maintenance-free.",facts:["An AGM battery in the boot, under the cargo floor. Japanese-spec cars use an LN5-size 95 Ah battery; check the label on yours.","For jump-starting, use the jump-start terminal under the bonnet, not the battery itself."],care:[["If parked for long","Drive the car at least weekly, or use a maintainer that is safe for AGM batteries (general practice)."],["Replacement","Replace it only with the correct AGM type, and ask whether the new battery must be registered to the car (general practice)."],["Every service","Have it load-tested."]],signs:["Slow cranking.","Battery or charging warnings.","Electrical glitches after the car has sat unused for weeks."],who:"both",related:["jump_post","alternator","harness","fuse_boxes"]});fe({id:"jump_post",sys:"electrical",name:"Jump-start terminal & earth point (under the bonnet)",local:"Terminal jumper (+) & titik massa",ess:!0,bay:!0,what:"Because the battery is in the boot, there is a positive jump-start post under a red cover in the engine bay, with an earth (ground) point nearby.",facts:["A positive jump-start post under a red cover in the engine bay (global information). Follow the exact steps and order in your owner's manual."],care:[["Know it","Find it before you need it, and keep the red cover in place."],["Jump-starting","Connect the positive lead to the red post and the negative lead to the earth point, in the order the manual shows."]],signs:["Corrosion on the post, or a missing red cover."],who:"diy",related:["battery","harness","starter"]});fe({id:"alternator",sys:"electrical",name:"Alternator",local:"Alternator / dinamo ampere",bay:!0,what:"A belt-driven generator. It recharges the battery and powers the electrics while the engine runs.",care:[["Every service","Have the belt checked. A slipping belt means the battery is undercharged."],["As needed","Have the charging voltage tested if the battery keeps going flat."]],signs:["A charging warning while driving.","Lights that dim at idle.","A whining noise."],who:"shop",related:["battery","drive_belt"]});fe({id:"starter",sys:"electrical",name:"Starter motor",local:"Dinamo starter",what:"An electric motor that turns the engine over when you press the start button. In the model it sits low, where the engine meets the gearbox.",care:[["Starting","If the engine will not start, do not keep pressing the button. Wait, and have the battery checked."]],signs:["A click with no cranking.","A grinding noise when starting."],who:"shop",related:["battery","jump_post"]});fe({id:"fuse_boxes",sys:"electrical",name:"Fuse & relay boxes",local:"Kotak sekring & relay",what:"Fuses protect each circuit from overload. The model shows boxes in the engine bay, behind the dashboard and in the boot; check your owner's manual for the real locations and the fuse diagrams.",care:[["As needed","Replace a blown fuse only with one of the same rating. If it blows again, have the fault found."],["Accessories","Have dash cams and lights wired by a workshop using the correct fuse slot. Do not tap into random circuits."]],signs:["A single item suddenly stops working."],who:"both",related:["battery","harness","ecu"]});fe({id:"ecu",sys:"electrical",name:"Engine computer (ECU) & sensors",local:"ECU (komputer mesin) & sensor",bay:!0,what:"The engine computer reads its sensors (air, boost, temperatures, crankshaft and camshaft position, oxygen) and controls injection, ignition, turbo boost and valve timing. It stores fault codes when something goes wrong.",care:[["As needed","When a warning appears, a dealer scan tool can read the stored codes."],["Tuning","Engine tuning can affect your warranty. Ask your dealer first (general practice)."],["Washing","Do not pressure-wash the engine bay."]],signs:["A check-engine light.","A reduced-power mode."],who:"shop",related:["injectors","ignition","harness"]});fe({id:"harness",sys:"electrical",name:"Wiring harness & main battery cable",local:"Kabel bodi & kabel aki utama",what:"Bundles of wiring run through the whole car. A heavy cable runs from the battery in the boot, forward along the floor, to the engine bay.",care:[["Pests","Rats can chew wiring in parked cars. Keep the engine bay clean and check for droppings."],["Accessories","Have add-ons wired by a workshop."]],signs:["Intermittent faults or warning lights.","A burning smell."],who:"shop",related:["battery","jump_post","fuse_boxes"]});fe({id:"headlamps",sys:"electrical",name:"LED headlamps & daytime running lights",local:"Lampu utama LED & DRL",ess:!0,ext:!0,what:"Slim LED headlamp units on the corners of the nose, with daytime running lights and turn signals.",facts:["LED headlamps (Indonesian retailer data). LED units are usually replaced as a complete assembly rather than bulb by bulb (general practice)."],care:[["Weekly","Check that low beam, high beam, the daytime running lights and the turn signals all work."],["As needed","Protect the lenses from stone chips, and polish off light haze."]],signs:["Part of the lamp is out.","Condensation inside the lens.","A lamp warning message."],who:"both",related:["tail_lamps","front_bumper","fuse_boxes"]});fe({id:"tail_lamps",sys:"electrical",name:"LED tail lamps, brake lights & centre rear lamp",local:"Lampu belakang LED & lampu rem",ext:!0,what:"Slim LED tail and brake lamps sit high on the tail, joined visually by a dark centre strip. A small lamp sits in the middle of the diffuser.",care:[["Weekly","Have someone watch while you brake, reverse and signal, or check the reflection in a wall."]],signs:["A brake light out, which raises the risk of being hit from behind.","A lamp warning message."],who:"diy",related:["headlamps","tailgate","rear_bumper"]});fe({id:"wipers",sys:"electrical",name:"Wipers & washer bottle",local:"Wiper & tabung air wiper",ess:!0,ext:!0,what:"The windscreen wipers park at the base of the screen. The washer bottle sits at the front of the engine bay (shown with a blue cap in the model).",care:[["Monthly","Top up the washer bottle with water and a proper washer fluid. Avoid dish soap, which damages paint and rubber."],["Every 6\u201312 months","Replace the blades, because tropical sun hardens the rubber quickly."]],signs:["Streaking or juddering.","Washer jets that do not spray."],who:"diy",related:["windshield"]});fe({id:"horn",sys:"electrical",name:"Horn",local:"Klakson",what:"An electric horn behind the front bumper, sounded from the steering-wheel pad.",care:[["Monthly","Give it a quick test."]],signs:["A weak sound or no sound, often from a corroded connector after rain or flooding."],who:"diy",related:["front_bumper","steering_wheel"]});fe({id:"instrument_cluster",sys:"electrical",name:"Digital instrument cluster & warning lights",local:"Panel instrumen digital & lampu peringatan",ess:!0,what:"A digital display with a central rev counter and a speed readout. Warning lights and messages, including service reminders, appear here and on the Control Display.",facts:["The car shows condition-based service reminders (Toyota US owner's manual). It tells you when oil, brakes or an inspection are due."],care:[["Every start","Warning lights should go out after starting. Red means stop safely; amber means book a check."],["Monthly","Look at the service display so that you can book in time."]],signs:["Any red warning.","A service-due message."],who:"diy",related:["oil_system","infotainment","battery"]});fe({id:"parking_sensors",sys:"electrical",name:"Parking sensors, camera & blind-spot radar",local:"Sensor parkir, kamera & radar blind spot",ext:!0,what:"Small sensors in the bumpers measure the distance to obstacles. Radar units in the rear corners watch the blind spots and cross traffic when you reverse. Many global-spec cars also have a reversing camera; the model shows a small lens at the rear.",facts:["Indonesian retailers list front and rear parking sensors, a blind-spot monitor, rear cross-traffic alert and cruise control. Confirm which of these your car has."],care:[["Each wash","Keep the sensors clean. Mud or stickers cause false alarms."],["After a knock","After a bumper repair, the sensors and radars must be refitted and checked."]],signs:["Constant beeping, or a sensor warning."],who:"both",related:["front_bumper","rear_bumper","tail_lamps"]});fe({id:"dashboard",sys:"interior",name:"Dashboard & centre console",local:"Dashboard & konsol tengah",what:"The driver-focused dashboard houses the instrument cluster, the central display, the climate unit and the passenger airbag. The centre console carries the gear selector and the rotary controller.",care:[["Daily","Use a sunshade. Jakarta heat cracks and fades the dashboard."],["As needed","Clean it with a damp microfibre cloth. Avoid greasy shine sprays, which glare on the windscreen."]],signs:["Rattles.","A musty smell from the vents."],who:"diy",related:["infotainment","climate_controls","airbags"]});fe({id:"steering_wheel",sys:"interior",name:"Steering wheel, paddle shifters & driver airbag",local:"Setir, paddle shift & airbag pengemudi",what:"A thick-rimmed steering wheel with paddle shifters behind it for manual gear changes. The hub holds the driver airbag and the horn.",care:[["Always","Sit at least about 25 cm
