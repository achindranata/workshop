/* Design language: cinematic dusk-blue product stage, near-black panels, hairline rules,
   squared display type (Garis Display) for headings & numerals, Geist for reading text. */
:root{
  --black:#060708; --panel:#0e1013; --panel2:#14171b; --ink:#eef0f3; --ink2:#c3c8cf; --muted:#8a9099; --faint:#5d636c;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16); --accent:#8fb8ff; --led:#4be38d;
  --warn:#ff8a73; --amber:#e9bd5a; --ok:#69d99a;
  --display:'Garis Display','Geist',system-ui,sans-serif; --font:'Geist','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--black);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:13px;cursor:pointer;color:inherit}
::selection{background:rgba(143,184,255,.35)}
*{scrollbar-width:thin;scrollbar-color:#2a2f36 transparent}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;height:68px;padding:0 26px;background:var(--black);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:22px;min-width:0}
.mk{display:flex;flex-direction:column;line-height:1}
.maker{font-family:var(--display);font-weight:500;font-size:10px;letter-spacing:.52em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.crumbs{display:flex;align-items:center;gap:8px;letter-spacing:inherit}
.crumbs a{color:var(--muted);text-decoration:none;transition:color .15s}
.crumbs a:hover,.crumbs a:focus-visible{color:#fff}
.crumbs i{font-style:normal;color:var(--faint);letter-spacing:0}
.crumbi{color:var(--muted);flex:0 0 auto;margin-inline-end:-2px}
.word{font-family:var(--display);font-weight:300;font-size:23px;letter-spacing:.3em;color:#fff;white-space:nowrap}
.t2{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);letter-spacing:.02em;min-width:0}
.t2 span:first-child{color:var(--ink2)}
.t2 .sep{width:1px;height:14px;background:var(--line2)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;height:100%}
.tabs button{background:transparent;border:0;color:var(--muted);padding:0 14px;height:100%;font-family:var(--display);font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase;position:relative}
.tabs button:hover{color:#fff}
.tabs button.on{color:#fff}
.tabs button.on::after{content:"";position:absolute;inset-inline:14px;bottom:-1px;height:1px;background:#fff}

/* ---------- 3D stage ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 440px;height:calc(100% - 68px)}
.viewport{position:relative;overflow:hidden;background:
  radial-gradient(70% 55% at 50% 60%,rgba(120,160,205,.16) 0%,rgba(0,0,0,0) 70%),
  linear-gradient(180deg,#1f3b58 0%,#17304a 26%,#10213a 52%,#0a1420 76%,#06090d 100%);transition:background .5s}
.viewport.dark{background:radial-gradient(80% 70% at 50% 45%,#13253b 0%,#0b1626 55%,#05080d 100%)}
#c3d{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.toolbar{position:absolute;inset-block-start:16px;inset-inline-start:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:6}
.views{position:absolute;inset-block-start:16px;inset-inline-end:16px;display:flex;flex-direction:column;align-items:stretch;gap:0;z-index:6}
.toolbar button,.views button,.sysbar button{background:rgba(6,9,13,.42);border:1px solid var(--line2);color:#e3e7ec;padding:7px 12px;border-radius:0;font-family:var(--display);font-weight:500;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .15s,color .15s,border-color .15s}
.views button{padding:7px 12px;font-size:10px;margin-top:-1px;text-align:end}
.toolbar button:hover,.views button:hover,.sysbar button:hover{border-color:rgba(255,255,255,.55);color:#fff}
.toolbar button.on,.views button.on{background:#fff;color:#07090c;border-color:#fff}
.seg{display:inline-flex}
.seg button+button{margin-inline-start:-1px}
.sysbar{position:absolute;inset-block-end:38px;inset-inline:16px;display:flex;gap:6px;flex-wrap:wrap;z-index:6}
.sysbar button{display:inline-flex;align-items:center;gap:0;font-size:10px;padding:6px 10px;letter-spacing:.12em}
.sysbar button.on{background:#fff;color:#07090c;border-color:#fff}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-inline-end:8px;vertical-align:1px}
.hint{position:absolute;inset-block-end:12px;inset-inline-start:16px;font-size:11px;color:rgba(255,255,255,.42);letter-spacing:.04em;z-index:6}

/* leader-line callouts */
.leads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}
.leads line{stroke:rgba(255,255,255,.75);stroke-width:1}
#hovDot{fill:#fff}
#selDot{fill:#fff}
#selRing{fill:none;stroke:var(--sc,#fff);stroke-width:1.5}
.tip,.co{position:absolute;inset-block-start:0;inset-inline-start:0;pointer-events:none;z-index:5;white-space:nowrap}
.tip{display:none;padding:2px 0 0 10px;border-inline-start:1px solid rgba(255,255,255,.75);background:rgba(4,7,11,.38)}
.tip b,.co b{display:block;font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.04em;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.65)}
.tip .tsys,.co .csys{display:flex;align-items:center;font-size:10px;font-family:var(--display);font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.7);text-shadow:0 1px 8px rgba(0,0,0,.7);margin-top:3px}
.tip .tsys .dot,.co .csys .dot{width:6px;height:6px;margin-inline-end:7px}
.co{display:none;padding:4px 0 2px 12px;border-inline-start:2px solid var(--sc,#fff);background:linear-gradient(90deg,rgba(4,7,11,.62),rgba(4,7,11,.35) 70%,rgba(4,7,11,0))}
.co b{font-weight:300;font-size:18px}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--black);z-index:20}
.lmark{font-family:var(--display);font-weight:300;font-size:26px;letter-spacing:.42em;color:#fff;padding-inline-start:.42em}
.lbar{width:180px;height:1px;background:var(--line2);overflow:hidden}
.lbar i{display:block;width:40%;height:100%;background:#fff;animation:lb 1.2s ease-in-out infinite}
@keyframes lb{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.ltext{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}

/* ---------- side panel ---------- */
.panel{background:var(--panel);border-inline-start:1px solid var(--line);overflow:hidden;position:relative}
.tabpane{display:none;height:100%;overflow:auto;padding:26px 28px 36px}
.tabpane.on{display:block}
#tab-list{padding:0}
h2{font-family:var(--display);font-weight:300;font-size:30px;line-height:1.14;letter-spacing:.01em;margin:6px 0 10px;color:#fff}
h3{font-family:var(--display);font-weight:500;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px;padding-top:16px;border-top:1px solid var(--line)}
p{margin:8px 0 12px}
b{color:#fff;font-weight:600}
.eyebrow,.sysline{display:flex;align-items:center;font-family:var(--display);font-weight:500;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2)}
.dhead{position:relative;padding-inline-end:40px}
.local{font-size:13px;color:var(--muted)}
.local b{color:var(--ink);font-weight:500}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.badge{font-family:var(--display);font-weight:500;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;padding:5px 9px 4px;border:1px solid var(--line2);color:var(--ink2);border-radius:0}
.badge.ess{border-color:rgba(233,189,90,.55);color:var(--amber)}
.badge.who-diy{border-color:rgba(105,217,154,.5);color:var(--ok)}
.badge.who-shop{border-color:rgba(255,138,115,.5);color:var(--warn)}
.badge.who-both{border-color:rgba(143,184,255,.5);color:var(--accent)}
.xbtn{position:absolute;inset-block-start:0;inset-inline-end:0;border:1px solid var(--line2);background:transparent;width:30px;height:30px;border-radius:0;color:var(--ink2);font-size:12px}
.xbtn:hover{border-color:#fff;color:#fff}
.what{font-size:15px;line-height:1.6;color:var(--ink2);margin-top:18px}
ul{margin:4px 0 8px;padding:0;list-style:none}
li{margin:0;padding:6px 0 6px 18px;position:relative;color:var(--ink2)}
li::before{content:"";position:absolute;inset-inline-start:0;top:14px;width:6px;height:1px;background:var(--ink2)}
ul.facts li::before{background:var(--accent);width:8px}
ul.warn li::before{background:var(--warn);width:8px}
ul.how li::before{background:#fff}
table{border-collapse:collapse;width:100%}
.care th{width:32%;text-align:start;vertical-align:top;font-family:var(--display);font-weight:500;font-size:12.5px;letter-spacing:.02em;color:#fff;padding:11px 14px 11px 0;border-bottom:1px solid var(--line)}
.care td{padding:11px 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink2)}
.care tr:first-child th,.care tr:first-child td{border-top:1px solid var(--line)}
.intervals{display:grid;grid-template-columns:1fr;gap:0}
.iv{display:flex;flex-direction:column;gap:4px;padding:10px 0 10px 16px;border-inline-start:1px solid var(--line2);margin-bottom:8px}
.iv span{font-size:10px;font-family:var(--display);font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.2em}
.iv b{font-family:var(--display);font-weight:300;font-size:19px;line-height:1.25;color:#fff;letter-spacing:.01em}
.rel,.ess-grid{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:transparent;border:1px solid var(--line2);border-radius:0;padding:6px 11px;font-size:12.5px;text-align:start;display:inline-flex;align-items:center;color:var(--ink)}
.chip:hover{border-color:#fff;background:rgba(255,255,255,.05)}
.chip .dot{width:6px;height:6px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:22px 0 4px;border-top:1px solid var(--line)}
.stat{padding:14px 0 14px 16px;border-bottom:1px solid var(--line)}
.stat:nth-child(odd){padding-inline-start:0;border-inline-end:1px solid var(--line)}
.stat:nth-child(even){padding-inline-start:18px}
.stat span{display:block;font-family:var(--display);font-weight:500;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font-family:var(--display);font-weight:300;font-size:34px;line-height:1.1;margin-top:6px;color:#fff;letter-spacing:.01em}
.stat b small{font-size:15px;font-weight:500;margin-inline-start:4px;color:var(--ink2);letter-spacing:.06em}
.intro .lede{font-size:15px;color:var(--ink2)}
.specs th{text-align:start;width:30%;font-family:var(--display);font-weight:500;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.specs td{padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink)}
.note{font-size:12px;color:var(--faint);margin-top:18px;line-height:1.55}
.searchrow{position:sticky;top:0;background:var(--panel);padding:18px 22px;border-bottom:1px solid var(--line);z-index:2}
#search{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:0;font:inherit;background:transparent;color:#fff;outline:none}
#search::placeholder{color:var(--faint)}
#search:focus{border-color:rgba(255,255,255,.6)}
.lgroup{border-bottom:1px solid var(--line)}
.lhead{display:flex;align-items:center;padding:18px 22px 8px;font-family:var(--display);font-weight:500;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2)}
.lhead .cnt{margin-inline-start:auto;color:var(--faint);letter-spacing:.1em}
.litem{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:start;background:transparent;border:0;padding:9px 22px 9px 37px;position:relative}
.litem:hover{background:rgba(255,255,255,.035)}
.litem.on{background:rgba(255,255,255,.06)}
.litem.on::before{content:"";position:absolute;inset-inline-start:22px;top:12px;bottom:12px;width:2px;background:#fff}
.lname{font-size:14px;color:var(--ink)}
.lloc{font-size:12px;color:var(--muted)}
.star{color:var(--amber);font-style:normal;font-size:11px}
.empty{padding:22px;color:var(--muted)}
.lead{color:var(--ink2)}
.sched{font-size:13px}
.sched th{text-align:start;padding:10px 12px 10px 0;font-family:var(--display);font-weight:500;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line2)}
.sched td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink2)}
.sched td:first-child{width:30%}
.sched td:first-child b{font-family:var(--display);font-weight:500;font-size:13px;color:#fff;letter-spacing:.02em}
.src{display:block;font-size:11px;color:var(--faint);margin-top:4px}
.checks li{padding:7px 0 7px 18px}
.callout{margin-top:22px;border-inline-start:2px solid var(--warn);background:rgba(255,138,115,.07);padding:14px 16px;color:var(--ink2)}
.callout b{color:#fff}
@media (max-width: 980px){
  .top{flex-direction:column;align-items:flex-start;justify-content:center;height:auto;padding:14px 16px 0;gap:10px}
  .brand{flex-direction:column;align-items:flex-start;gap:8px}
  .word{font-size:20px}
  .t2{flex-wrap:wrap;gap:6px 10px}
  .tabs{height:auto;width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .tabs button{height:42px;white-space:nowrap}
  .layout{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}
  .panel{border-inline-start:0;border-top:1px solid var(--line)}
  .tabpane{height:auto;max-height:none;padding:22px 18px 30px}
  .toolbar,.views,.sysbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;inset-inline:10px;max-width:none;justify-content:flex-start}
  .toolbar::-webkit-scrollbar,.views::-webkit-scrollbar,.sysbar::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
  .toolbar button,.views button,.sysbar button{white-space:nowrap;flex:0 0 auto}
  .toolbar{inset-block-start:10px}
  .views{inset-block-start:50px;flex-direction:row}
  .views button{margin-top:0;margin-inline-start:-1px}
  .sysbar{inset-block-end:28px}
  .hint{font-size:10px;inset-block-end:8px;inset-inline-start:10px}
  h2{font-size:26px}
}

 exterior",color:"#6b7c93"},engine:{name:"Engine",color:"#e5533d"},fuel:{name:"Fuel, air & exhaust",color:"#f08c1a"},cooling:{name:"Cooling",color:"#21b0b8"},drivetrain:{name:"Transmission & drivetrain",color:"#8e6bd8"},chassis:{name:"Chassis, suspension & brakes",color:"#4fa365"},ac:{name:"Air-conditioning",color:"#3aa0f2"},electrical:{name:"Electrical & lighting",color:"#f2cc1d"},interior:{name:"Interior & safety",color:"#d0619d"}},cf=[["2023 diesel line-up","4x2 2.4 G M/T \xB7 4x2 2.4 G A/T \xB7 4x2 2.8 VRZ A/T \xB7 4x2 2.8 GR Sport A/T \xB7 4x4 2.8 GR Sport A/T (the only 4x4 in 2023)"],["Engine (2.8)","1GD-FTV, 2,755 cc, 4-cylinder 16-valve DOHC common-rail turbo-diesel, variable-nozzle turbo + intercooler"],["Power & torque (2.8)","203.9 PS @ 3,000\u20134,000 rpm \xB7 500 Nm @ 1,600\u20132,800 rpm (automatic only)"],["Engine (2.4 G)","2GD-FTV, 2,393 cc, same layout \xB7 149.6 PS @ 3,400 rpm \xB7 400 Nm @ 1,600\u20132,000 rpm"],["Gearbox","6-speed automatic with Sequential Shiftmatic; 6-speed manual on the 2.4 G M/T only"],["Drive","4x2: rear-wheel drive. 4x4 GR Sport: Easy 4x4 dial (2H / 4H / 4L), rear differential lock, Downhill Assist Control"],["Chassis","Ladder frame; double wishbone front, 4-link rear with lateral rod; ventilated discs front and rear; ABS + EBD + BA"],["Tyres","265/60 R18 (2.8 VRZ and GR Sport; black alloys on GR Sport) \xB7 265/65 R17 (2.4 G)"],["Size","Length 4,795 \xB7 width 1,855 \xB7 height 1,835 \xB7 wheelbase 2,745 mm"],["Fuel","80-litre tank; diesel with \u2264 50 ppm sulphur and cetane \u2265 48"],["Emissions","Euro 4"],["Airbags","7 on the 4x4 GR Sport; driver + passenger on the 2.4 G"],["Seats","7 seats in three rows"]],hf=["oil_system","fuel_filter","coolant_tank","battery","wheels_tyres","brakes_front","brake_master","air_filter","cabin_filter","wipers","instrument_cluster","drive_belt","gear_lever","tail_lamps"],uf=[["First check","1,000 km","Free first check at an authorised Toyota workshop.","Toyota Indonesia practice"],["Periodic service","Every 10,000 km","Toyota Indonesia also schedules by time \u2014 usually 6 months \u2014 so check your service booklet. Auto2000 gives free labour for periodic services up to 50,000 km or the first 4 years; parts and fluids are paid.","Auto2000 \xB7 Toyota Indonesia practice"],["Engine oil + oil filter","At every 10,000 km periodic service; sooner under severe use","About 7.1\u20137.5 L with the filter, depending on engine. Sources differ: the Indonesian manual lists 7.5 L (2.4 2GD) and 7.1 L (2.8 1GD); Auto2000 quotes 7.3 L. Your workshop uses the exact figure. Grade: diesel oil API CF-4/CF, ACEA B3/B4/B5 or JASO DL-0, SAE 5W-30 preferred.","Indonesian owner's manual (via mekaniku.id) \xB7 Thai owner's manual (2024) \xB7 Auto2000"],["Water sedimenter (fuel filter)","Drain when the fuel-filter warning light comes on; have it checked at each service","Interval and procedure not confirmed for this model. Follow your owner's manual.","General practice"],["Fuel filter element","Per your service booklet (not confirmed here)","Replace sooner if you have had water in the fuel or poor-quality diesel.","General practice"],["Air filter","Inspect or clean at each service; replace when dirty","More often on dusty roads.","General practice"],["Cabin (AC) filter","Clean at each service; replace when dark or clogged","Usually behind the glovebox; check your manual.","General practice"],["Brake fluid","Replace every 40,000 km or 24 months","DOT 3 or DOT 4.","Thai owner's manual (2024)"],["Automatic transmission fluid","Inspect every 40,000 km or 24 months","Toyota ATF WS, about 9.5 L. No routine replacement in the normal schedule. Never top up with another ATF type.","Thai owner's manual (2024)"],["Manual gearbox oil (2.4 G M/T)","Inspect every 40,000 km or 48 months","GL-3 (GL-4) 75W-90, about 2.7 L.","Thai owner's manual (2024)"],["Transfer case oil (4x4)","Inspect every 40,000 km or 48 months","LF 75W, about 1.0 L.","Thai owner's manual (2024)"],["Front differential oil (4x4)","Replace at 40,000 km and 80,000 km, or every 48 months","Hypoid gear oil LT 75W-85 GL-5, about 1.6 L.","Thai owner's manual (2024)"],["Rear differential oil","Replace at 40,000 km and 80,000 km, or every 48 months","Hypoid gear oil LT 75W-85 GL-5, about 3.5 L.","Thai owner's manual (2024)"],["Coolant (Toyota Super Long Life Coolant)","Not confirmed for this model","Pink, pre-mixed; total about 7.9\u20139.9 L depending on specification. General Toyota SLLC guidance is a first change at 160,000 km, then every 80,000 km. Confirm in your booklet.","General practice (Toyota SLLC)"],["Power-steering fluid","Check the level monthly; inspect at services","ATF DEXRON II or III.","Thai owner's manual (2024)"],["Timing chain","No scheduled replacement","The 2.8 1GD uses a chain. Chain life depends on clean oil changed on time.","Toyota Australia spec \xB7 General practice"],["Drive belt, glow plugs, injectors, EGR","Inspect at services; no fixed interval confirmed","Replace or clean only when an inspection or fault code shows it is needed.","General practice"],["Tyres","Check pressures monthly; rotate at services","Use the pressures on the driver's door-pillar placard.","General practice"],["AC service","About once a year","Clean the evaporator and condenser, and check both front and rear units.","General practice"]],df=[["Every week or before a long trip",["Check the engine oil on the dipstick with the engine cold and the car on level ground. Keep it between L and F.","Check that the coolant reservoir is between LOW and FULL. Only open the reservoir or radiator cap when the engine is cold.","Check that the brake fluid reservoir is near MAX. A falling level means worn pads or a leak.","Check tyre pressures with the tyres cold, using the placard on the driver's door pillar. Look for cuts and bulges.","Walk around the car with the lights on: headlamps, DRL, fog lamps, brake lights including the high-mount stop lamp, turn signals and reverse lights.","Look under the car for drips: engine oil (brown or black), coolant (pink), brake fluid (yellowish), ATF or power-steering fluid (red), AC water (clear, normal)."]],["Every month",["Check the spare tyre pressure. It is usually slung under the rear floor; check your owner's manual for how to lower it.","Check the battery terminals for white or green corrosion and make sure the clamps are tight.","Check the wiper blades for streaking and refill the washer fluid.","Test the AC on max: cold air from both front zones and from the rear roof vents, with no musty smell.","Open and close the power back door (GR Sport and VRZ). Keep the area under the rear bumper free of mud so the kick sensor works.","On the 4x4, drive a short distance in 4H on a loose or wet surface to keep the 4WD parts working (general practice)."]],["Every time you start or drive",["Press the brake pedal and the start button (GR Sport). If the glow-plug indicator lights on a cold start, let it go out; follow your owner's manual.","All warning lamps should go out after starting. Red means stop safely; amber means book a check.","If the fuel-filter or water warning light comes on, have the water sedimenter drained soon.","After hard or high-speed driving, idle for 30\u201360 seconds before switching off. This protects the turbo bearings (general practice).","Use diesel with \u2264 50 ppm sulphur and cetane \u2265 48, such as Pertamina Dex or Shell V-Power Diesel. Dexlite meets the cetane figure, but check its sulphur level before relying on it.","4x4: use 4H or 4L only on loose or slippery surfaces, not on dry tarmac, and follow the manual when shifting into or out of 4L."]]],ff=[],pe=n=>ff.push(n);pe({id:"hood",sys:"body",name:"Bonnet (hood)",local:"Kap mesin",ext:!0,what:"The long, high steel panel over the engine bay. It hinges at the windscreen end and is held open by a prop rod.",facts:["Pull the bonnet release inside the cabin, then free the safety catch at the front edge. Your owner's manual shows where both are."],care:[["Each wash","Wash and wax the bonnet. It takes the most sun, bird droppings and stone chips."],["Every 6 months","Clean and lightly grease the latch and safety catch so the bonnet opens and locks reliably."],["As needed","Touch up stone chips early to stop rust."]],signs:["The bonnet will not latch, or a door or bonnet warning shows on the dashboard.","Paint bubbling along the front edge, which is a sign of rust."],who:"both",related:["front_bumper","grille","fenders"]});pe({id:"front_bumper",sys:"body",name:"Front bumper & fog-lamp pods",local:"Bumper depan",ext:!0,what:"A plastic bumper cover over a steel beam. It carries the fog lamps in the corner pods, the number plate and a silver lower garnish.",facts:["Bumper and grille styling differs between the GR Sport, VRZ and G types.","Off-road or over tall speed bumps, approach slowly and at an angle so the lower lip does not scrape."],care:[["Each wash","Rinse mud and insects out of the openings so air reaches the AC condenser and radiator."],["As needed","Check the clips and screws under the bumper. A sagging lower edge can catch on kerbs."]],signs:["Cracks or loose clips after a knock. Have the hidden mounts, fog lamps and front camera checked."],who:"both",related:["grille","fog_lamps","ac_condenser","cameras"]});pe({id:"grille",sys:"body",name:"Radiator grille",local:"Gril depan",ext:!0,what:"The large trapezoid opening between the headlamps. It lets cooling air through to the AC condenser, the radiator and the intercooler's air supply, and protects them from stones.",facts:["The GR Sport grille has a dark mesh finish.","On the GR Sport, the front camera of the panoramic view monitor sits low on the grille. Its position in the model is approximate."],care:[["Each wash","Brush or rinse out leaves and plastic bags. A blocked grille raises engine temperature and weakens the AC."]],signs:["The AC cools poorly in traffic, or the temperature gauge rises. Check for debris behind the grille."],who:"diy",related:["ac_condenser","radiator","intercooler","front_bumper"]});pe({id:"fenders",sys:"body",name:"Front fenders, arch cladding & liners",local:"Spakbor depan & cladding",ext:!0,what:"The body panels around the front wheels. The black wheel-arch cladding protects the paint from stones, and plastic liners inside the arches keep water and grit out of the engine bay.",care:[["Monthly","Hose mud out of the wheel arches, especially after floods or off-road trips. Trapped mud holds water and causes rust."],["As needed","Refit loose liner or cladding clips so nothing rubs on the tyre."]],signs:["Bubbling paint at the arch edge.","A rubbing noise on full steering lock, which usually means a loose liner."],who:"diy",related:["wheels_tyres","front_suspension","quarter_panels"]});pe({id:"front_doors",sys:"body",name:"Front doors (hinges, locks, power windows)",local:"Pintu depan",ext:!0,what:"The doors contain the window motor, the central-locking actuator, speakers and a side-impact beam. The black window trim and seals keep water out.",care:[["Every 6 months","Spray the hinges, the check strap and the lock latch with a light lubricant."],["Monthly","Wipe the rubber seals and treat them with silicone protectant so they do not stick or crack."],["As needed","Clear the drain holes along the bottom edge of the door."]],signs:["A slow or noisy power window.","Water on the floor mat.","The door needs slamming to close."],who:"both",related:["side_windows","mirrors","rear_doors"]});pe({id:"rear_doors",sys:"body",name:"Rear doors",local:"Pintu tengah",ext:!0,what:"The second-row doors. They work like the front doors, with child-safety locks on the door edge.",care:[["Every 6 months","Lubricate the hinges and latch, and check the child lock works."],["As needed","Clean the door drain holes and the rubber seals."]],signs:["Wind noise or water leaks.","The child lock or central lock does not engage."],who:"both",related:["front_doors","side_windows"]});pe({id:"quarter_panels",sys:"body",name:"Rear quarter panels & fuel lid",local:"Panel samping belakang & tutup tangki",ext:!0,what:`The fixed side panels over the rear wheels, beside the third row. The Fortuner's signature rising "kink" in the window line is here, and one side carries the fuel-filler lid.`,facts:["Check which side your fuel lid is on before pulling up at the pump. The model shows it on the left, above the rear wheel; treat that position as approximate."],care:[["Monthly","Wash the rear arches and the lower edge, where mud collects."],["As needed","Keep the fuel-lid hinge clean, and close the filler cap until it clicks."]],signs:["Water inside behind the third-row trim, which can point to a blocked drain or seal."],who:"diy",related:["fuel_tank","side_windows","ac_rear_unit"]});pe({id:"back_door",sys:"body",name:"Back door (tailgate) & roof spoiler",local:"Pintu bagasi / back door",ext:!0,what:"The top-hinged tailgate. It carries the rear window, the rear wiper, the number plate, the rear camera and the roof spoiler with the high-mount stop lamp.",facts:['The GR Sport and VRZ have a power back door with a kick sensor under the bumper. See "Power back door & kick sensor".'],care:[["Monthly","Check that the door opens and closes smoothly and stays up."],["Every 6 months","Lubricate the latch and hinges."],["As needed","Keep the seal clean so dust and exhaust fumes cannot enter."]],signs:["The door drifts down or will not latch.","Dust or an exhaust smell in the cargo area."],who:"both",related:["power_back_door","back_glass","tail_lamps","rear_bumper"]});pe({id:"rear_bumper",sys:"body",name:"Rear bumper",local:"Bumper belakang",ext:!0,what:"A plastic bumper cover over the rear beam, with reflectors and a silver lower garnish. On the GR Sport and VRZ, the kick sensor for the power back door sits underneath.",care:[["Each wash","Rinse mud from the lower edge and around the exhaust tip. Heavy mud can stop the kick sensor working."]],signs:["Cracks after a bump. Check that the tail lamps, back door and kick sensor still work."],who:"diy",related:["back_door","power_back_door","exhaust","spare_tyre"]});pe({id:"roof",sys:"body",name:"Roof, roof rails & antenna",local:"Atap & roof rail",ext:!0,what:"The roof panel with roof rails and the radio antenna. Inside, the headliner carries the rear AC duct, its vents and the curtain airbags.",facts:["Check the roof-load limit in your owner's manual before fitting a roof rack."],care:[["Each wash","Wash the roof too. Indonesian sun quickly fades unwaxed paint on horizontal panels."],["As needed","Fasten loads to the rail feet, not the middle of the rail."]],signs:["Faded, chalky paint.","Water stains on the headliner."],who:"diy",related:["ac_rear_unit","airbags","body_shell"]});pe({id:"windshield",sys:"body",name:"Windscreen",local:"Kaca depan",ext:!0,what:"Laminated safety glass bonded to the body. It is a structural part of the cabin and supports the passenger airbag when it deploys.",care:[["Weekly","Clean inside and out. Haze on the inside reduces night visibility."],["As needed","Get small stone chips resin-repaired before they spread into cracks."],["As needed","Replace the wiper blades when they streak, so grit is not dragged across the glass."]],signs:["Chips in the driver's line of sight.","Cracks spreading from the edge.","Leaks at the top corners."],who:"shop",related:["wipers","body_shell"]});pe({id:"side_windows",sys:"body",name:"Side windows & rear quarter glass",local:"Kaca samping",ext:!0,what:"Tempered glass in the front and rear doors, which go up and down, plus the fixed quarter glass beside the third row with its kinked lower edge.",care:[["Monthly","Clean the window channels and rubber. Dirt makes the power-window motors work harder."],["As needed","Use window film that meets the legal limit, and do not scratch the glass when fitting it."]],signs:["A window that stalls or tilts.","Whistling at speed."],who:"both",related:["front_doors","rear_doors","quarter_panels"]});pe({id:"back_glass",sys:"body",name:"Rear window & defogger",local:"Kaca belakang & defogger",ext:!0,what:"Tempered glass in the back door. It has printed heater lines that clear mist (the defogger) and its own wiper.",care:[["As needed","Clean the inside along the heater lines with a soft cloth. Do not scrape, or the lines break."]],signs:["Part of the glass will not demist, which means a broken heater line."],who:"diy",related:["back_door","wipers"]});pe({id:"mirrors",sys:"body",name:"Door mirrors",local:"Spion",ext:!0,what:"Electrically adjustable side mirrors with turn-signal repeaters. Folding and other mirror features vary by type.",facts:["On the GR Sport, the side cameras of the panoramic view monitor sit under the mirrors. Their position in the model is approximate."],care:[["As needed","Fold them in tight parking spots. Clean the glass and the camera lens with a soft cloth."],["As needed","If a mirror is knocked, check that the repeater lamp and camera still work."]],signs:["A mirror that vibrates or will not adjust.","A repeater lamp that is out."],who:"diy",related:["front_doors","cameras"]});pe({id:"body_shell",sys:"body",name:"Body shell: pillars, sills & floor",local:"Bodi, pilar, sill & lantai",ext:!0,what:"The steel cabin sits on a separate ladder frame (body-on-frame). Its pillars, side sills and floor pan form the passenger safety cell, and the underside is coated against corrosion.",care:[["Every 6 months","Rinse the underbody, especially after floods, beach trips or off-road driving. Check the sills and floor for rust or damaged coating."],["As needed","Keep carpets dry. Wet carpets rust the floor from the inside."]],signs:["Rust on the sills or floor seams.","Doors that no longer line up, which can mean body or frame damage."],who:"both",related:["frame","roof","side_steps"]});pe({id:"side_steps",sys:"body",name:"Side steps",local:"Side step / injakan samping",ext:!0,what:"The steps along each side between the wheels. They help passengers climb into this tall SUV.",care:[["Each wash","Rinse mud and sand from the steps and their brackets."],["After off-road","Check the brackets are tight and not bent."],["Never","Do not use the steps as a jacking point."]],signs:["A step that rattles, sags or moves when you stand on it.","A worn or loose rubber pad."],who:"diy",related:["body_shell","frame"]});pe({id:"engine_block",sys:"engine",name:"1GD-FTV 2.8 engine (block, pistons, crankshaft)",local:"Blok mesin 1GD / 2GD",bay:!0,what:"A 2.8-litre, 4-cylinder common-rail turbo-diesel from Toyota's GD family. Diesel burns by compression, not a spark: air is squeezed until it is hot enough to ignite the injected fuel. Inside the block, pistons drive the crankshaft.",facts:["1GD-FTV (2.8): 2,755 cc, bore \xD7 stroke 92.0 \xD7 103.6 mm, 16-valve DOHC, 203.9 PS @ 3,000\u20134,000 rpm, 500 Nm @ 1,600\u20132,800 rpm. Automatic only (Toyota Astra).","2GD-FTV (2.4 G): 2,393 cc, 92.0 \xD7 90.0 mm, 16-valve DOHC, 149.6 PS @ 3,400 rpm, 400 Nm @ 1,600\u20132,000 rpm, manual or automatic (Toyota Astra).","The 2.8 joined the Indonesian Fortuner on 13 January 2022. Indonesian diesels meet Euro 4 from April 2022."],care:[["Every service","Clean oil of the right grade, changed on time, is what makes a GD engine last."],["Daily","Drive gently until the temperature gauge reaches its normal position."],["As needed","Have oil leaks fixed early."]],signs:["Excess black smoke, knocking or loss of power.","Oil use that keeps rising.","White smoke with a sweet smell, which means coolant is being burned."],who:"shop",related:["cylinder_head","oil_system","timing_chain","turbo"]});pe({id:"cylinder_head",sys:"engine",name:"16-valve DOHC cylinder head & cam cover",local:"Kepala silinder & tutup klep",bay:!0,what:"The head carries 16 valves, two overhead camshafts, the injectors and the glow plugs. The cam (valve) cover on top seals in the oil.",care:[["Booklet interval","Follow your service booklet for any valve inspection."],["As needed","Have the cam-cover gasket replaced if oil seeps down the side of the engine."]],signs:["A ticking noise at idle.","Oil wetness around the top cover."],who:"shop",related:["engine_block","injectors","glow_plugs"]});pe({id:"timing_chain",sys:"engine",name:"Timing chain (behind front cover)",local:"Rantai keteng / timing chain",bay:!0,what:"A steel chain behind the aluminium front cover. It keeps the crankshaft, camshafts and high-pressure fuel pump in exact step, and runs in engine oil.",facts:["The 2.8 1GD-FTV uses a timing chain (Toyota Australia specification). GD-series engines are chain-driven, but confirm for the 2.4 2GD with your workshop.","A chain normally has no fixed replacement interval; its life depends on clean oil changed on time (general practice)."],care:[["Every service","Change the oil on time. Old, sludgy oil is the main cause of chain and tensioner wear."]],signs:["A rattle from the front of the engine for a few seconds after a cold start.","The check-engine light with rough running."],who:"shop",related:["oil_system","engine_block","drive_belt"]});pe({id:"drive_belt",sys:"engine",name:"Drive belt (V-ribbed) & pulleys",local:"Fan belt / V-belt",ess:!0,bay:!0,what:"The ribbed belt at the front of the engine. The crankshaft uses it to drive the alternator, the AC compressor and the water-pump/fan pulley.",facts:["No Fortuner-specific inspection interval was confirmed. Have it checked at each periodic service (general practice)."],care:[["Monthly","With the engine off, look for cracks, glazing or missing ribs."],["When worn","Replace it before it snaps; a broken belt stops charging and the AC at once."]],signs:["A squeal on start-up or when the AC switches on.","The battery-charge light comes on.","The AC suddenly blows warm."],who:"both",related:["alternator","ac_compressor","hoses","timing_chain"]});pe({id:"oil_system",sys:"engine",name:"Engine oil: filler cap & dipstick",local:"Oli mesin, tutup oli & stik oli",ess:!0,bay:!0,what:"Oil lubricates, cools and cleans the engine and the turbo. Diesel oil turns black quickly because it carries soot. Top up through the filler cap on the cam cover and check the level with the dipstick.",facts:["Capacity with filter is about 7.1\u20137.5 L, depending on engine. The Indonesian owner's manual (Apr 2022\u2013Aug 2024 edition, via mekaniku.id) lists 7.5 L for the 2.4 2GD and 7.1 L for the 2.8 1GD; Auto2000 quotes 7.3 L. Your workshop uses the exact figure.","Toyota's 2024 Thai owner's manual, for engines that are not Euro V/VI, lists API CF-4 or CF, ACEA B3/B4/B5 or JASO DL-0, with SAE 5W-30 preferred. Low-ash grades (JASO DL-1, ACEA C2/C5) are required only for Euro V/VI engines. Indonesian cars are Euro 4, so ask your dealer which grade they use."],care:[["Weekly","With the engine cold and the car level: pull the dipstick, wipe it, push it fully in, then read. Keep the level between L and F and top up a little at a time."],["Every 10,000 km service","Change the oil and filter. In heavy stop-go traffic, dusty conditions, towing or off-road use, change it sooner."]],interval:[["Replace","At every 10,000 km periodic service (sooner under severe use)"]],signs:["The red oil-can warning light: stop the engine immediately.","The level drops fast, or there is blue smoke.","Milky or creamy oil, which means coolant is getting in."],who:"both",related:["oil_filter","oil_pan","turbo","timing_chain"]});pe({id:"oil_filter",sys:"engine",name:"Oil filter",local:"Filter oli",what:"Traps metal particles and soot from the oil before it reaches the bearings, the timing chain and the turbo.",facts:["Its position in the model is approximate. Your workshop replaces it at each oil change."],care:[["Every oil change","Replace it with a genuine or equal-quality filter."]],interval:[["Replace","With every oil change"]],signs:["An oil leak at the filter right after a service."],who:"shop",related:["oil_system","oil_pan"]});pe({id:"oil_pan",sys:"engine",name:"Oil pan (sump) & drain plug",local:"Carter / bak oli",what:"The oil reservoir under the engine. Old oil is drained through the plug at the bottom.",care:[["Every oil change","Ask for a new drain-plug washer and make sure the plug is tightened correctly."],["Off-road","Pick your line over rocks and ruts. A hard hit can dent or crack the sump."]],signs:["Fresh oil spots under the front of the car.","The oil warning light after the underside hits something."],who:"shop",related:["oil_system","engine_block"]});pe({id:"turbo",sys:"engine",name:"Variable-nozzle turbocharger",local:"Turbo VNT",bay:!0,what:'An exhaust-driven fan that pumps extra air into the engine. Movable vanes (the "variable nozzle") change how the exhaust hits the turbine, so boost builds at low rpm without choking at high rpm. It spins very fast and depends on clean oil.',facts:["Both the 2.4 and 2.8 use a variable-nozzle turbo with an intercooler (Toyota Astra).","Toyota Astra press material says the turbo compressor housing is water-cooled on these engines."],care:[["After hard driving","Idle for 30\u201360 seconds before switching off (general practice)."],["Every service","Change the oil on time and keep the air filter clean. Dust destroys turbo blades."]],signs:["A whistling or siren noise.","Blue or black smoke.","Sudden loss of power or limp mode.","Oil inside the intake or intercooler hoses."],who:"shop",related:["intercooler","air_filter","intake","exhaust"]});pe({id:"glow_plugs",sys:"engine",name:"Glow plugs",local:"Busi pijar (glow plug)",bay:!0,what:"Small electric heaters, one per cylinder, that warm the combustion chambers for easier cold starts. A coil-shaped dashboard light shows when they are working.",facts:["No replacement interval was confirmed. They are tested when cold starts get harder (general practice)."],care:[["Cold starts","If the glow-plug indicator lights up, let it go out before the engine cranks."],["As needed","If cold starts get hard or the engine runs rough at first, have the glow plugs tested."]],signs:["Long cranking in the morning.","White smoke and rough running for the first minute."],who:"shop",related:["battery","cylinder_head"]});pe({id:"injectors",sys:"fuel",name:"Common-rail fuel system (supply pump, rail, injectors)",local:"Pompa injeksi, common rail & injektor",bay:!0,what:"A high-pressure supply pump fills the common rail. The engine computer then opens each injector precisely to spray atomised diesel into the cylinders.",facts:["Toyota Astra press material quotes rail pressure of up to 250 MPa (about 2,500 bar). Tolerances are tiny, so fuel quality matters.","The owner's manual requires diesel with \u2264 50 ppm sulphur and cetane \u2265 48 (quoted by detik)."],care:[["Every fill-up","Use Dex-class diesel from reputable stations."],["On time","Changing the fuel filter and draining water are the best protection for the injectors."],["As needed","Have the injectors tested by a diesel specialist only if smoke or idle gets worse (general practice)."]],signs:["Rough idle or knocking.","Heavy black smoke.","Hard starting.","The check-engine light."],who:"shop",related:["fuel_filter","fuel_tank","ecu"]});pe({id:"fuel_filter",sys:"fuel",name:"Fuel filter & water sedimenter",local:"Filter solar & water sedimenter",ess:!0,bay:!0,what:"Cleans the diesel and separates out water before it reaches the high-pressure pump. Water in diesel ruins common-rail injectors. It has a hand priming pump on top and a drain at the bottom.",facts:["The replacement interval and the draining procedure were not confirmed for this model. Follow your service booklet and owner's manual.","On Toyota diesels a warning light comes on when water must be drained (general practice). Its position in the model is approximate."],care:[["Warning light","Have the water sedimenter drained soon when the fuel-filter or water light comes on."],["Every service","Ask the workshop to check the filter and sedimenter."]],interval:[["Drain water","When the warning light comes on (general practice)"],["Replace element","Per your service booklet (not confirmed here)"]],signs:["The fuel-filter or water warning light.","Loss of power, surging or hard starting."],who:"both",related:["injectors","fuel_tank"]});pe({id:"fuel_tank",sys:"fuel",name:"Fuel tank (80 L), filler & lines",local:"Tangki solar",what:"An 80-litre tank under the floor, filled through the lid on a rear quarter panel. Fuel lines run along the frame to the engine bay.",facts:["Tank capacity: 80 litres (Toyota Astra).","Pertamina Dex and Shell V-Power Diesel meet the manual's \u2264 50 ppm sulphur and cetane \u2265 48 requirement. Dexlite meets the cetane figure (51), but check its sulphur level before relying on it."],care:[["Every fill-up","Close the cap until it clicks. Do not overfill past the first auto-stop."],["As needed","Try not to run the tank nearly empty. That draws sediment and air into the system."],["Never","Do not fill with petrol. If it happens, do not start the engine; have the tank drained."]],signs:["A diesel smell around the car.","Wet patches along the fuel lines."],who:"both",related:["fuel_filter","quarter_panels"]});pe({id:"air_filter",sys:"fuel",name:"Air cleaner box & air filter",local:"Filter udara",ess:!0,bay:!0,what:"A paper filter in the black box in the engine bay. It cleans the air the engine and turbo breathe.",facts:["No Fortuner-specific replacement interval was confirmed. Have it inspected at each service and replaced when dirty, more often on dusty roads (general practice)."],care:[["Every service","Have the element inspected and blown out from the inside with low-pressure air."],["Dusty use","Replace it sooner if it is dark and clogged."],["Never","Do not wash a paper element, and never drive without one."]],interval:[["Inspect","Every periodic service"],["Replace","When dirty (general practice)"]],signs:["Sluggish acceleration.","Black smoke.","Higher fuel use."],who:"diy",related:["turbo","intake"]});pe({id:"intake",sys:"fuel",name:"Intake ducts & intake manifold",local:"Saluran udara & intake manifold",bay:!0,what:"Ducts carry filtered air to the turbo. After the intercooler, the intake manifold shares the cooled air between the four cylinders.",care:[["Every service","Have the hose clamps checked. A loose boost hose causes a big loss of power."],["As needed","A little oil mist inside the ducts is normal; pools of oil are not."]],signs:["A hissing or whooshing sound under acceleration.","Black smoke.","Weak pull."],who:"shop",related:["air_filter","turbo","intercooler","egr"]});pe({id:"intercooler",sys:"fuel",name:"Intercooler (position approximate)",local:"Intercooler",bay:!0,what:"An air-to-air radiator that cools the hot compressed air from the turbo. Cooler air is denser, so more oxygen reaches each cylinder for better power and lower exhaust temperatures.",facts:["Both Fortuner diesels have an intercooler (Toyota Astra).","Its exact position was not confirmed. The model shows it on top of the engine, fed by an air guide from the front; treat this as approximate."],care:[["Each wash","Keep the grille and air guide free of leaves and bags."],["Every service","Have the intercooler hoses and clamps checked for leaks or oil."]],signs:["Loss of power with a hissing sound.","Black smoke under load.","Oil on the intercooler hoses."],who:"shop",related:["turbo","intake","grille"]});pe({id:"egr",sys:"fuel",name:"EGR valve & EGR cooler",local:"Katup EGR & EGR cooler",bay:!0,what:"The EGR system sends a measured amount of cooled exhaust gas back into the intake to reduce NOx emissions. The cooler uses engine coolant. Over time, soot and oil mist build up carbon.",facts:["No cleaning interval is published for this model. Workshops clean the EGR only when symptoms or fault codes point to it (general practice)."],care:[["Driving","Regular highway runs help the engine run cleaner than constant short trips."],["As needed","If idle or response gets worse, ask for a diagnosis before paying for cleaning."]],signs:["Rough idle or hesitation.","Black smoke.","The check-engine light.","Coolant loss with no visible leak, which can point to the EGR cooler."],who:"shop",related:["intake","exhaust","hoses"]});pe({id:"exhaust",sys:"fuel",name:"Exhaust: manifold, catalyst & muffler",local:"Knalpot",what:"Hot gas leaves the engine, spins the turbo, passes through a catalytic converter and muffler, and exits at the rear.",facts:[`This guide does not show a diesel particulate filter (DPF). None was confirmed for 2023 Indonesian cars, and the manual's fuel requirement matches Toyota's "without DPF" specification. Ask your dealer if unsure.`],care:[["Every 6 months","Look for rust holes and broken hangers. Listen for new rattles or a louder note."],["As needed","Do not park over dry grass. The exhaust is hot enough to ignite it."]],signs:["A louder exhaust or a ticking leak.","An exhaust smell inside the cabin, which is dangerous. Have it checked at once."],who:"shop",related:["turbo","egr"]});pe({id:"radiator",sys:"cooling",name:"Radiator & radiator cap",local:"Radiator & tutup radiator",bay:!0,what:"The radiator sheds engine heat into the air passing through the grille. Its pressurised cap raises the boiling point of the coolant.",facts:["Filled with Toyota Super Long Life Coolant (pink, pre-mixed). Total coolant capacity is about 7.9\u20139.9 L depending on specification."],care:[["Monthly","Keep the fins clean. The AC condenser sits in front, so clean both together."],["Safety","Never open the radiator cap while the engine is hot."]],interval:[["Coolant","Not confirmed for this model. General Toyota SLLC guidance: first change at 160,000 km, then every 80,000 km"]],signs:["The temperature gauge above its normal position.","Pink crust on the fins or hoses.","A sweet smell."],who:"both",related:["coolant_tank","cooling_fan","hoses","ac_condenser"]});pe({id:"coolant_tank",sys:"cooling",name:"Coolant reservoir (expansion tank)",local:"Tabung reservoir air radiator",ess:!0,bay:!0,what:"This translucent tank lets you see the coolant level. It catches coolant as it expands when hot and returns it to the radiator as it cools.",care:[["Weekly","With the engine cold, the level should be between LOW and FULL."],["Top up","Use Toyota Super Long Life Coolant (pre-mixed). Plain water weakens the protection against rust and boiling."]],interval:[["Replace coolant","Not confirmed for this model; see the Service schedule tab"]],signs:["The level keeps dropping, which means a leak.","The gauge rising in traffic. Stop and let the engine cool before checking."],who:"diy",related:["radiator","hoses"]});pe({id:"cooling_fan",sys:"cooling",name:"Cooling fan & shroud",local:"Kipas radiator & shroud",bay:!0,what:"The fan pulls air through the radiator when the car is slow or stopped, and the shroud channels the airflow.",facts:["The fan type (engine-driven or electric) was not confirmed for this model."],care:[["Every service","Have the blades checked for cracks and the shroud for breaks."],["As needed","Keep hands and clothing away from the fan when the engine is running."]],signs:["Overheating only in traffic.","A loud roaring fan noise that never changes."],who:"shop",related:["radiator","drive_belt"]});pe({id:"hoses",sys:"cooling",name:"Radiator hoses, thermostat & water pump",local:"Selang radiator, thermostat & water pump",bay:!0,what:"Rubber hoses carry coolant between the engine and the radiator. The water pump circulates it, and the thermostat keeps it in the engine until it reaches working temperature.",care:[["Every service","Squeeze the hoses when cold. They should feel firm, not soft, swollen or cracked."],["As needed","Replace swollen hoses before they burst."]],signs:["Coolant drips, especially at the front of the engine.","The temperature takes too long to rise, which suggests the thermostat is stuck open.","Overheating, which suggests it is stuck shut."],who:"shop",related:["radiator","coolant_tank","drive_belt"]});pe({id:"gearbox",sys:"drivetrain",name:"6-speed automatic (6-speed manual on 2.4 G M/T)",local:"Transmisi otomatis / manual",what:"A 6-speed automatic with a torque converter and Sequential Shiftmatic, which lets you change gear with + and \u2212. Only the 2.4 G is also offered with a 6-speed manual and clutch.",facts:["Automatic ratios: 3.600 / 2.090 / 1.488 / 1.000 / 0.687 / 0.580, reverse 3.732; final drive 3.909 (Toyota Astra).","ATF: Toyota ATF WS, about 9.5 L. Inspect every 40,000 km or 24 months; there is no routine replacement in the normal schedule (Toyota's 2024 Thai owner's manual).","2.4 G manual: gear oil GL-3 (GL-4) 75W-90, about 2.7 L, inspect every 40,000 km or 48 months (Thai owner's manual)."],care:[["Driving","Come to a full stop before shifting between D and R."],["Fluids","Use only ATF WS in the automatic."],["Manual","Do not rest your foot on the clutch pedal or hold the car on a slope with the clutch."]],interval:[["ATF (WS)","Inspect every 40,000 km / 24 months"],["Manual gear oil (2.4 G)","Inspect every 40,000 km / 48 months"]],signs:["Slipping, flaring or harsh shifts.","Red fluid spots under the middle of the car.","A transmission warning on the dashboard."],who:"shop",related:["transfer_case","propshaft","gear_lever"]});pe({id:"transfer_case",sys:"drivetrain",name:"Transfer case (4x4 only)",local:"Transfer case / gardan 4x4",what:"Bolted behind the gearbox on the 4x4 GR Sport. It sends drive to the rear only (2H) or to both axles (4H), and has a low range (4L) for steep or slippery ground. You choose with the Easy 4x4 dial.",facts:["The 4x4 GR Sport is the only 2023 Fortuner with 4WD. The 4x2 types are rear-wheel drive and have no transfer case.","Part-time 4WD (Toyota Australia; not confirmed for Indonesia): use 4H and 4L only on loose or slippery surfaces, not on dry tarmac.","Oil: LF 75W, about 1.0 L; inspect every 40,000 km or 48 months (Toyota's 2024 Thai owner's manual)."],care:[["Monthly","Use 4H briefly on a loose or wet surface to keep the parts working (general practice)."],["Shifting","Follow your owner's manual for shifting into and out of 4L."],["Every service","Have it checked for leaks, especially after water crossings."]],interval:[["Oil","Inspect every 40,000 km / 48 months (LF 75W, about 1.0 L)"]],signs:["The 4WD indicator keeps flashing.","Clunks or binding on tight turns, which can mean 4H was left on on tarmac.","Oil wetness on the case."],who:"shop",related:["gearbox","front_propshaft","propshaft","gear_lever"]});pe({id:"propshaft",sys:"drivetrain",name:"Rear propeller shaft & universal joints",local:"Propeller shaft / as kopel belakang",what:"A steel tube that carries drive to the rear axle. Universal joints let it flex as the suspension moves.",care:[["Every service","Have the universal joints checked for play, plus the centre support bearing if your shaft has one. Grease the joints if they have grease nipples."]],signs:["A clunk when pulling away.","Vibration that rises with speed.","Squeaks from under the middle of the car."],who:"shop",related:["gearbox","transfer_case","differential"]});pe({id:"front_propshaft",sys:"drivetrain",name:"Front propeller shaft (4x4 only)",local:"Propeller shaft depan",what:"Carries drive from the transfer case forward to the front differential when 4H or 4L is selected.",care:[["Every service","Have the joints checked for play and greased if they have nipples, especially after off-road use."]],signs:["A clunk when 4WD engages.","Vibration only in 4H or 4L."],who:"shop",related:["transfer_case","front_diff"]});pe({id:"front_diff",sys:"drivetrain",name:"Front differential (4x4 only)",local:"Gardan depan / front differential",what:"Turns the drive 90\xB0 to the two front drive shafts and lets the front wheels turn at different speeds. It is mounted to the frame between the front wheels.",facts:["Oil: hypoid gear oil LT 75W-85 GL-5, about 1.6 L. Replace at 40,000 km and 80,000 km, or every 48 months (Toyota's 2024 Thai owner's manual).","4x2 types have no front differential."],care:[["Every service","Have it checked for leaks."],["After deep water","Ask for the oil to be checked for water (milky oil)."]],interval:[["Oil","Replace at 40,000 / 80,000 km or 48 months (LT 75W-85 GL-5, about 1.6 L)"]],signs:["A whine from the front in 4WD.","Oil wetness on the housing."],who:"shop",related:["front_propshaft","front_driveshafts","front_suspension"]});pe({id:"front_driveshafts",sys:"drivetrain",name:"Front drive shafts & CV joints (4x4 only)",local:"As roda depan & CV joint",what:"Shafts with constant-velocity (CV) joints carry drive to the front hubs while the wheels steer and move up and down. Rubber boots keep the grease in and dirt out.",care:[["Every service","Have the rubber boots checked for tears. A torn boot is cheap to replace early; a dry joint is not."]],signs:["Clicking when turning on full lock under power.","Grease spray on the inside of the front wheel."],who:"shop",related:["front_diff","front_suspension","wheels_tyres"]});pe({id:"differential",sys:"drivetrain",name:"Rear differential, axle & diff lock",local:"Gardan belakang & differential lock",what:"The rear differential turns the drive 90\xB0 to the rear wheels and lets them rotate at different speeds in corners. Both rear wheels share one rigid axle housing.",facts:["The 4x4 GR Sport has a rear differential lock for low-speed off-road use (Toyota Astra; check it on your car). 4x2 types have no diff lock or limited-slip differential.","Oil: hypoid gear oil LT 75W-85 GL-5, about 3.5 L. Replace at 40,000 km and 80,000 km, or every 48 months (Toyota's 2024 Thai owner's manual)."],care:[["Off-road","Use the diff lock only at low speed when a wheel is spinning, and switch it off on firm ground (follow your manual)."],["Every service","Have the axle seals checked for leaks."]],interval:[["Oil","Replace at 40,000 / 80,000 km or 48 months (LT 75W-85 GL-5, about 3.5 L)"]],signs:["A whine that changes on and off the accelerator.","Oil on the inside of the rear wheels.","The diff-lock light keeps flashing."],who:"shop",related:["propshaft","rear_suspension","brakes_rear"]});pe({id:"frame",sys:"chassis",name:"Ladder-frame chassis",local:"Sasis / rangka",what:"Two steel rails joined by cross-members, like a ladder. The body, engine and suspension bolt onto it. This is Toyota's IMV platform, shared with the Hilux, which makes the Fortuner tough on bad roads.",care:[["Every 6 months","Rinse the frame underneath, especially after floods, beaches or mud. Check for rust and cracks around the suspension mounts."]],signs:["Heavy rust scale.","A crooked stance or uneven body-to-frame gaps after an accident."],who:"shop",related:["body_shell","front_suspension","rear_suspension"]});pe({id:"front_suspension",sys:"chassis",name:"Front suspension (double wishbone, coil springs, stabiliser)",local:"Kaki-kaki depan (arm, ball joint, per)",what:"Upper and lower wishbone arms hold each front wheel, with a coil spring and a stabiliser bar to limit body roll. Ball joints and rubber bushings let everything pivot.",facts:["Double wishbone with coil spring and stabiliser (Toyota Astra)."],care:[["Every service","Have the ball joints, bushings and stabiliser links checked for play and torn rubber boots."],["After impacts","After a big pothole or off-road trip, check the wheel alignment."]],signs:["Knocking over bumps.","Wandering steering.","Uneven tyre wear on the inner or outer edge."],who:"shop",related:["shocks","steering","front_driveshafts","wheels_tyres"]});pe({id:"rear_suspension",sys:"chassis",name:"Rear suspension (4-link, coil springs, lateral rod)",local:"Kaki-kaki belakang (link & per)",what:"Four control links locate the rear axle front-to-back, and a lateral (Panhard) rod stops it moving sideways. Coil springs carry the load.",facts:["4-link with lateral rod (Toyota Astra)."],care:[["Every service","Have the link bushings and the lateral-rod mounts checked."],["Loading","Keep within the rated load. Constant overloading sags the springs."]],signs:["The rear sits low.","A clunk from the rear over bumps.","The rear steps sideways on rough corners."],who:"shop",related:["shocks","differential"]});pe({id:"shocks",sys:"chassis",name:"Shock absorbers (x4)",local:"Shockbreaker",what:"Oil-filled dampers that stop the springs bouncing. They keep the tyres pressed onto the road.",care:[["Every service","Check for oil leaking down the body of the shock."],["Typical","Expect to replace them at roughly 60,000\u2013100,000 km depending on roads and loads (general practice)."]],signs:["A floaty, bouncy ride.","The nose dives under braking.","Cupped tyre wear.","An oily shock body."],who:"shop",related:["front_suspension","rear_suspension"]});pe({id:"steering",sys:"chassis",name:"Steering rack, tie rods & column",local:"Steering rack, tie rod & kolom setir",what:"Rack-and-pinion steering. Turning the wheel rotates the column and pinion, which slides the rack. Tie rods then turn the front wheels.",care:[["Every service","Have the tie-rod ends checked for play and the rack boots for tears."],["After alignment","The steering wheel should sit straight when driving straight."]],signs:["Play or a clunk in the steering.","The car pulls to one side.","A torn rubber boot on the rack."],who:"shop",related:["power_steering","front_suspension","steering_wheel"]});pe({id:"power_steering",sys:"chassis",name:"Power-steering pump & fluid reservoir",local:"Pompa & tabung oli power steering",bay:!0,what:"An engine-driven hydraulic pump helps you turn the wheel. The reservoir shows the fluid level.",facts:["Hydraulic power assist (Toyota Australia; confirm for your car).","Toyota's 2024 Thai owner's manual specifies ATF DEXRON II or III for the power steering. Confirm in your Indonesian manual."],care:[["Monthly","Check the fluid level against the marks on the reservoir."],["Driving","Do not hold the steering at full lock for long. It overheats the pump."]],signs:["A whine when turning.","Heavy steering.","Foamy fluid or leaks."],who:"both",related:["steering","drive_belt"]});pe({id:"brakes_front",sys:"chassis",name:"Front ventilated disc brakes",local:"Rem depan: kampas & piringan cakram",ess:!0,what:"Ventilated discs squeezed by pads in a hydraulic caliper. They do most of the braking work.",facts:["Ventilated discs front and rear, with ABS, EBD and Brake Assist on all types (Toyota Astra)."],care:[["Every service","Have the pad thickness measured. Workshops usually replace pads below about 2\u20133 mm."],["As needed","Resurface or replace discs that are scored or warped."],["Driving","On long descents use a lower gear, or DAC on the 4x4 off-road, so the brakes do not overheat."]],signs:["A squeal from the wear indicator.","Grinding.","The steering wheel shakes when braking.","The car pulls to one side."],who:"shop",related:["brake_master","brakes_rear","abs_unit","wheels_tyres"]});pe({id:"brakes_rear",sys:"chassis",name:"Rear ventilated disc brakes & parking brake",local:"Rem belakang: cakram & rem parkir",what:"Unlike older Toyota MPVs with rear drums, the Fortuner has ventilated discs at the rear too. The parking brake also acts on the rear wheels.",facts:["How the parking brake is built and adjusted was not confirmed here. Ask your workshop to check it at services."],care:[["Every service","Have the pads, discs and calipers checked."],["Monthly","Check the parking brake holds the car on a slope."]],signs:["The parking brake does not hold the car.","Grinding or brake-fluid wetness inside the rear wheels."],who:"shop",related:["brakes_front","differential","brake_master"]});pe({id:"brake_master",sys:"chassis",name:"Brake master cylinder, booster & fluid",local:"Master rem, booster & minyak rem",ess:!0,bay:!0,what:"Your foot pushes the master cylinder, helped by the large vacuum booster, which sends fluid pressure to all four brakes. The translucent reservoir shows the level.",facts:["Brake fluid: DOT 3 or DOT 4. Replace every 40,000 km or 24 months (Toyota's 2024 Thai owner's manual)."],care:[["Weekly","Check the level is between MIN and MAX. Do not overfill."],["Every 40,000 km / 24 months","Replace the fluid. It absorbs water over time, which lowers its boiling point and corrodes parts."]],interval:[["Replace","Every 40,000 km or 24 months"]],signs:["A soft or sinking pedal.","The red BRAKE warning light.","Dark fluid."],who:"both",related:["brakes_front","brakes_rear","abs_unit"]});pe({id:"abs_unit",sys:"chassis",name:"ABS / VSC actuator & stability systems",local:"Modul ABS / VSC",bay:!0,what:"A hydraulic unit with valves and a pump, controlled by its own computer. It stops the wheels locking (ABS), balances braking front to rear (EBD), adds force in a panic stop (BA), brakes single wheels for stability (VSC) and traction (TRC), and holds the brakes briefly on hill starts (HSA). On the 4x4 it also runs Downhill Assist Control (DAC).",facts:["All 2023 types: ABS, EBD, BA, VSC, TRC, Hill-start Assist, Emergency Brake Signal and Trailer Sway Control. DAC is on the 4x4 only (Toyota Astra).","2023 cars do not have Toyota Safety Sense; it arrived with the September 2024 update.","Its position in the model is approximate."],care:[["Tyres","Keep all four tyres the same size and similar wear. The systems compare wheel speeds."],["Every 40,000 km / 24 months","Fresh brake fluid protects the valves inside the unit."]],signs:["The ABS, VSC or slip warning light stays on.","A buzzing pedal on dry roads, which is not normal."],who:"shop",related:["brake_master","brakes_front","instrument_cluster"]});pe({id:"wheels_tyres",sys:"chassis",name:"Tyres & alloy wheels",local:"Ban & velg",ess:!0,ext:!0,what:"The only contact with the road. The 2.8 types use 265/60 R18 tyres; the 2.4 G uses 265/65 R17.",facts:["265/60 R18 on the 2.8 VRZ and GR Sport (black alloys on the GR Sport); 265/65 R17 on the 2.4 G (Toyota Astra).","Tyre pressures: use the placard on the driver's door pillar.","Wheel nuts: tighten to the torque in your owner's manual with a torque wrench."],care:[["Monthly","Check pressures cold and look for cuts, bulges and nails."],["At services","Rotate the tyres, and balance them if you feel vibration (general practice)."],["Replace","At the wear bar (1.6 mm), or after about 5\u20136 years because the rubber ages (general practice)."]],signs:["Vibration at speed.","Uneven wear on one edge, which points to alignment.","A tyre that keeps losing pressure."],who:"both",related:["spare_tyre","front_suspension","brakes_front"]});pe({id:"spare_tyre",sys:"chassis",name:"Spare tyre, jack & tools",local:"Ban serep & dongkrak",what:"A full-size alloy spare (Oto). It is usually slung under the rear floor and lowered with the jack handle; check your manual for the winch procedure.",care:[["Monthly","Check the spare's pressure. It is often forgotten until you need it."],["Every 6 months","Lower and raise the spare once so the winch does not seize."]],signs:["A seized winch.","A flat or cracked spare."],who:"diy",related:["wheels_tyres","rear_bumper"]});pe({id:"ac_compressor",sys:"ac",name:"AC compressor",local:"Kompresor AC",bay:!0,what:"The heart of the AC. The drive belt turns it to pump refrigerant around the system.",facts:["Refrigerant type and amount were not confirmed here. They are on the label under the bonnet."],care:[["Weekly","Run the AC regularly. The oil carried in the refrigerant keeps the seals lubricated."],["Every service","Have the belt checked and listen for unusual compressor noise."]],signs:["A loud clicking or grinding when the AC is on.","The engine bogs badly with the AC on.","Warm air."],who:"shop",related:["drive_belt","ac_condenser","ac_lines"]});pe({id:"ac_condenser",sys:"ac",name:"AC condenser & receiver/drier",local:"Kondensor & dryer AC",bay:!0,what:"A thin radiator in front of the engine radiator. It releases the heat taken out of the cabin, turning hot refrigerant gas back into liquid. The receiver/drier stores refrigerant and absorbs moisture; on some designs it is built into the condenser.",care:[["Monthly","Rinse insects and dust from the fins with gentle water, not a high-pressure jet that bends them."],["Yearly","Have it deep-cleaned during the AC service."],["When opened","The drier or its desiccant is replaced after a major leak repair."]],signs:["The AC is cold on the move but weak in traffic.","Oily spots on the fins, which mean a refrigerant leak."],who:"both",related:["radiator","grille","ac_lines"]});pe({id:"ac_front_unit",sys:"ac",name:"Front evaporator & blower (dual-zone)",local:"Evaporator depan & blower",what:"The front evaporator is a cold mini-radiator behind the dashboard. The blower pushes cabin air through it and out of the vents, with separate temperature blending for driver and passenger. Moisture condenses on it and drains outside.",facts:['"New Adaptable Auto A/C with Dual Zone" on all 2023 types (Toyota Astra).'],care:[["Yearly","Have the evaporator cleaned. This common Indonesian service removes mould and odours."],["Daily habit","Switch the AC off a minute before arriving but keep the fan on. This dries the evaporator and reduces smell."]],signs:["A musty smell.","Weak airflow.","Water dripping into the footwell, which means a blocked drain."],who:"shop",related:["cabin_filter","ac_controls","ac_lines"]});pe({id:"cabin_filter",sys:"ac",name:"Cabin (AC) filter",local:"Filter kabin / filter AC",ess:!0,what:"A pleated filter that cleans the air entering the front AC.",facts:["Location not confirmed for this model. On most Toyotas it is behind the glovebox; check your owner's manual. The model shows it there."],care:[["Every service","Have it tapped or blown clean."],["When dirty","Replace it. In dusty city use it clogs quickly."]],interval:[["Clean","Every periodic service"],["Replace","When dark or clogged (general practice)"]],signs:["Weak front airflow.","A dusty smell.","Windows fog up easily."],who:"diy",related:["ac_front_unit","dashboard"]});pe({id:"ac_rear_unit",sys:"ac",name:"Rear AC unit & roof vents",local:"AC belakang & kisi-kisi plafon",what:"A second evaporator and blower cool the second and third rows through vents in the roof duct.",facts:["Rear roof vents are fitted (Oto).","The location of the rear unit was not confirmed. The model shows a plausible spot behind the right-rear trim; yours may differ."],care:[["Yearly","Include the rear unit in the AC cleaning. It is often skipped."],["Monthly","Run the rear blower now and then so it does not smell musty."]],signs:["Water dripping from the roof vents or the rear trim.","A musty smell in the back.","Rear vents blowing warm."],who:"shop",related:["ac_lines","roof","ac_controls"]});pe({id:"ac_lines",sys:"ac",name:"Refrigerant lines & service ports",local:"Pipa freon",what:"Aluminium pipes and rubber hoses link the compressor, condenser and both evaporators. The long lines to the rear unit run under the floor.",care:[["Yearly","Have the pressures checked during the AC service. Refrigerant should not need regular top-ups."],["As needed","If a top-up is needed, ask for a leak test first. The under-bonnet label gives the correct refrigerant amount."]],signs:["Oily dirt at pipe joints, which means a leak.","Hissing.","The AC slowly gets warmer over weeks."],who:"shop",related:["ac_compressor","ac_rear_unit","ac_front_unit"]});pe({id:"ac_controls",sys:"ac",name:"Dual-zone AC control panel & vents",local:"Panel AC & kisi-kisi",what:"The front panel sets each zone's temperature, fan speed, airflow direction, fresh or recirculated air, and the rear blower.",facts:["Automatic dual-zone climate control on all 2023 types (Toyota Astra)."],care:[["Daily habit","AUTO mode is usually the most efficient. Use recirculation in traffic and smoke; switch to fresh air sometimes to stop windows fogging."],["As needed","Dust the vents with a soft brush."]],signs:["The fan works only on top speed.","Air comes out of the wrong vents.","One zone stays warm."],who:"diy",related:["ac_front_unit","ac_rear_unit"]});pe({id:"battery",sys:"electrical",name:"Battery (12 V)",local:"Aki",ess:!0,bay:!0,what:"Powers the starter motor and glow plugs, and runs the electrics when the engine is off. The alternator recharges it.",facts:["Battery size and rating were not confirmed for this model. Read the label on your battery and replace it with the same size and rating."],care:[["Monthly","Check the terminals are tight and free of white or green powder. Clean with warm water and baking soda."],["Every service","Have it load-tested. In tropical heat batteries often last only 2\u20133 years (general practice)."],["Wet batteries","Keep the electrolyte between the marks with distilled water only."]],signs:["Slow cranking.","A clicking sound when starting.","The battery light on the dashboard.","A swollen case."],who:"both",related:["alternator","starter","fuse_boxes","glow_plugs"]});pe({id:"alternator",sys:"electrical",name:"Alternator",local:"Alternator / dinamo ampere",bay:!0,what:"A belt-driven generator that recharges the battery and powers everything while the engine runs.",care:[["Every service","Have the belt checked. A slipping belt means undercharging."],["As needed","Have the charging voltage tested if the lights dim or the battery keeps going flat."]],signs:["The battery warning light while driving.","Lights that dim at idle.","A whining noise."],who:"shop",related:["battery","drive_belt"]});pe({id:"starter",sys:"electrical",name:"Starter motor",local:"Dinamo starter",bay:!0,what:"A powerful electric motor that cranks the engine. Diesels need a lot of cranking force because of their high compression.",care:[["Starting","If the engine does not start, wait a few seconds before trying again, and follow your manual."]],signs:["A single click with no crank.","A grinding noise when starting.","Slow cranking with a good battery."],who:"shop",related:["battery","smart_key","glow_plugs"]});pe({id:"fuse_boxes",sys:"electrical",name:"Fuse & relay boxes",local:"Kotak sekring & relay",bay:!0,what:"There is a box in the engine bay and another inside the cabin. Fuses protect each circuit from overload.",facts:["See the fuse section of your owner's manual for the exact cabin box location and fuse map."],care:[["Keep in car","Keep a few spare fuses. The lid or manual shows what each fuse protects."],["As needed","Replace a blown fuse only with the same rating. If it blows again, have the fault found."]],signs:["A single item suddenly dead, such as a power socket, the audio or one light."],who:"diy",related:["battery","harness"]});pe({id:"ecu",sys:"electrical",name:"Engine ECU & sensors",local:"ECU (komputer mesin)",what:"The engine computer reads sensors (air flow, temperatures, rail pressure, pedal position, crankshaft and camshaft) and controls the injectors, turbo vanes, EGR and pump. It stores fault codes when something goes wrong.",facts:["ECU location not confirmed for this model. The model shows it behind the dashboard."],care:[["As needed","If the check-engine light comes on, a workshop can read the codes with a scan tool."],["Washing","Do not high-pressure wash the engine bay or wiring connectors."]],signs:["The check-engine light.","Limp mode with low power."],who:"shop",related:["injectors","turbo","harness"]});pe({id:"harness",sys:"electrical",name:"Wiring harness & earth straps",local:"Kabel body & massa",what:"Bundles of wires and connectors run through the whole car. Earth (ground) straps link the engine and body back to the battery's negative terminal.",care:[["As needed","Avoid cheap add-on accessories that tap into the factory wiring."],["Pests","Rats can chew wiring in parked cars. Keep the engine bay clean and check for droppings."]],signs:["Flickering lights or intermittent faults.","A burning smell.","Chewed insulation."],who:"shop",related:["fuse_boxes","battery","ecu"]});pe({id:"headlamps",sys:"electrical",name:"LED headlamps, DRL & turn signals",local:"Lampu utama LED & sein",ext:!0,what:"Slim headlamps with low and high beam, a daytime running light strip and front turn signals.",facts:["LED headlamps are listed for the 2.8 types; for the 2023 2.4 G, confirm on your car.","LED units are usually replaced as a complete assembly rather than a bulb (general practice)."],care:[["Weekly","Check low and high beam, the DRL and both turn signals."],["As needed","Polish hazy lenses, and have the beam aim checked after a knock."]],signs:["A section of the lamp is out.","A turn signal that flashes fast.","Condensation inside the lens."],who:"diy",related:["fog_lamps","tail_lamps","fuse_boxes"]});pe({id:"fog_lamps",sys:"electrical",name:"Fog lamps",local:"Lampu kabut",ext:!0,what:"Low-mounted lamps in the bumper corner pods for heavy rain and fog. Do not use them to dazzle oncoming drivers.",care:[["Monthly","Check they work and the lenses are not cracked."]],signs:["Water inside the lens.","A lamp that is out."],who:"diy",related:["headlamps","front_bumper"]});pe({id:"tail_lamps",sys:"electrical",name:"Tail, stop & turn lamps (incl. high-mount stop lamp)",local:"Lampu belakang & lampu rem",ess:!0,ext:!0,what:"Wide rear lamp clusters that wrap around the corners and continue onto the back door, with tail, brake, turn and reverse functions. A high-mount stop lamp sits in the roof spoiler.",care:[["Weekly","Ask someone to watch while you brake, reverse and signal, or check the reflection in a wall."]],signs:["A brake light out, which is a rear-end collision risk.","Fast flashing.","Water inside a lens."],who:"diy",related:["headlamps","back_door"]});pe({id:"horn",sys:"electrical",name:"Horn",local:"Klakson",what:"An electric horn behind the grille, worked by the steering-wheel pad.",care:[["Monthly","A quick test."]],signs:["A weak or no sound, often from a corroded connector after rain or flooding."],who:"diy",related:["fuse_boxes","steering_wheel"]});pe({id:"wipers",sys:"electrical",name:"Wipers & washer system",local:"Wiper & tabung air wiper",ess:!0,ext:!0,what:"Front and rear wipers driven by electric motors, plus a washer reservoir in the engine bay that feeds the jets.",care:[["Monthly","Top up the washer reservoir with water and wash
